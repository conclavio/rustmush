# cargo-nextest's configuration (test-strategy cut T.1, 2026-10-26).
#
# nextest runs every test in a process of its own and schedules the whole
# invocation's tests into one pool, across binaries, where `cargo test` runs
# one binary at a time with the harness's threads inside it. That is where the
# shards' idle tail goes (a binary with one slow test held its shard while the
# other threads sat empty), and it is also why the serialization the tree
# does with in-binary mutexes has to be restated here: a `static Mutex` in a
# test file serializes the tests of one process, and under nextest each test
# is its own process. The locks the tree holds, and what each becomes:
#
#   mush-store/tests/redis_suite.rs            REDIS_LOCK   db 0, wipes namespaces
#   mush-gateway/tests/split_halves/authoritative_process_kill.rs  PROCESS_LOCK  db 0, kills children
#   mushd/tests/durable_process/durability_e2e.rs              CHILD_LOCK   BGSAVE is instance-wide
#   mush-bot/tests/arena_e2e.rs                ARENA        one arena world at a time
#   tacsim/tests/cost_lane.rs                  LANE_LOCK    timing that feeds a gate
#
# Under `cargo test` each of those binaries ran its tests one at a time with
# nothing else running (cargo runs binaries one after another, and the
# binary's other threads waited on the lock), so each of them ran ALONE. The
# `threads-required = "num-test-threads"` override below keeps exactly that:
# a test of those binaries takes the whole pool while it runs. A later cut
# can relax one with the JUnit timings this cut starts collecting.
#
# Every binary that reads REDIS_URL is in the `redis` group (one at a time):
# they share the instance (logical dbs 0-15, wiped per test; BGSAVE is
# instance-wide), which is what `redis-faults` runs with `--test-threads=1`.
# The group only bites when REDIS_URL is set; without it those tests take
# their in-memory or skip branch.
#
# The load-sensitive suites (the 16b doc's list: the ones that flaked under a
# loaded box and passed alone) are the `load-sensitive` group, two at a time.
# The group is a load limit only. It carried one retry until doc 51 unit FL.2
# (2026-11-23).
#
# RETRIES (doc 51 §4.3, ruling Q-51-5): there is no blanket retry and no
# hand-kept retry filter. A test is retried once only while it has a row in
# crates/mush-contract-tests/flaky-known.toml, and a row lives fourteen days.
# The one retry override below is GENERATED from that list, between the
# `BEGIN GENERATED` and `END GENERATED` lines; the gate
# crates/mush-contract-tests/tests/ci_policy/flaky_known.rs fails on a block
# that differs from the list and on a `retries` key anywhere else in this
# file. A pass on retry is reported FLAKY, in the run's final status and as a
# <flakyFailure> in the JUnit report; scripts/flake_report.py reads those.
#
# Profiles: `default` is the local run (eight test threads on the owner's
# sixteen-thread box, nothing terminated, every slow test named at 60 s);
# `ci` (`-P ci`) is the test job's: no fail-fast, a hung test terminated at
# 20 min instead of holding the job to its 120-minute timeout, and the JUnit
# report at target/nextest/ci/junit.xml, which each shard uploads. Doc-tests
# are not nextest's: every `cargo nextest run` sweep in CI has a
# `cargo test --doc` beside it. `soak` (`-P soak`) is the nightly soak's
# (.github/workflows/soak.yml, scripts/soak.sh): `ci` with four threads and
# no retry at all, so a flake shows as a failure with its output.
#
# `cargo nextest show-config test-groups -p <pkg>` lists the groups and their
# members; `cargo nextest run -p <pkg>` is the local sweep (`-E 'test(name)'`
# filters, `--run-ignored only` for the #[ignore]d).

nextest-version = "0.9.148"

[test-groups]
# Everything that reads REDIS_URL: one live Redis, shared.
redis = { max-threads = 1 }
# The suites that flake under load: two at a time, the rest of the pool
# filled by other binaries' tests.
load-sensitive = { max-threads = 2 }

[profile.default]
# The local run. Half the owner's sixteen logical threads: the box is shared
# with other sessions and a compile (cargo's own `jobs` stays what
# ~/.cargo/config.toml says). `-j N` on the command line overrides.
test-threads = 8
# The whole picture, as `cargo test --no-fail-fast`.
fail-fast = false
# Name every test slower than a minute; terminate nothing locally.
slow-timeout = { period = "60s" }
# Slow tests and flaky passes listed at the end, beside failures.
final-status-level = "slow"

# The in-binary locks, as they ran under cargo test: alone.
[[profile.default.overrides]]
filter = 'binary_id(mush-store::redis_suite) | (binary_id(mush-gateway::split_halves) & test(/^authoritative_process_kill::/)) | (binary_id(mushd::durable_process) & test(/^durability_e2e::/)) | binary_id(mush-bot::arena_e2e) | binary_id(tacsim::cost_lane)'
threads-required = "num-test-threads"

# Every REDIS_URL reader (crates/mush-contract-tests/tests/ci_policy/ci_gated_test_inventory.rs
# is the census of the integration ones; the two lib proofs are mush-server's
# persist and timeline tests, #[ignore]d, both named `redis`).
[[profile.default.overrides]]
filter = 'binary_id(mush-store::redis_suite) | binary_id(mush-store::memory_suite) | (binary_id(mushd::durable_process) & test(/^persistence::/)) | (binary_id(mushd::durable_process) & test(/^durability_e2e::/)) | (binary_id(mushd::durable_process) & test(/^m10c_e2e::/)) | (binary_id(mush-server::split_boundary) & test(/^authoritative_boot::/)) | (binary_id(mush-gateway::split_halves) & test(/^authoritative_process_kill::/)) | (binary_id(mush-contract-tests::ci_policy) & test(/^scale_harness::/)) | (binary_id(mush-server) & test(~redis))'
test-group = 'redis'

# The load-sensitive suites (16b: "passed alone twice" was the flake rule),
# two at a time. No retry rides on this override any more: the retry is the
# generated block below, and this list is only a load limit.
[[profile.default.overrides]]
filter = '(binary_id(mushd::world_journeys) & test(/^scripting_e2e::/)) | (binary_id(mushd::sim_lenses) & test(/^sim_reflex::/)) | (binary_id(mushd::durable_process) & test(/^load_soak::/)) | (binary_id(mushd::durable_process) & test(/^world_fault::/)) | (binary_id(mushd::durable_process) & test(/^relay_bridge::/)) | (binary_id(mushd::sim_lenses) & test(/^observer_rule::/)) | (binary_id(mushd::sim_lenses) & test(/^arena_story::/)) | (binary_id(mush-gateway::split_halves) & test(/^two_process_e2e::/)) | (binary_id(mush-gateway::split_halves) & test(/^server_unit::/)) | (binary_id(mush-gateway::split_halves) & test(/^server_panic_relaunch::/)) | (binary_id(mush-gateway::split_halves) & test(/^restart_survival::/)) | (binary_id(mush-gateway::split_halves) & test(/^arena_story_split::/)) | (binary_id(mush-gateway::split_halves) & test(/^two_gateways::/)) | (binary_id(mush-gateway::split_halves) & test(/^gateway_generations::/)) | (binary_id(mush-gateway::split_halves) & test(/^gateway_generations_unit::/)) | (binary_id(mush-server::split_boundary) & test(/^ipc_authoritative_action::/)) | (binary_id(mush-server::split_boundary) & test(/^ipc_teardown::/)) | (binary_id(mush-server::split_boundary) & test(/^ipc_window::/)) | binary_id(mush-worldgen::plan) | binary_id(mush-worldgen::review_plan) | binary_id(mush-worldgen::s8_authority) | (binary_id(mush-sim) & test(~e7c6_b2)) | (binary_id(mush-server) & test(~what_still_waits))'
test-group = 'load-sensitive'

# BEGIN GENERATED flaky-known (doc 51 FL.2). This block is generated from
# crates/mush-contract-tests/flaky-known.toml: one term a row, one retry, nothing else.
# Do not edit it. Change the list, then regenerate:
#   FLAKY_KNOWN_BLESS=1 cargo test -p mush-contract-tests --test ci_policy flaky_known::
[[profile.default.overrides]]
filter = '''
    (binary_id(mush-bot::mining_cohort) & test(=a_bot_hires_launches_mines_recovers_and_sells_with_a_detachment))
  | (binary_id(mush-bot::mining_cohort) & test(=a_captain_and_its_escort_fight_the_raider_in_an_ic_field))
  | (binary_id(mush-gateway::split_halves) & test(/^arena_story_split::/))
  | (binary_id(mush-gateway::split_halves) & test(/^gateway_generations_unit::/))
  | (binary_id(mush-gateway::split_halves) & test(/^server_panic_relaunch::/))
  | (binary_id(mush-gateway::split_halves) & test(/^two_gateways::/))
  | (binary_id(mush-gateway::split_halves) & test(/^two_process_e2e::/))
  | (binary_id(mush-gateway::split_halves) & test(=arena_custody_split::a_pilot_in_a_pod_across_a_boarding_crash_reads_the_hatch_line))
  | (binary_id(mush-gateway::split_halves) & test(=arena_custody_split::the_arena_surface_survives_the_split_and_a_server_restart))
  | (binary_id(mush-gateway::split_halves) & test(=gateway_generations::a_drains_while_b_serves_and_every_session_is_warned_then_moved))
  | (binary_id(mush-gateway::split_halves) & test(=gateway_generations::a_finish_warns_once_closes_after_the_grace_and_leaves_no_marker))
  | (binary_id(mush-gateway::split_halves) & test(=restart_survival::client_disconnect_during_gap_leaves_survivor_intact))
  | (binary_id(mush-gateway::split_halves) & test(=restart_survival::restart_mid_scene_resumes_in_current_room))
  | (binary_id(mush-gateway::split_halves) & test(=server_unit::a_gateway_started_before_its_server_serves_the_gap_then_heals))
  | (binary_id(mush-server) & test(=world_task::tests::what_still_waits_when_the_loop_ends_is_answered_not_dropped))
  | (binary_id(mush-server::commerce_composition) & test(=ic_buyout_dormancy::ic13_a_buyout_is_refused_under_way_cleared_elsewhere_or_with_goods_moving))
  | (binary_id(mush-server::commerce_composition) & test(=ic_buyout_dormancy::sm2_a_week_of_hops_trips_no_recall))
  | (binary_id(mush-server::split_boundary) & test(/^ipc_authoritative_action::/))
  | (binary_id(mush-server::split_boundary) & test(/^ipc_window::/))
  | (binary_id(mush-server::split_boundary) & test(=boot_parity::stop_ledger_archive_joins_the_pass_rather_than_detaching_it))
  | (binary_id(mush-sim) & test(=journey::tests::e7c6_b2_a_leg_boundary_overflow_is_visible_not_silent))
  | (binary_id(mush-sim) & test(=journey::tests::e7c6_b2_the_leg_cursor_is_the_idempotency_key))
  | (binary_id(mush-sim) & test(=journey::tests::e7c6_b2_the_wire_re_runs_max_legs_and_every_invariant))
  | (binary_id(mushd::durable_process) & test(/^load_soak::/))
  | (binary_id(mushd::durable_process) & test(/^world_fault::/))
  | (binary_id(mushd::durable_process) & test(=relay_bridge::r6b_real_bridge_delivers_only_to_arrived_observers_and_deduplicates_provider_retries))
  | (binary_id(mushd::sim_lenses) & test(/^sim_reflex::/))
  | (binary_id(mushd::sim_lenses) & test(=arena_story::two_pilots_walk_in_fight_and_one_tank_is_destroyed))
  | (binary_id(mushd::world_journeys) & test(/^scripting_e2e::/))
  | (binary_id(mushd::world_journeys) & test(=web_e2e::spa_if_built_and_healthz_are_served))
  | binary_id(mush-worldgen::plan)
  | binary_id(mush-worldgen::review_plan)
  | binary_id(mush-worldgen::s8_authority)
'''
retries = 1
# END GENERATED flaky-known

[profile.ci]
# The hosted runner's four threads, all of them (`num-cpus` is nextest's
# default; named so the local eight above is read as the exception).
test-threads = "num-cpus"
# A shard runs to the end and reports every failure, as `--no-fail-fast`.
fail-fast = false
# A test past a minute is named as it runs; past twenty, it is terminated
# (SIGTERM, then SIGKILL after the 10 s grace) and fails, where `cargo test`
# held the job to its 120-minute timeout and took the shard's log with it.
slow-timeout = { period = "60s", terminate-after = 20 }
# Failures and flaky passes at the end; slow tests are in the JUnit times.
final-status-level = "flaky"

[profile.ci.junit]
# target/nextest/ci/junit.xml: one <testsuite> a binary, one <testcase> a
# test with its time, <flakyFailure> for a pass on retry. Each shard uploads
# it as `nextest-junit-<shard>`; the per-test times are what the next
# per-domain-binary deltas (doc 43 rule 2.3 #14) read.
path = "junit.xml"
report-name = "rustmush-ci"

# `ci-bot` (`-P ci-bot`) is `ci` again, for the VPS gate's mush-bot
# invocation, which .github/workflows/gate.yml runs in the background under
# the engine's sweep (2026-10-27: the bot's nine-minute mining canary was the
# sweep's tail; now it runs while the engine's crates compile and test). A
# profile of its own so its store directory, and so its JUnit report, lands
# at target/nextest/ci-bot/ apart from the engine's at target/nextest/ci/.
# Profiles inherit `default`, not each other, so the ci settings are
# restated; keep the two in step.
[profile.ci-bot]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }
final-status-level = "flaky"

# Doc 40 FR.7's round story: about an hour a size (the segment beat at the
# ledger's 1 MiB floor), run by name through the gate's sweep with
# `--run-ignored only`; the profile's twenty minutes would terminate it.
[[profile.ci-bot.overrides]]
filter = 'binary_id(mush-bot::mining_cohort) & test(/^fr7_round::/)'
slow-timeout = { period = "60s", terminate-after = 100 }

[profile.ci-bot.junit]
path = "junit.xml"
report-name = "rustmush-ci-bot"

# `soak` (`-P soak`) is the nightly soak's (doc 51 §4.1, unit FL.2): the story
# suites repeated on conclav.dev, six cells of four cores, by scripts/soak.sh.
# It is `ci` again (profiles inherit `default`, not each other) with the
# cell's four threads, and it NEVER retries (doc 51 §4.3 point 4): the
# override below outranks the generated retry of the default profile, because
# a profile's own overrides are read first, so a flake is a failure in the
# report with its output and not a quiet pass. The groups and the run-alone
# override of `default` still apply; REDIS_URL is unset in a cell, so the
# `redis` group's tests take their in-memory or skip branch.
[profile.soak]
test-threads = 4
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }
final-status-level = "fail"

[[profile.soak.overrides]]
filter = 'all()'
retries = 0

[profile.soak.junit]
# <the cell's workspace>/target/nextest/soak/junit.xml, moved aside by
# scripts/soak.sh after every invocation: one file a pass of one package.
path = "junit.xml"
report-name = "rustmush-soak"
