# Redis for the rustmush "dev1" instance — a SEPARATE instance from the box's
# default redis (127.0.0.1:6379), which is the port-forwarded DEVELOPMENT
# instance whose namespaces the gated test suite wipes. dev1 keeps its own data
# so tests can never touch prod. Managed by redis-dev1mush.service.

port 6788
bind 127.0.0.1 -::1
protected-mode yes

# Durability: append-only log, fsync once per second (bounded loss on crash) +
# periodic RDB snapshots for backups.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

dir /var/lib/redis-dev1mush
logfile /var/log/redis/redis-dev1mush.log
pidfile /run/redis-dev1mush/redis.pid
daemonize no
supervised systemd
