# /etc/sshdoorway/logrotate.conf — doc 29 §8.1 (D-29-18).
# Run every 15 minutes by sshdoorway-logrotate.timer with its own state file,
# so the 20 MB cap holds within a quarter hour.
/var/log/sshdoorway/*.log {
    daily
    maxsize 20M
    rotate 60
    maxage 14
    compress
    nodelaycompress
    compresscmd /usr/bin/zstd
    compressoptions -10 -T0 -q
    compressext .zst
    uncompresscmd /usr/bin/unzstd
    missingok
    notifempty
    sharedscripts
    postrotate
        systemctl kill --signal=USR2 'sshdoorway@*' >/dev/null 2>&1 || true
    endscript
}
