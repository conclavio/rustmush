# /etc/tmpfiles.d/sshdoorway.conf — doc 29 §4.1, 29a A-1.
# The trusted-ingress directory: setgid, so every socket an instance's gateway
# creates in it inherits group sshdoorway. The gateway chmods its socket 0660.
d /run/rustmush-ssh 2750 mush sshdoorway -
# The doorway's log directory (§8.1).
d /var/log/sshdoorway 0750 sshdoorway sshdoorway -
