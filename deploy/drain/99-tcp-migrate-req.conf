# /etc/sysctl.d/99-rustmush-gateway.conf — doc 33 §4.4 (cut GG.4).
# Installed by deploy/<inst>-split/deploy.sh when the doorway's
# 99-sshdoorway.conf is not on the box (both set the same key; one is enough).
# Closing a listener in an SO_REUSEPORT group resets the connections waiting
# in its accept queue unless the kernel migrates them to another listener in
# the group: the gateway generation that drains closes its SSH and web
# listeners while its successor keeps theirs. Linux 5.14+; covers IPv4 and
# IPv6. The gateway warns at startup when this is off.
net.ipv4.tcp_migrate_req = 1
