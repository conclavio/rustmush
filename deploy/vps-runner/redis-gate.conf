# The VPS gate's private Redis (deploy/vps-runner/provision.sh installs this
# as /etc/redis/redis-gate.conf, run by redis-gate.service): what
# .github/workflows/gate.yml's sweep sets REDIS_URL to, wiped (FLUSHALL)
# before every sweep. The shape is CI's disposable Redis in the redis-faults
# job (appendonly with appendfsync always, the durability tests' contract)
# with the modules the store needs, as the dev1 and dev2 instances load them.
# Loopback only; nothing on this box but the gate's jobs reads it.
port 6799
bind 127.0.0.1 -::1
protected-mode yes
loadmodule /usr/lib/redis/modules/rejson.so
loadmodule /usr/lib/redis/modules/redisearch.so
loadmodule /usr/lib/redis/modules/redisbloom.so
loadmodule /usr/lib/redis/modules/redistimeseries.so
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
dir /var/lib/redis-gate
logfile /var/log/redis/redis-gate.log
pidfile /run/redis-gate/redis.pid
daemonize no
supervised systemd
