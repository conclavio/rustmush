# systemd drop-in for the runner's service
# (/etc/systemd/system/actions.runner.conclavio-rustmush.conclav-vps.service.d/
# override.conf, installed by deploy/vps-runner/provision.sh). Every job the
# runner starts inherits these: under contention the dev1 and dev2 game
# servers and the production Redis on this box win the cores and the disk,
# and a sweep's links cannot push them into swap. MemoryHigh is conclav.io's;
# provision.sh writes the box's own in its place (RUNNER_MEMORY_HIGH: 56G on
# conclav.dev, which shares its box with nothing).
[Service]
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7
MemoryHigh=22G
# systemd's default soft limit is 1024 open files; a nextest run is many
# processes and a cargo build many files. The hosted runners' value.
LimitNOFILE=65536
