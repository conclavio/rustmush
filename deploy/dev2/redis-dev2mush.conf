# Redis for the rustmush "dev2" instance — a SEPARATE instance from the box's
# default redis (127.0.0.1:6379), which is the port-forwarded DEVELOPMENT
# instance whose namespaces the gated test suite wipes. dev2 keeps its own data
# so tests can never touch prod. Managed by redis-dev2mush.service.

port 6791
bind 127.0.0.1 -::1
protected-mode yes

# Redis 8 data-structure modules — the SAME set the box's default instance
# loads (rejson = JSON.SET, redisearch = FT.CREATE; rustmush needs both). Paths
# per the packages.redis.io install. Without these the world seed (JSON.SET)
# fails at boot.
loadmodule /usr/lib/redis/modules/rejson.so
loadmodule /usr/lib/redis/modules/redisearch.so
loadmodule /usr/lib/redis/modules/redisbloom.so
loadmodule /usr/lib/redis/modules/redistimeseries.so

# Durability: append-only log, fsync once per second (bounded loss on crash) +
# periodic RDB snapshots for backups.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

dir /var/lib/redis-dev2mush
logfile /var/log/redis/redis-dev2mush.log
pidfile /run/redis-dev2mush/redis.pid
daemonize no
supervised systemd
