# rustmush dev2 production config. deploy.sh substitutes __EXTERNAL_IP__ with
# the box's public IPv4 (never 0.0.0.0, never the tailscale address) before
# installing this to /opt/rustmush/dev2/mushd.toml.

[server]
name = "rustmush dev2 (SR5)"
data_dir = "/opt/rustmush/dev2/data"
help_dir = "/opt/rustmush/dev2/build/docs/help"

[store]
store = "redis"
redis_url = "redis://127.0.0.1:6791"     # the dev2 instance — NOT the dev 6379

[ssh]
listen = "__EXTERNAL_IP__:6792"          # external IP only (off tailscale)

# The forked gateway<->server boundary socket (M16c). IGNORED by the all-in-one
# `mushd`; read by `mush-gateway`/`mush-server` in the split (hot-restart)
# deployment — see deploy/dev1-split/. The boundary is UNAUTHENTICATED (the
# server trusts whatever connects to assert authenticated sessions), so it must
# never be reachable off-box. A UNIX SOCKET (not a localhost TCP port) is used so
# only the mush user can connect — a 127.0.0.1 port would let ANY local process
# impersonate the gateway. The socket lives in /run/rustmush, which the gateway's
# systemd unit provides via `RuntimeDirectory=rustmush` (mode 0750). On Windows
# dev / a portable setup use a TCP addr instead, e.g. "127.0.0.1:6795".
#
# This section is NOT optional here: the unset default is "127.0.0.1:6791",
# which is dev2's own Redis port above — the boundary would fail to bind and
# the split would crash-loop. `Config::ipc_endpoint()` refuses that config.
[ipc]
listen = "/run/rustmush/dev2.sock"       # dev2's private boundary (unix socket)
# M18 boundary bounding (DoS/robustness; defaults shown). Old configs without
# these keys keep the defaults.
# to_server_cap = 1024        # gateway->server queue; over cap, INPUT (Cmd/Query) is shed + logged
# to_gw_cap = 8192            # server->gateway queue; over cap, the boundary is torn down (re-attach heals)
# write_timeout_ms = 5000     # per-frame IPC write timeout; a wedged peer past this tears the boundary down
# high_water_warn_pct = 80    # edge-gated high-water warn threshold (percent of a queue's cap)
# exit_on_abandoned_supervision = true  # gateway exits non-zero once its supervisor gives up
#                             #   on the server half (false keeps the corpse on a dev box)

[web]
listen = "__EXTERNAL_IP__:6793"          # external IP only (off tailscale)
[web.tls]                                # native HTTPS (self-signed for now)
cert = "/opt/rustmush/dev2/tls/cert.pem"
key = "/opt/rustmush/dev2/tls/key.pem"

[game]
linkdead_grace_s = 300
max_characters = 3
ic_ratio = 1
ic_epoch = "2020-01-01 00:00"

# --- The combat arena (16b cut G; the switch, 16b cut F.4) -------------------
# [tacsim].enabled is what instantiates the simulator. With it on, the boot pass
# appends the game's two content packs -- the proving ground's ground, and the
# arena entry whose applier makes the muster room, its domain and the eight stock
# tanks -- and nothing else: it drags in no seed pack ([tacsim].seeds is its own
# key and is empty here), no corridor, no ephemeris change and no economy change,
# all of which are read whether the layer is on or off
# (crates/mush-server/src/boot.rs and crates/tacsim/src/composition/mod.rs, where
# the flag reaches exactly one call, content_module_with's game_content).
# With it OFF, the centre's rooms and pods still exist (they are in the starter
# area) but there is no arena and no roster, so SIM refuses out loud and no match
# can start. This box wants the simulator, so it is on.
#
# The six blocks below are written out because they are the game's numbers
# (doc 16 §7, values from 16b §9) and a box should not run them as compiled-in
# defaults nobody read. Every block is deny_unknown_fields, so a mistyped key
# refuses the boot -- but a mistyped [tacsim] HEADER is not a key and parses
# clean, so check the boot log: with the layer off the server says so in one line
# naming the consequence for the simulator.
[tacsim]
enabled = true

[tacsim.arena]
max_catch_up_steps = 4
# (16b cut E.3) arena ms a unit holds against another unit in its way, keeping its speed, before it stops and says so; 0 stops it at once
occupied_stop_ms = 2000
# 16b cut N.2: the floor under one squad's deliberation requests, arena ms.
deliberate_min_ms = 30000

[tacsim.arena.tempo]
quiet_ms = 5000
alert_ms = 1000
engaged_ms = 500
alert_hold_ms = 30000
engaged_hold_ms = 10000
# 0 = derived at match start as the lesser of twice the longest weapon range in
# the match and the window's own diagonal (16b cut E.1).
alert_range_cm = 0
substep_max_ms = 250
stall_ms = 2000

[tacsim.arena.intents]
max_pending_per_unit = 8

[tacsim.arena.ledger]
summary_ms = 5000
max_bytes = 67108864
max_unflushed_chunks = 256

# 16b cut N.1: the reflex controller's cadence, path budgets and doctrine.
[tacsim.arena.reflex]
decide_ms = 1000
path_max_cells = 65536
max_path_queries = 64
repath_ms = 4000
withdraw_permille = 350
weight_range = 100
weight_facet = 40
weight_health = 30
engage_band_permille = 700
# 16b cut Q.7: the quiet a withdrawn unit waits out before it rallies, once.
rally_ms = 20000
# (16b cut E.1) armour plus internals, per mille, below which a machine on its way home will not turn and fight even something close; once home it always shoots back
stand_min_permille = 175

[tacsim.match]
startup_ms = 10000
board_timeout_ms = 120000
max_duration_ms = 3600000
max_slots_per_side = 12
# 16b cut N.1, sized by Q.7: ON here, because one player alone on a dev box has
# nobody to fight. Each side fields the larger side's claimed slots (never fewer
# than one) and the machines take the unclaimed pods; SIM AI <n> changes it.
ai_fill = true
# (16b cut D.3) how long a RUNNING match every pilot has left runs on before the
# lobby ends it `unattended`. A released seat is one-way (doc 16 section 11, N.1),
# so nobody is left who can abort one; 0 turns it off, and anything else is at
# least 10000 -- a few seconds would end a match over one pilot's reconnect.
unattended_ms = 300000

[tacsim.sensors]
pass_ms = 1000
# The only float; the host reads it as per mille (1.5 -> 1500).
max_signature_factor = 1.5
lost_after_passes = 3
# (16b cut Q.1) true names a contact by team and centre slot (BA) at detection:
# the other side is legible classify_after_ms before identification is earned.
designate_on_detection = false
# (16b cut Q.2) what SCAN reads off a target: per section, its facets' armour and
# its internals against their maxima, per mille, green at or above the first floor
# and yellow at or above the second.
condition_green_permille = 667
condition_yellow_permille = 334
# (16b cut Q.2) the close look: a pass records bands only inside this fraction of
# the effective reach the range test just used.
condition_reach_permille = 500

[tacsim.resolution]
paths = []

[tacsim.harness]
units = 300
fighting = 24
weapons = 150
engaged_p99_ms = 25
max_traces_per_pulse = 4000
max_path_queries_per_pulse = 64
max_share_ops_per_pulse = 256
max_ledger_bytes = 67108864

# --- LLM: enabled; keys come from the systemd EnvironmentFile (dev2.env) ---
[llm]
enabled = true

[llm.providers.openrouter]
kind = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
requests_per_minute = 60
referer = "https://github.com/rustmush"
title = "rustmush-dev2"

[llm.providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
requests_per_minute = 60
anthropic_version = "2023-06-01"
price_input_per_mtok = 5.0
price_output_per_mtok = 25.0

[llm.routes.worldgen_room]
model = "z-ai/glm-5.3"
max_tokens = 1500
timeout_s = 90
reasoning = "low"

[llm.routes.worldgen_brief]
model = "z-ai/glm-5.3-flash"
max_tokens = 2000
timeout_s = 120
reasoning = "low"

[llm.routes.ambience]
model = "deepseek/deepseek-v4-flash-0731"
max_tokens = 400
timeout_s = 30
reasoning = "off"

[llm.routes.npc_dialogue_major]
model = "z-ai/glm-5.3"
max_tokens = 1024
timeout_s = 30
reasoning = "low"

[llm.routes.npc_dialogue_minor]
model = "z-ai/glm-5.3-flash"
max_tokens = 1024
timeout_s = 30
reasoning = "low"

[llm.routes.npc_dialogue_extra]
model = "deepseek/deepseek-v4-flash-0731"
max_tokens = 768
timeout_s = 30
reasoning = "off"

[llm.routes.npc_summarize]
model = "z-ai/glm-5.3-flash"
max_tokens = 768
timeout_s = 60
reasoning = "off"

# Storyteller adjudication (M13): judge freeform Mage workings, then narrate the
# engine's already-thrown result. The LLM never rolls or sets the outcome.
[llm.routes.st_adjudicate]
model = "z-ai/glm-5.3"
max_tokens = 1024
timeout_s = 45
reasoning = "low"

[llm.routes.st_interpret]
model = "z-ai/glm-5.3-flash"
max_tokens = 768
timeout_s = 30
reasoning = "off"

[llm.concurrency]
max_interactive = 8
max_interactive_queued = 32
max_background = 3
max_background_queued = 12

[llm.budgets]
global = { tokens = 5_000_000, cost_usd = 5.0 }
per_actor_default = { cost_usd = 1.0 }
per_npc_default = { tokens = 200_000 }

[llm.budgets.per_feature]
worldgen_room = { cost_usd = 2.0 }
npc_dialogue_major = { cost_usd = 1.0 }
