[package]
name = "mush-market"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "mush-market (E6c): the neutral market — bounded catalogs and content packs, listings, buyer-as-issuer quotes, vendors and NPC market makers, and the safe aggregate public projection. Game-neutral: it serves WoD and TacSim as well as Shadowrun."

# 08e answer 20 / doc 08 D11 / doc 10 §14: the market names principals and settles
# through contracts, so it depends on `{core, org, economy}` — and the economy never
# depends on the market. There is no `mush-party` edge, no `mush-canon` edge and no
# ruleset edge: a run is a contract with an audience notice (D-E6-17), a seal is
# canon's, and prices, availability, legality and item meaning are the ruleset's.
# `cargo tree -p mush-market` is the test.
#
# `tracing` is the logging facade a loud skip at boot needs; `serde`/`serde_json`/
# `smol_str` are the persistence vocabulary every E crate already uses.
#
# E7 residue pass 2 (P1, 10b §15.5 (a′)) adds the ONE new edge of the whole pass:
# `mush-market -> mush-inventory`. A `Supply::Lot` listing sells provenance-bearing
# stock whose quantity truth is `mush-inventory`'s and must stay there, so the market
# reserves, consumes and releases through `InventoryFamilies`' own exported verbs on
# the DELEGATED path (`InventoryModule::with_quantity_delegates(["industry",
# "market"])`), exactly as `mush-industry` has done since cut 3 — no new
# `InventoryVerb`, no engine-owned reservation and no second quantity authority.
# The direction is the one 10b §3.2 always intended (`mush-market -> mush-inventory`,
# never the inverse), and it is pinned by `tests/e7r2.rs` here, by
# `mush-inventory/tests/e7c2.rs` (which forbids inventory -> market) and by
# `mush-industry/tests/e7c3.rs` (which forbids industry -> market); neither of those
# two is amended by this pass. `cargo tree -p mush-market` is the test.
[dependencies]
mush-core.workspace = true
mush-org.workspace = true
mush-economy.workspace = true
mush-inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
tracing.workspace = true

[dev-dependencies]
mush-testkit.workspace = true
mush-store.workspace = true
mush-proto.workspace = true
tokio.workspace = true

[lints]
workspace = true
