[package]
name = "mush-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Spatial simulation foundation: durable placement graph, domains, interiors, mounts (design 06)"

[dependencies]
mush-core.workspace = true
# E3c: mush-sim implements the economy's `CustodyProvider` for interior vaults
# (doc 08b §5.1). The edge is unconditional — no cargo feature — and acyclic:
# mush-economy depends on {core, org} only.
mush-economy.workspace = true
# R1: relay operator identities resolve against the existing organization store.
mush-org.workspace = true
# E7 cut 6 (10b §3.6 OPEN 3): a journey arrival raises each onboard scene's IC
# floor through E6b's one seam, `SceneRecord::raise_ic_floor_on_arrival`, so the
# whole floor rule (08f R4 — monotonic, bounded, refused after the seal, and it
# never touches `clock_generation`) lives in one place instead of being
# re-derived across the boundary. The edge is acyclic: `mush-scenes` depends on
# {core, canon, proto} and never on `mush-sim`.
mush-scenes.workspace = true
mush-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# E7 cut 10 independent verify fold, B12: `ControlLeaseView::note_holder` is a
# MIRROR seeder, never authority, and `World::module_state_mut::<T>()` is generic
# and not owner-scoped - so an unconditional `pub fn` let any crate write false
# holders into the sole input of the K6 gate's leg (2). It is fenced behind this
# feature; only test compositions turn it on.
testkit = []
# WS01-S11D: the journey rotation's terminal-record walk (`journey.rs`). It used
# to ride `cfg(debug_assertions)`, which stops fencing production the moment
# `[profile.release]` sets `debug-assertions = true` — and then every rotation
# walks every root and a drift is a `debug_assert!` panic inside the
# single-writer world task. Off by default; `mush-server`'s test build turns it
# on.
debug-checks = []

[dev-dependencies]
futures.workspace = true
mush-org.workspace = true
mush-store.workspace = true
mush-testkit = { workspace = true, features = ["authoritative-store"] }

[lints]
workspace = true
