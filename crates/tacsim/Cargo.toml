[package]
name = "tacsim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "tacsim (E7 cut 1): TacSim's rules-definition and campaign-seed packs, the digest that identifies them, the once-per-(pack, version) seed latch, and the Mars-Phobos-Ceres corridor fixture."

# `tacsim` owns the game's simulation and pilot-sheet layers (`TacsimRuleset`,
# `PilotRuleset`, and `tacsim::arena`). Full server module composition lives in
# `mush-composition`; `tests/shard_3/composition_edges.rs` pins the recorded
# `mush-*` dependency set of this crate.
[dependencies]
mush-core.workspace = true
mush-sim.workspace = true
# S7 (D-P-1): the pack loader, manifest and digest are `mush-content`'s; this crate
# decodes the entries it owns from the content pack.
mush-content.workspace = true
# S9.1 (D-14-33): a campaign-seed pack's places and routes are the atlas's sites and
# connections; this crate's appliers build the records and the atlas puts them.
mush-atlas.workspace = true
mush-proto.workspace = true
# Doc 20 cut SM.4b (lead ruling 7): `+tv/map` reads its grid rows through
# `mush_ansi::panel::window_rows`, the TUI's own grid decoder, so line mode and the TUI cannot
# disagree about a glyph. A pure leaf crate (mush-proto, serde_json, smol_str).
mush-ansi.workspace = true

mush-comsys.workspace = true
mush-faction.workspace = true
mush-market.workspace = true
mush-inventory.workspace = true
mush-industry.workspace = true
mush-propagation.workspace = true
mush-tactics.workspace = true
mush-canon.workspace = true
mush-org.workspace = true
mush-economy.workspace = true
mush-jobs.workspace = true
mush-llm.workspace = true
mush-npc.workspace = true
mush-ruleset.workspace = true
# 17b cut M2.2 (doc 17 §7, §8; D-UM-30 as amended): the unit-mind sandbox. Its
# memory codec is the arena's ONE codec from this cut (`arena/mind.rs`
# re-exports it); its interpreter enters this crate in 17b cut M2.3, outside
# `src/arena/`, whose contract test refuses the interpreter's name there.
mush-mind.workspace = true
# 17d M6.1: neutral character library ownership; game validation stays here.
mush-roll.workspace = true

# 16b cut R-b (R4): the one game sheet (`sheet/`). `mush-dice` is the expression
# evaluator behind `+roll` and the `check` ability (R5 deleted `sr5`; `owod20` stays
# as the success-count pool the testkit's toy ruleset rolls); `rand`/`rand_chacha`
# are the module-state RNG those roll over, seeded per composition.
mush-dice.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
# Bounded frozen proving starts; opaque canonical snapshot bytes stay exact.
flate2.workspace = true
# 16b cut A.1: the arena definition's identity and the match ledger's digest
# (doc 16 §4 "The result record": the ledger's digest and log id go on the
# result, not the ledger).
sha2.workspace = true
smol_str.workspace = true
thiserror.workspace = true
# 16b cut T.2: the arena TASK (`arena_task.rs`) — one tokio task per running
# match, its bounded inbox and egress, its timer and its stop signal. The arena
# LIBRARY (`src/arena/`) never touches it: the gate in
# `crates/mush-contract-tests/tests/arena_library.rs` refuses the word `tokio` in
# every file under that directory, which is the whole reason the task lives one
# level up.
tokio.workspace = true
tracing.workspace = true
# Doc 30 cut WG.1 (from doc 21 cut G.7b): `tacsim::ground` computes the V3
# landscape with libm so the pinned draft and packs are byte-identical on every host.
libm.workspace = true

[features]
# 16b cut T.3: the `@arena/fault <match>` switch, which arms cut T.2's hidden
# panic hook inside a RUNNING match's arena so the two verify lenses can show
# what doc 16 §3.1 "Failure" promises — a panic inside `step` voids the match and
# the world keeps serving commands. No legal input can make a pulse panic, so the
# seam has to exist; what must not exist is a shipped binary carrying it.
#
# The gate is the cargo feature, exactly as `mush-server/fault-injection` gates
# the K8 process cuts (WS01-S11D) — not `cfg(debug_assertions)`, which stops
# fencing production the moment `[profile.release]` sets `debug-assertions =
# true`. Off by default; `mushd`'s and `mush-gateway`'s `[dev-dependencies]`
# edges are the only things in the tree that turn it on, for the two tests that
# need it, and `crates/mush-contract-tests/tests/feature_matrix_inventory.rs`
# pins that claim.
fault-injection = []

[dev-dependencies]
mush-testkit.workspace = true
mush-proto.workspace = true
# 17g cut C3a: `minds::market_commands::tests`' panel projection test asks the
# workspace's own projection lens (`assert_projection_text_clean`), as the
# gateway's and the SSH TUI's projection tests do. A dev-dependency is no edge
# of the game crate, and its own dependencies are all tacsim's already.
mush-contract-tests.workspace = true
# 16b cut D.1: `tests/arena_task.rs` pins the clock on `ArenaOut::Frames` at all
# three tempos, and the slowest of them is a 5,000 ms period. `start_paused`
# (virtual clock) is what keeps that a test rather than half a minute of sleep.
tokio = { workspace = true, features = ["test-util"] }
# 16b cut U.2 (16c `T-36`): `tests/harness.rs` reads resident memory through it
# on every platform, where `/proc/self/status` answered on Linux alone.
memory-stats.workspace = true
# 16b cut U.4 (16c `T-53`): not a new crate edge -- `mush-sim` is already a normal
# dependency (above). The test build turns on its `testkit` feature so
# `tests/cockpit.rs` may seed a proxy focus through
# `FocusState::claim_for_test`, the fenced door `mush-propagation`'s and
# `mush-campaign`'s proxy-seat tests already use: a human driving another
# character's cockpit is the one case where the seat's driver is not the typist.
mush-sim = { workspace = true, features = ["testkit"] }
# Doc 20 cut SM.3a: `tests/vehicles.rs` reads the recall arm's bay page off the log
# (a dev-dependency is no edge of the game crate; `mush-server` already carries it).
tracing-subscriber.workspace = true

[lints]
workspace = true
