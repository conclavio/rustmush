# ---------------------------------------------------------------------------
# Observed foreign writes (the census run)
# ---------------------------------------------------------------------------
#
# EMPTY, and measured rather than assumed. The census RUN was
# `cargo test --workspace --no-fail-fast` plus
# `cargo test -p mush-sim --features testkit`, with the report teed to a file:
# 291 test targets, and the ONLY two lines it emitted were `mush-core`'s own
# `module_api` cases — the synthetic two-module engine where `b` writes `a`'s
# slot, and the deliberately seeded unowned slot. Nothing else in the workspace
# wrote a foreign slot through `Ctx::state_mut`, and no composed world carried an
# unowned slot at boot.
#
# So WS03-S14's refusal, now live, broke nothing that runs today. This list must
# stay EMPTY: a pair here is a write that is REFUSED rather than excused, and the
# test says so. What the refusal does not reach is the 25 `[[site]]` rows above,
# every one of which goes around `Ctx` through `World::module_state_mut`.
