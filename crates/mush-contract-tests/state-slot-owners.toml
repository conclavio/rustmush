[[site]]
path = "crates/mush-server/src/boot.rs"
accessor = "World::module_state_mut"
slot = "AccountOracle"
owner = "sim"
reason = """
Host wiring, post-composition: the sim registers its account oracle UNWIRED at
`register` (it has no store yet) and the boot root replaces it with the
hydrated one, so `+focus` can consult it synchronously inside a world command.
If the sim did not compose, the slot is absent and every consumer fails closed.
A module cannot do this itself — only the host holds the boot-hydrated identity
map — so this is the host acting as the composer, not a module reaching sideways.
"""

