# The US-spelling gate's word lists (tests/engine_contracts/us_spelling.rs).
#
# The game speaks American English. Every `[[word]]` below is a British spelling
# that may not appear in player-facing text: help pages, content packs' player
# text, command names and switches, and the prose string literals of production
# source (the sentences the game prints, the mush-bot sentence table among them).
# Words are matched whole and case-folded; the failure names the US form.
#
# Not checked, by design: identifiers, JSON keys, Redis keys, content ids, design
# docs and design notes. A word glued to `:`, `.`, `_`, `{`/`}`, a quote or a
# path slash is an identifier (`tacsim:licence:`, `{licence}`, `licence/<id>`,
# `"licence":`) and is skipped; so is a word in a code span on its own
# (`` `offence` ``, a mode keyword). A word right after `@`, `+` or `/` is a
# command token: the registry check covers those, and a British alias may be
# named in prose.
#
# `[[allow]]` admits one word in one file, for a proper noun or a quoted
# in-world name: `file` is repo-relative, `word` is as written (case-sensitive),
# `context` is a substring of the surrounding text that must be present, and
# `reason` says why. A row no text needs any more fails the gate.

[ise]
# Each stem takes the endings e, es, ed, ing, ation, ations, er and ers, with an
# optional un-, re-, dis- or de- prefix: `organis` covers organise, organisation,
# reorganised and disorganised. The US form swaps the stem's last `s` for `z`.
# `emphasis` takes only e, es, ed and ing (emphasis itself is US spelling).
stems = [
  "organis",
  "recognis",
  "authoris",
  "realis",
  "normalis",
  "apologis",
  "capitalis",
  "prioritis",
  "optimis",
  "minimis",
  "maximis",
  "serialis",
  "initialis",
  "specialis",
  "standardis",
  "utilis",
  "categoris",
  "summaris",
  "customis",
  "finalis",
  "synchronis",
  "visualis",
  "memoris",
  "stabilis",
  "neutralis",
  "criticis",
  "emphasis",
  "localis",
  "randomis",
  "sanitis",
  "characteris",
  "mobilis",
  "militaris",
  "colonis",
  "civilis",
  "centralis",
  "rationalis",
  "harmonis",
  "legitimis",
  "subsidis",
  "symbolis",
  "theoris",
  "vaporis",
  "digitalis",
]

