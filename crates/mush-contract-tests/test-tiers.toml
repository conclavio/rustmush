# Doc 43 cut TS.2: the gated tests' tiers and configurations.
#
# A gated test is one that passes without running when nobody gives it what it
# needs: `#[ignore]`d, reading `REDIS_URL`, or opting in by a `RUN_*`/`*_RUN`
# flag (tests/ci_policy/ci_gated_test_inventory.rs finds them by scanning the tree). Each
# one says here WHEN it runs and UNDER WHAT:
#
#   tier      pr        a ci.yml job with no `if:` (every push and pull request)
#             nightly   a job whose `if:` admits the schedule (daily, 04:17 UTC)
#             weekly    a job whose `if:` admits the Sunday cron '17 4 * * 0'
#                       (D-43-11), at the fast pulse
#             dispatch  a job only `workflow_dispatch` reaches, or the VPS
#                       gate (`job = "gate.yml:<kind>"`, `via` the script
#                       the kind runs)
#             by-hand   no job: somebody runs it on a box. `by_hand` is the
#                       `by-hand:` tag, the revision of its last recorded run
#                       (or `never`, with a note saying why)
#   job       the ci.yml job that runs it (not on the by-hand tier)
#   config    the environment that run sets: space-separated NAME or
#             NAME=VALUE; the job must set each (an opt-in test's row names
#             its flag). Empty is the default configuration. One test may
#             have a row per configuration (doc 43 §5.9, TS.18)
#   via       a script the job runs that runs the test
#   child_of  an ignored helper its file's test spawns as a child process
#   id        `<pkg>/tests::<module or target>::<fn>` for an integration test
#             (the group directory left out: a reshard rewrites no row);
#             `<path under crates/>::<fn>` for a unit test; `<prefix>::*` for
#             every gated test under a prefix that needs no opt-in flag
#
# The test refuses: a gated test with no row; a row matching no gated test; a
# job on another tier than its row says; a job that runs the test only in a
# comment (a comment is a recipe, not a run); an ignored test under a command
# without --ignored / --run-ignored; a config the job does not set; a by-hand
# row without its revision.
#
# A cut that adds a gated story adds its row in the same pull request (doc 43
# TS.2, §10.3). A programme story on the dispatch or by-hand tier is named in
# the Sunday slot (a weekly job) or carries its by-hand revision here and in
# its cut note. After a by-hand run, update `by_hand` to the revision it ran
# at, in the commit that records the run's figures.
#
# Doc 43 cut TS.18, variant identities (§5.9): an exact row may name a test
# that is NOT gated, with a non-default `config`: a variant, with its own tier
# and last run (FIELD_RAID=director, MINE_RATE=24 below). And every variable
# tacsim's and the bot's tests read (a literal or a `const` passed to
# `env::var`, `knob` or an `env_*` helper) is either named in some row's
# `config` or declared a [[knob]] at the end of this file, with the kind that
# says why it needs no row of its own. A knob of kind `opt-in` makes a test
# that returns early unless it is set a gated test, like a `RUN_*` flag.

