[package]
name = "mush-contract-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared fixtures and vertical contract gates for the RustMUSH action kernel"
publish = false

[dependencies]
mush-core.workspace = true
mush-proto.workspace = true
mush-store.workspace = true
mush-testkit.workspace = true
mush-tactics.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
# 16b cut R-b: the contract probes that used the deleted game rulesets as
# sheet / vitals / NPC-grounding fixtures drive the `toy` test ruleset instead.
# The normal dependency above stays featureless.
mush-testkit = { workspace = true, features = ["toy-ruleset"] }
# The rule-1 allowlist tripwire (tests/legacy_handler_allowlist.rs) composes the
# production command registry the way `mush-server`'s `build_engine` does.
mush-config.workspace = true
mush-llm.workspace = true
mush-server.workspace = true
# H3: the scale harness (tests/scale_harness.rs) seeds an economy world and drives
# the real store writer.
mush-economy.workspace = true
mush-org.workspace = true
# H2c: the NPC ability residual probe composes each production ruleset's
# grounding and pins which abilities still reach `invoke_ability`.
mush-npc.workspace = true
mush-ruleset.workspace = true
# WS03-A1: the boot-refusal case measures the starter lot the atlas ships, so
# the "nothing was refused" claim cannot be met by a boot that applied nothing.
mush-atlas.workspace = true
# Doc 21: the pixel picture's sight heights are pinned to the atlas's
# (tests/pixel_sight_heights.rs); mush-pixel itself does not depend on it.
mush-pixel.workspace = true
mush-jobs.workspace = true
# 16b cut A.1: the two arena gates doc 16 §8 names (tests/arena_library.rs) read
# the arena library's source tree and its pinned draw-label set. 16b cut T.3 adds
# the third — the custody markers are the only unit writes during a match — which
# runs a real match over the placement graph, so `mush-sim` comes with it.
tacsim.workspace = true
mush-sim.workspace = true
futures.workspace = true
smol_str.workspace = true
static_assertions.workspace = true
toml.workspace = true
