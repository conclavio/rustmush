# WS03-A1: the declared cross-namespace module-write delegations.
#
# A module's `GameModule::name` IS its persistence namespace, so a write whose
# `op.ns` is not the writing module's name is one module writing documents
# another module owns. `Ctx::persist` REFUSES one that is not declared here —
# the op is dropped, nothing is queued, one `error!` per (module, namespace)
# names the pair, and `World::refused_namespace_writes` reports it.
#
# A row is not what makes a write legal; `Registrar::persist_delegation` in the
# declaring module is. This file pins the composed set, so a new delegation
# cannot arrive without a reviewed row, and a row that no module declares any
# more cannot linger. `tests/module_ns_owners.rs` fails on either.
#
# WHO DECLARES A PAIR: one of the two modules it names — the writer, or the
# namespace's owner. Both know why the write is legitimate; nobody else does.
#
# HOW THE SET WAS MEASURED. `Ctx::persist`'s namespace is a runtime value, not
# a syntactic one, so no scan of the source can enumerate it. The census
# commit installed a counter and every crate that persists had its test suite
# driven against it: mush-campaign, mush-canon, mush-comsys,
# mush-contract-tests, mush-core, mush-economy, mush-faction, mush-housing,
# mush-industry, mush-jobs, mush-mail, mush-market, mush-npc, mush-org,
# mush-party, mush-privileges, mush-propagation, mush-scenes, mush-script,
# mush-server, mush-sim, mush-tactics, mush-testkit, mush-weather,
# mush-worldgen, mushd, ruleset-shadowrun, tacsim, ruleset-wod. Every
# distinct production (module, namespace) pair those runs produced is below,
# plus `jobs -> shadowrun`, which the run never reached and which was declared
# rather than discovered later by a dropped write. 16b cut R-b deleted both
# character rulesets; the one game sheet (`tacsim::sheet`, module `pilot`)
# declares the same two jobs crossings, and its rows replace theirs below.
#
# The spatial layer (S1-S5) landed AFTER that run, and mush-atlas and
# mush-content did not exist when the counter was installed, so the block of
# rows below it was not measured the same way: it was derived by reading every
# route across the four crates the spatial layer gave a cross-namespace surface
# — mush-atlas, mush-content, mush-worldgen and, as the namespace on the way
# back out, mush-jobs — and then held to the instrument that actually catches a
# miss. A refused write is silent in RAM and only shows after a reboot, so
# `refused_namespace_writes()` is asserted empty at the end of the live routes
# in `mush-worldgen/tests/plan.rs` (a staff `+build/go` and a player request's
# activation, which between them reach the content latch, the appliers of both
# kinds and the BUILD ticket) and in `mush-atlas/tests/hydrate.rs` (the
# `+job/approve` that comes back the other way). Reading found five pairs the
# rebase had left undeclared; the assertions are what keep the reading honest.
#
# WHAT THE CHECK CANNOT SEE. Only a write spelled `ctx.persist` reaches the
# comparison. `Deferred::Persist` is a public variant and `Outbox::defer` is
# public, so the crate-local `push_op` helper most modules write through is
# neither censused nor refusable. Nothing crosses a namespace that way today:
# every such helper stamps its own crate's namespace constant by construction.
# A write that MEANS to cross a namespace must be spelled `ctx.persist` to be
# governed at all; fencing the sibling path (a pinned scan over non-mush-core
# source for a `Deferred::Persist` whose namespace is not the crate's own
# constant) is a follow-up step, not part of this one.
#
# Two crossings the spatial layer makes are ungoverned for exactly that reason,
# and the rows below are not a complete description of what S1-S5 crosses until
# the follow-up lands: `mush_sim`'s window API and `mush_canon::commit` write
# through `ctx.out` rather than `ctx.persist`, so `atlas -> sim` and
# `atlas -> canon` (and the same two under the scenes and tacseam identities
# that fire the atlas's scene hook) land UNREFUSED and undeclared — the same
# commands, the same code path, the opposite outcome from `atlas -> jobs`,
# decided only by which crate happened to spell its write `ctx.persist`.
#
# Two shapes are NOT delegations, because they are not modules reaching across:
#
#   * `module: None` — a core command is a wildcard, here as it is for state
#     slots. The run saw `(core) -> jobs` and `(core) -> toy`.
#   * the engine's own namespace-crossing helpers. `Ctx::end_scene` and
#     `Ctx::scene_state_set` write a scene's OWNING namespace whoever calls
#     them, and `Ctx::change_world_time_rate` writes the reserved engine-owned
#     world-timeline namespace no module may be named after (the run saw
#     `tacsim -> rustmush_kernel_time` through it). All three take
#     `Ctx::persist_engine_owned`, which is `pub(crate)` in mush-core: the
#     engine mediates those writes, and no module can reach the spelling. (The
#     census also named `Ctx::set_map_blob`, the opaque per-scene blob; S4
#     replaced it with the atlas's own window records and deleted it.)
#
# WHAT THE REFUSAL CANNOT KNOW IN ADVANCE. A pair is (writing module,
# namespace), and the writing module is whoever's identity the Ctx carries —
# which, for a callback, is the DISPATCHING module and not the one whose code
# runs. `economy -> jobs` below is that shape. Any other module whose command
# emits an economy event could carry housing's observer into the jobs
# namespace the same way, and no run has produced one; if that happens the
# write is refused, the `error!` names the exact pair, and the fix is a
# `persist_delegation` call plus a row here.

# ---------------------------------------------------------------------------
# Into the jobs namespace: the jobs module's public API takes `ctx` and
# persists under the CALLER's identity. This is the delegation the old
# trust-model paragraph named without ever bounding.
# ---------------------------------------------------------------------------

[[delegation]]
writer = "housing"
ns = "jobs"
declared_by = "housing"
reason = """
mush_housing::flow raises and closes the tenancy story window through \
mush_jobs::open_job / resolve_plain_job.
"""

[[delegation]]
writer = "pilot"
ns = "jobs"
declared_by = "pilot"
reason = """
tacsim::sheet::chargen files the one approval job (`+chargen/submit`) through \
mush_jobs::open_job, whose write carries the caller's identity (16b cut R-b; \
the two deleted rulesets declared the same crossing).
"""

[[delegation]]
writer = "economy"
ns = "jobs"
declared_by = "economy"
reason = """
An economy command emits an EconomicEvent; housing's economic observer runs \
under the EMITTING module's identity and closes the tenancy story job through \
mush_jobs::resolve_plain_job. Two hops: the identity on the write is the \
economy module's, the code is housing's, the namespace is the jobs module's.
"""

# ---------------------------------------------------------------------------
# Out of the jobs namespace: a job payload handler is registered by the sheet
# and dispatched by the jobs module, so it runs under the JOBS module's
# identity and writes its own ruleset's namespace.
# ---------------------------------------------------------------------------

[[delegation]]
writer = "jobs"
ns = "pilot"
declared_by = "pilot"
reason = """
`+job/approve` dispatches the chargen-approval payload handler tacsim::sheet \
registers (`pilot.chargen`) under the jobs module's Ctx; it stamps the sheet \
Approved and writes pilot-namespace documents (16b cut R-b; the same route the \
two deleted rulesets declared).
"""

# ---------------------------------------------------------------------------
# The spatial layer (S1-S5, 14-spatial-implementation-plan). Four modules reach
# `mush-atlas`'s API with a `Ctx` of their own, the jobs module dispatches the
# handlers the atlas registered with it, and the atlas and worldgen run the
# other way into content, npc and jobs — all the same "the identity on the
# write is the CALLER's" shape as the jobs block above, here through an applier
# registry, a scene hook, a registered planner and a job payload handler rather
# than a public job API.
# ---------------------------------------------------------------------------

[[delegation]]
writer = "content"
ns = "atlas"
declared_by = "atlas"
reason = """
The content module's boot pass and `@content/pack apply` drive every entry \
kind's applier themselves, so the atlas's own appliers make places under the \
content module's identity. mush-content cannot name the atlas (the dependency \
runs the other way), so the atlas declares it.
"""

[[delegation]]
writer = "content"
ns = "npc"
declared_by = "npc"
reason = """
The same route for the people half of a pack: mush_npc::content's appliers \
write lore pools and personas under the content module's identity.
"""

[[delegation]]
writer = "scenes"
ns = "atlas"
declared_by = "atlas"
reason = """
A scene opens a tactical window when it starts and closes it when it ends, \
through the start/end hook the atlas registers with mush-scenes; the scenes \
module fires it under its own identity.
"""

[[delegation]]
writer = "tacseam"
ns = "atlas"
declared_by = "atlas"
reason = """
The same scene hook, fired for a battle scene the `tacseam` seam stub starts \
and ends — mush-tactics' standing seam module, NOT the tactics module, which \
is what composes in production and does not open windows. Two hops: the \
identity is the seam stub's, the code is the atlas's, the namespace is the \
atlas's own.
"""

[[delegation]]
writer = "worldgen"
ns = "atlas"
declared_by = "atlas"
reason = """
`+build/place` and a proposal's activation call the atlas's hydration API — \
site requests, a character's standing, the activation itself — with worldgen's \
Ctx.
"""

[[delegation]]
writer = "atlas"
ns = "content"
declared_by = "atlas"
reason = """
The direction that runs back: `@atlas/pack apply` commits through \
mush_content::apply_pack, and the pack latch it writes carries the atlas \
module's identity.
"""

[[delegation]]
writer = "atlas"
ns = "worldgen"
declared_by = "worldgen"
reason = """
`@atlas/propose` hands the proposal to the planner mush-worldgen registers with \
the atlas at boot, so a whole planning run — and every proposal document it \
writes — happens under the atlas module's identity.
"""

[[delegation]]
writer = "atlas"
ns = "npc"
declared_by = "npc"
reason = """
The people half of the row above: `@atlas/pack apply` commits through \
mush_content::apply_pack, which drives EVERY kind's applier under the calling \
module's identity, so a pack with lore or personas in it writes the npc \
namespace under the atlas's.
"""

# The `+build` routes. Whoever calls mush_content::apply_pack runs the whole
# applier registry under their own identity, so worldgen reaches the content
# latch and both crates' appliers; the hydration API it calls files the ticket.

[[delegation]]
writer = "worldgen"
ns = "content"
declared_by = "worldgen"
reason = """
`+build/go` applies a staff proposal live and a player request's activation \
applies the same pack, both through mush_content::apply_pack, whose latch write \
carries the worldgen module's identity. Without this the latch is set in RAM \
only: the session looks right and the pack is un-latched after a reboot.
"""

[[delegation]]
writer = "worldgen"
ns = "npc"
declared_by = "npc"
reason = """
The people half of that apply: a site pack carries the personas the planner \
wrote, and their appliers run under worldgen's identity.
"""

[[delegation]]
writer = "worldgen"
ns = "jobs"
declared_by = "worldgen"
reason = """
The atlas's hydration API files the BUILD ticket — the review ticket for a \
hydrated site, the record ticket for a staff apply — through mush_jobs::open_job \
under the CALLER's identity, and `+build` is worldgen's command. Two hops: the \
identity is worldgen's, the code is the atlas's, the namespace is the jobs \
module's.
"""

[[delegation]]
writer = "jobs"
ns = "atlas"
declared_by = "atlas"
reason = """
The direction that comes back out of the jobs module, exactly as jobs -> wod \
does: `+job/approve` on a BUILD ticket dispatches the payload handler the atlas \
registered, and a denial its status observer, under the jobs module's identity; \
both write the atlas's site and request records.
"""

