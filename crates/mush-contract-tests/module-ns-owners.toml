[[delegation]]
writer = "tacsim"
ns = "tactics"
declared_by = "tacsim"
reason = """
16b cut T.3 (doc 16 section 3.1 "Custody"). The arena's custody transitions: \
check-out writes `deployed { match, arena, snapshot }` onto each unit's \
`unit:<obj>` record and check-in clears it, both through \
mush_tactics::custody, which is the tactics crate's own encoder, its own key \
and its own strict envelope. The identity on the write is the tacsim module's \
because the call is made from inside its authoritative action (`@arena/start` \
today, cut K's `SIM START` next); the code and the document are the tactics \
crate's, and tacsim never spells a tactics key itself. The same two functions \
called from the tactics boot pass write their own namespace and never consult \
this row.

16b cut F.1 adds the second governed crossing, which is not a custody \
transition: mush_tactics::module::apply_plan writes a whole `unit:<obj>` record \
through the tactics crate's own encoder, and tacsim::match_::reset's \
stock-tank reset is its second caller — reached from `@arena/reset`, from a \
player's `SIM TEAM` on a terminal centre and from this module's own boot pass, \
all under the tacsim module identity. Doc 16 section 3.3 asks for that reset \
"by one UnitMutationPlan", so the write is a plan through the same seam \
`@unit/damage` takes, and tacsim still spells no tactics key.

16b cut Q.8 adds the third governed crossing, and it is neither a custody \
transition nor a plan: mush_tactics::module::refit_unit RE-INSTANTIATES an \
object's unit from another UnitSpec and writes the whole `unit:<obj>` record \
through the tactics crate's own encoder, on the same `Ctx::persist` this row \
governs. It exists because a plan cannot do it — tacsim::match_::reset's own \
spec_plan says a plan can move a cell and cannot invent one, and changing a \
tank's type changes its sections, cells, components and capabilities — and it \
has exactly two callers, both tacsim's and both about the simulator centre's \
twelve stock tanks: `SIM START` fitting the type a pilot chose with `SIM UNIT`, \
and the return to Idle putting the pod's authored type back. It refuses a \
deployed unit and an object holding no unit, checks every reference at its \
exact digest exactly as create_unit does, encodes before it mutates, and \
touches no placement, station, billet or roster entry. tacsim still spells no \
tactics key.
"""

# 17d M6: the neutral library owner declares the game-owned workflow writes.
[[delegation]]
writer = "tacsim"
ns = "roll"
declared_by = "roll"
reason = """
RollModule::with_writers declares this pair only when the production roster also
composes TacSim. Author edits and combined immutable-source/revision saves, lobby
pins and sealed match references, proving roots and ephemeral bench roots all
publish opaque Roll-prepared changes through its owned API. Serialization and
stale checks precede publication; TacSim queues only owner-produced Roll writes
with the related TacSim writes. Revision pruning keeps immutable source bytes.
"""

