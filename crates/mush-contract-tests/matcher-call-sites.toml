# The matcher audit (16b cut U.4; 16c T-67, answering Q34 at its default: the
# gate and @find now, the lens is H6). Read by
# crates/mush-contract-tests/tests/matcher_call_sites.rs.
#
# `mush_core::matchit::match_object` resolves `#N` for ANY object in the world
# and `*name` for ANY player, with no observer test. Every production call site
# (every `crates/*/src/**/*.rs`, comments, literals and `#[cfg(test)]` items
# stripped, `mush-core/src/matchit.rs` itself skipped) is listed here once per
# enclosing function -- `function`, or `Type::method` when it is a method --
# with the guard that stands between the match and what the caller does with
# it. An unlisted site fails the test, an unused row fails the test, and the
# guard is one of exactly five words:
#
#   perceive  the result passes `can_perceive` (the kernel's Perceive seam, on
#             which mush-sim answers Conceal for every unit an arena holds) or
#             `mush_sim::deployed::excluded` BEFORE it names or acts on anything.
#   locality  only what is in the actor's room or inventory can match: the
#             matcher's own pools, with a `#N`/`*name` spelling refused, or
#             checked for nearness, before anything is named or done.
#   staff     the verb is Builder or above, or power-gated (SIM_ADMIN,
#             Royalty, EXAMINE_ALL, BUILDER_LLM, CHOWN_ANY ...), and the gate
#             runs before the match.
#   self      the target can only be the actor or something the actor holds.
#   none      audited: the call names or acts on the match with no perception
#             test. A permission check that runs AFTER the match (control,
#             examine rights, an authority the caller must hold over the
#             target) is still `none`, and the note says which check it is,
#             because it answers a different sentence for "exists, not yours"
#             than for "does not exist".
#
# `locality` AND `staff` DO NOT SATISFY DOC 16 §3.6's ARENA EXCLUSION. A deployed
# unit's world placement is frozen where check-out found it and its
# `Obj.location` is still the arena's muster room (mush-sim/src/lib.rs, the
# placement gate's own comment), so a `locality` site names it for anyone
# standing in that room, and a `staff` site names anything at all. The H6 lens
# -- the matcher asking the Perceive seam itself -- therefore takes the `none`
# rows first and the `locality` and `staff` rows after; only a `perceive` row is
# already closed.
#
# A helper several player-facing verbs call is ONE row, and its note names the
# callers. Written from the code at 16b cut U.4: 110 rows over 131 call sites
# (a plain grep finds 166 lines naming the function: the 35 in matchit.rs and
# the doc comment in mush-economy/src/contract_live.rs are not call sites).
# Guards at U.4: perceive 5, locality 3, staff 59, self 1, none 42.

