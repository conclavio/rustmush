[[handler]]
name = "@extract"
category = "authoritative"
family = "industry.run"
note = "E7 cut 3 (10b 3.3, D lens): extraction -- @extract/start|cycle|stop, every switch on B1's ingress adapter seam. ONE cycle is ONE bundle: a SINGLE debit of the deposit endpoint's pool (InventoryFamilies::debit over ReservationBook::checked_apply_resource -- NO hold, because a reserve+consume in one bundle is a DuplicateMutation and a hold carries quantity across no time at all; 10b 3.3 deviation (g)), one Lot minted with Lineage::Origin { source } at the operator's endpoint via mint_origin, that endpoint's lot census, the run's advanced post-image, and the applied marker industry.extraction.cycled is answered from -- all in one ActionTxn, so a crash mid-cycle produces NO LOT OR EXACTLY ONE and never a debited reserve with no lot. Cut 3 writes NO depletion arithmetic of its own: every quantity mutation is cut 2's owner-exported verb over ReservationBook::checked_apply_resource, and checked_hold subtracts every live hold before admitting the next, so two reservations against one remaining unit are refused BY THE KERNEL. Yield is arithmetic, not a roll: YieldCurve::at is a bounded walk over a monotone table with checked integer arithmetic in a fixed order, so two evaluations always agree and a replay is a HIT; an accessibility event moves the NEXT cycle and never a completed one. The bundle carries two owners' post-images -- industry.run beside inventory.pool/book/lot -- through the composition-declared state-family delegation mush-inventory publishes for 'industry' (Registrar::delegate_state_families), which is the cross-owner write E7 cut 2's own handoff named as cut 3's; the persisted namespace of every write stays the family owner's. The retryable key shape is extract/{deposit}/{cycle}. Cut 3 registers NO schedule source (cut 4 attaches the schedule) and NO second AuthorityGuardKind::Reservation validator (it holds against cut 2's book under cut 2's validator; cut 4's capacity book registers mush-industry's). Refusals are indistinguishable: depletion, a missing licence, a suspended claim and a body the actor may not know exists answer ONE sentence, and only staff get the reason."

