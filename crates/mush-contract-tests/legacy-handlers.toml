[[handler]]
name = "@wo"
category = "authoritative"
family = "industry.workorder"
note = "E7 cut 4 (10b 3.4, contradiction (iii)): work orders. AUTHORITATIVE typed state -- its state transition gates capacity legality (a Running order holds a slot a competitor cannot take) and its reservations/holds lists index authoritative records, so WorkOrder and ProductionSchedule are prepared-path families, not exempt documents. @wo/draft|submit|cancel|deliver|restamp ride cut 2's B1 ingress seam (submit reserves each material input as a cut-2 inventory reservation, one facility slot as a B1 capacity reservation, all under the work order's deterministic holder key wo/{order}, in one bundle; deliver consumes every reservation, releases the slot, materializes the output lot via cut 2's mint_origin, and writes the industry.workorder.completed marker the fact is answered from -- no fallible step after the first install); quote|show|list are ReadOnly reads (a conservative over-declaration 08j 7 Accept permits). @wo/quote's price and duration are a PURE FUNCTION of the recorded pinned inputs and reserve nothing, so a quote is never an inventory or capacity oracle. The recipe reaches industry by composition (Arc<dyn RecipeAuthority> at the root reading TacsimStore), not by an edge; money stays an E4 Hold and never grows a resource field. The production schedule runs on ClockRef::WorldIc via a Registrar::schedule_source on handoff.rs's shape (D-E7-16's 'cut 8 gets the first production schedule source' corrected). E7 RESIDUE PASS 1 (R1) AND ITS INDEPENDENT VERIFY FOLD (B8; owner decision F10(a)) -- THE MONEY LEG. The class stays AUTHORITATIVE and the ceiling is right, on @op's own argument read the other way round: @op is legacy-post-image because its records are exempt documents and its bond rides the economy's carve-out lane, while @wo owns the K-owned typed family industry.workorder, which the legacy post-image lane explicitly cannot claim -- so economy-carve-out (a declared category with zero stanzas) is not available to it, and 'the handler itself does not implement or persist the mechanic' still holds: the mechanic is the ACTION COORDINATOR's, and the carve-out post is the ECONOMY's. What the handler now does that cut 4's note did not record: cmd_wo's /submit arm calls money::place BEFORE staging the submission (a prepare_authoritative provider has no Ctx and cannot place a hold -- cut 9's check_bond_accounts shape, line for line), posting a durable HoldOp::Place through mush_economy::post on the economy's own carve-out lane, and compensates with settle_engine_reservation if the submission is then refused. TWO deterministic keys, both scoped by the ledger-derived ATTEMPT TERM (verify fold C4/D1 + D5, owner decision F2(a)): industry.wo.hold/{order}/{n} for the placement and industry.wo.settle/{order}/{n} for the settlement, where n counts holds already carrying money::purpose(order). They MOVE TOGETHER: an unscoped hold key was spent for ever by the first compensating release, and scoping the placement alone would let the second attempt's capture meet a spent settle key and ship the goods free. The hold carries HoldPurpose::Reservation { kind: \"industry.workorder\" }, which is in ENGINE_OWNED_RESERVATIONS, so authorize_hold refuses the account's own owner unconditionally and only the engine settles it. The AUTHORITY on 'is this order's money reserved' is money::live_hold, found BY PURPOSE and never by the HoldId denormalized onto the record. The settlement is an arm on mush-industry's EXISTING SWEEP_TAG Coarse tick (MAX_WO_VISITED_PER_FIRE 64 / MAX_WO_SETTLE_PER_FIRE 8), never a transition and never a second Ctx::submit_authoritative -- cut 2's fold C4 still holds, this handler stages exactly one. A Completed order whose payee cannot be resolved is a settlement REFUSAL that keeps the hold live and pages (F3(a)), never a refund of delivered goods; an order holding resources with no live hold is refused on BOTH ingresses, the command arm behind wo_viewable and the offer route through project_offer's server-authored 'unfunded' fixed parameter (D4/B5). The declared class is now CROSS-CHECKED against the class the production composition actually publishes for this verb (legacy_handler_allowlist.rs), so a stanza's category and its registration can no longer drift apart silently -- which is how a refreshed-two-stanzas pass left the one verb whose lane changed untouched."

