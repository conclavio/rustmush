category = "read-only"
note = "E7 cut 7 (10b 3.7, Q16A): the contacts this actor's platform holds. One observer's picture is invisible to every other observer; the filter is the holder principal and no argument widens it. Writes nothing, and names NO future family: contacts are K6's ContactState, owned by mush-tactics."

[[handler]]
