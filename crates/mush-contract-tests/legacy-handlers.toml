[[handler]]
name = "@inv"
category = "authoritative"
note = "E7 cut 2 (10b 3.2 / 4.1's two cut-2 rows): the neutral quantity authority's whole surface -- @inv/show|lots|lot|reservations (reads, paged on records VISITED at INV_PAGE) and @inv/move|split|merge|dissolve|crystallize (mutations). It is ONE CommandSpec and therefore ONE registration, so it takes the ceiling class of its nine switches, and it is the FIRST CommandCompatibility::Authoritative registration on the tree. The prepared path it rides is B1's ingress adapter seam: Ctx::submit_authoritative -> Deferred::AuthoritativeSubmit -> CommandSubmitDriver::drive_one -> ActionCoordinator::command_ingress + preflight -> resolve_and_stage_offer -> ActionCoordinator::prepare_and_stage_resolved, staging one AuthoritativeBundle whose typed post-images are mush-inventory's own state families under its own OwnerId (inventory_pools, inventory_books on K's reservation_book_state_family_descriptor, inventory_lots, inventory_tranches, inventory_applied). The handler itself mutates NOTHING and confirms nothing: every quantity mutation goes through ReservationBook::checked_apply_resource or checked_consume, the pool scalar and the book are written together in that one bundle, and the actor's confirmation is commit-bound so it can never outrun the durable ack. It registers the tree's first AuthorityGuardKind::Reservation validator under mush-inventory's own OwnerId and one FactProvider namespace (inventory.*), answered from the committed bundle's own applied marker and never from a status. No conventional document at all -- no legacy-post-image family, so no future family to name. E7 cut 2 independent verify fold: the surface gains one STAFF switch, @inv/quarantine, which is the operator surface for the half of the boot quarantine that can only be marked BY KEY (a pool scalar that survived without its book names no endpoint), and it prints the reconciliation order rather than parking state on wait-for-staff; and the four reads gain a continuation ARGUMENT, after=<cursor>, because the listings used to visit exactly one page of a global family and filter afterwards, so a viewer's own stock was displaced by unrelated endpoints and reported as empty. One primary verb, one registration, one stanza, no family: cut 2 still owns no conventional document. The lot verbs now read the authorised endpoint the offer's Choice minted (split/merge/dissolve refuse a lot at any other endpoint with the missing-lot refusal, byte for byte); the read gate delegates to mush_economy::may_view_vault and the take gate to mush_economy::may_take_from_vault, which is E3's own vault-withdraw standing, so cut 2 keeps no vault-authority predicate of its own; the request-keyed applied marker is now the epoch-independent replay guard and refuses rather than being rewritten; and store::reconcile no longer runs on the command path (08i answer 15: typed reads in ticks and boot reconciliation)."

[[handler]]
name = "@journey"
category = "legacy-post-image"
family = "sim.journey"
note = "E7 cut 6 (10b 3.6, RESOLUTION A): carrier journeys -- a ship and everything aboard it move together along a RouteDef's legs on the world IC clock. ONE CommandSpec, therefore ONE registration, taking the CEILING class of its four switches: /show is a read and /plan is a dry run that writes nothing, while /depart and /divert write the exempt sim.journey record. That record is the bounded whole-document CarrierJourney at the deterministic key cjourney:<root>, with a strict TryFrom wire that re-runs every constructor invariant (the leg cap MAX_LEGS 32 is RouteDef's own and is re-run twice inside RouteDefWire::try_from) -- a stored set over any cap is refused on load, never truncated, and since the independent verify fold never DELETED either: a refused document is held, its carrier quarantined and staff paged, because an under-way carrier is deliberately unplaced and that document is the only record of where it and its whole subtree are -- plus the journey allocator at journey_meta, which also carries the tick's rotation cursor. It takes NO part in authority or prepared mechanics: there is no typed state family, no revision_validator, no schedule_source and no WorldEvent variant. The placement it moves is the pre-existing SYNCHRONOUS SpatialState lane, and every carrier-root placement change on the tree (depart, the journey tick's arrival, and that same tick re-run at boot) goes through the one checked transition::move_carrier_subtree, which states the carrier-root invariant once: a root may never come to rest inside its own subtree at any depth, the subtree moves atomically with it because only the root's own record changes, and the walk is bounded at MAX_CARRIER_SUBTREE. The advance itself is a Coarse reg.tick (sim.journey) on the housing assessment tick's pull-not-subscription shape, bounded per fire on journeys visited and worked from a rotation cursor; the leg cursor is the idempotency key, so re-running the pass -- which is exactly what a reboot does -- applies nothing past what is already applied, and that is the crash-gap heal. On arrival it calls mush-scenes' SceneRecord::raise_ic_floor_on_arrival (E6b's one floor seam: monotonic, bounded by MAX_IC_FLOOR_LEAD_SECS, refused after the seal, and it never touches clock_generation); a refusal there is paged with its numbers and NEVER holds the journey (Q6A/S6A). The future family is the sim.journey record K8.5 replaces this allowlist with; the typed placement family it would ride is deferred to E7k (08h Q5). @domain/promote|demote|summary land as switches on the pre-existing baseline @domain and add no stanza."

