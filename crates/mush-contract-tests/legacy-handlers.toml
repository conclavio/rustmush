[[handler]]
name = "+contact"
category = "read-only"
note = "E7 cut 7 (10b 3.7, 08i answer 1): one contact this actor's own platform holds, rendered from mush-core's leak-safe ContactLedgerState plus propagation's provenance side projection. Writes nothing. It names NO future family on purpose: the contact record is K6's ContactState and mush-tactics is its sole lifecycle authority -- propagation registers no contact family at all. A contact somebody else holds and one that does not exist are the byte-identical refusal."

[[handler]]
