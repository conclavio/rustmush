[[handler]]
name = "exit"
category = "authoritative"
note = "16b cut K.2 (doc 16 section 3.7, section 3.8; 16b section 8 cut K, K2). EXIT is BOARD reversed, and the order is the safety argument: Control{Released} to the arena FIRST (which raises the epoch and purges whatever that seat had queued -- the reason a pilot who types FIRE and EXIT in one burst fires nothing), then the seat itself through the same mush_sim::request_seat_activation seam (Release: the narrowing cleared, the focus relinquished, the station's declared fallback fired), then the body out of the pod and back into the team room, then -- while the centre is still Boarding -- tacsim::match_::slot_vacated, so the trigger stops counting a pod nobody is in. It carries ProxyAct::Abandonment's station-lane guard site (mush_sim::seat_restriction): a driver lent somebody else's crew member may not climb out and leave the unit idling. Contextual inside a pod; the CockpitGate refuses it anywhere else in one line (\"You are not in a pod.\")."

