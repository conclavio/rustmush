note = "E7 cut 3 (10b 3.3): the ore body -- @deposit/open|access (staff mutations) and @deposit/list|show (reads, paged on records VISITED at INDUSTRY_PAGE with an honest after=<cursor> continuation). ONE CommandSpec, so it takes the ceiling class of its four switches, and the two reads simply never submit -- the same argument cut 2 made for @inv's four read switches. It is Authoritative rather than ReadOnly for a mechanical reason recorded in 10b 3.3's As built: a body's remaining reserve IS cut 2's Pool at the body's own endpoint (OPEN 1, D-E7-3), and a pool can only be credited inside an authoritative bundle, so OPENING a body is an authoritative act. industry.deposit is likewise authoritative rather than 4.1's drafted exempt: accessibility decides whether a cycle is legal at all and the curve decides its yield, which 4.1's own closing rule ('not exempt, ever: ... anything that changes action legality') settles, and a conventional document could not serve the provider's prepare-time re-read at all. Disclosure (rule 4): @deposit/show on an unknown id and on a known but unsurveyed one are BYTE-IDENTICAL, and an unsurveyed body is not listed; only staff read the authored reserve, the accessibility, the grade or the curve. The crate is neutral -- it holds no ore family definition, no band table, no route and no corridor fact; the ruleset authors those through cut 1's packs."

