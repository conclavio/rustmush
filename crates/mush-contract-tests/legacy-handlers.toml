[[handler]]
name = "@survey"
category = "legacy-post-image"
family = "industry.survey"
note = "E7 cut 3 (10b 3.3, F lens, D-E7-6/Q1A): @survey <body> writes the one conventional document this cut owns -- industry:survey:{deposit}, a bounded per-principal disclosure map behind a strict TryFrom wire that re-runs its constructor caps on load and is REFUSED past MAX_SURVEY_BANDS (8) rather than truncated, because a silently dropped row is a principal who was told something the record then denies. It is exempt under 4.1's closing rule for a precise reason: it is PURE DISCLOSURE. Filing a claim does not require a survey and NO legality check reads a band, so the record takes no part in authority or prepared mechanics. It is deterministic and takes NO RNG: a survey copies the body's RECORDED grade_class/reserve_class verbatim, never reserve re-quantised per viewer, so repeated surveys cannot narrow a band, two principals' bands are the same two BandIds, and a replay is a HIT that rewrites nothing. There is no rand::, rand_chacha, thread_rng, SeedableRng or OsRng anywhere in mush-industry, so provider_rng_policy is green by construction; if a later cut ever wants survey QUALITY to vary, the only lawful source is PrepareCtx::start_resolution on the prepared path and that would move this verb to authoritative. A corrupt document is skipped LOUDLY and its body marked, and the direction of that loss is disclosure only: nobody's authority moves."

[[handler]]
name = "@tacsim"
category = "legacy-post-image"
family = "tacsim.pack"
note = "E7 cut 1 (10b 3.1 / 4.1's cut-1 row), as folded after the independent adversarial verify: the TacSim content-pack surface -- @tacsim/pack list|show <id>[@<version>] [<from-entry>]|verify [<id>[@<version>]] (reads; verify is now STAFF-only and every one of the four listing surfaces is paged on records VISITED at PACK_PAGE), @tacsim/seed <pack> [dry|commit] and @tacsim/pin <subject>=<pack>@<version> | <subject>= | list (staff). The pin switch gained an unpin path and a listing -- ARGUMENTS to the existing switch, not new primary verbs -- so this stanza is refreshed rather than joined, and the unpin is the module's one ModuleWrite::Del (no index floor is derived from a tacsim:pin: key, so it removes exactly the pin). Bounded whole-document catalog/workflow records (tacsim:pack:{id}@{version}, tacsim:seed:{pack}@{version}, tacsim:pin:{subject} capped at MAX_PINS, tacsim:meta), each behind a strict TryFrom wire that re-runs its constructor caps on load, each on a deterministic key. It takes NO part in authority or prepared mechanics: cut 1 registers no FactProvider, no canon outcome kind, no authority-guard validator, no clock provider, no schedule source and no typed state family, holds nothing and reserves nothing, and reaches no economy, org, party, faction, market or tactics entry point at all -- the crate has no edge to any of them. The seeded objects and their latch ride ONE WriteBatch (World::create marks dirty, Ctx::persist queues a ModuleOp), so a reboot sees both or neither, the commit now gates its confirmation on the durable ack, and a second commit is a HIT keyed on the stored latch KEY, which survives the document's own corruption. A published (id, version) whose file is re-signed in place refuses the BOOT naming the file and both digests (owner decision 2026-09-05); no command adopts it."

