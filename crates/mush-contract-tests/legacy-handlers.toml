# Rule 1 -- the pinned legacy-handler allowlist (08i section 4; K answer 12, ratified
# 2026-09-04). Read by crates/mush-contract-tests/tests/legacy_handler_allowlist.rs.
#
# Doc 09 section 7 rule 1, "no new mutating legacy handlers", is ratified with a NARROWER
# exception than 08i Draft 0.1 proposed: allowed temporarily are bounded whole-document
# workflow/catalog records with strict decoding, deterministic keys, a declared future
# family/migration, and no participation in authority or prepared mechanics. NOT exempt:
# reservations, contacts, leases, windows, production state, mechanical offers, or anything
# that changes action legality. The economy carve-out (09 section 7 item 5) applies where the
# Ledger/seal gates prevent migration, not automatically to every E6/E7 handler. K8.5 replaces
# this file with command registration metadata (read-only / legacy-post-image /
# authoritative); until then this file is the pin.
#
# This is the baseline pinned on main at b0e3b52: EVERY primary verb the production server
# registered at that commit (core + engine + server staff commands + server_modules_with +
# worldgen + npc + one ruleset, unioned over the wod and shadowrun compositions, since a
# server runs one ruleset), each as `baseline`, sorted by name in byte order. Existing verbs
# are deliberately NOT hand-classified here -- that is K8.5's registration metadata. The
# parenthetical in each note is provenance only (which layer registered the verb at the pin).
#
# Every handler added after the pin MUST be added here in the same commit with a
# non-baseline category and a note saying why it is exempt or which prepared path it rides,
# and a `legacy-post-image` entry MUST name its future typed family:
#
#   [[handler]]
#   name = "@verb"              # the primary verb exactly as registered (aliases are not entries)
#   category = "read-only"      # read-only | legacy-post-image | authoritative | economy-carve-out
#   family = "owner.family"     # the future typed family (required for legacy-post-image)
#   note = "why it is exempt, or which prepared path it rides"
#
# The tripwire fails on: a registered command missing here (it prints the stanza to add); a
# listed command no longer registered; a legacy-post-image entry without a family; an unknown
# category; a non-baseline entry without a note; a duplicate or out-of-order entry; and a
# baseline count other than the pinned one (a baseline entry may be retired with its verb,
# lowering the pin in the same commit; none may be added).
#
# 16b cut R-b (2026-09-16) deleted the two character rulesets. Their 53 baseline verbs (the
# 49 pinned as "wod composition only" / "shadowrun composition only", plus +cast, +heal,
# +resonance and +spec, which both registered and nothing else did) and the Shadowrun
# economy layer's five later entries (+fence, +lifestyle, +nuyen, +run, @sr) retired with them;
# the pin fell from 151 to 98. The one game sheet (tacsim::sheet) registers +sheet, @sheet,
# +chargen, +stat and +roll, which stay as the "every composition" baseline entries they were.

[[handler]]
name = "+atlas"
category = "read-only"
note = "S1 (14-spatial-implementation-plan 3.1): the atlas views -- the viewer's neighborhood as a text map and a room list, a neighborhood by name, or the region's footprints and corridors (+atlas/region). Presentation over the atlas records, filtered for the viewer (a room the viewer may not enter is absent, not blanked); no durable mutation of any kind."

[[handler]]
name = "+build"
category = "legacy-post-image"
family = "worldgen.proposal"
note = "S3 (14-spatial-implementation-plan 3.4): the building agent's player surface. +build/place reserves a site request through mush-atlas (a bounded whole-document request record, mod:atlas:request:<id>, keyed by an idempotency key over character, neighborhood, kind and footprint hash, so retries converge) and writes the proposal record (mod:worldgen:proposal:<id>, strict wire, a revision an off-loop outcome must match or be dropped); /answer, /feedback and /withdraw rewrite that record; /go on a player's request rides mush-atlas's activation (a site pack applied through mush-content's latch, the site marked hydrated and pending review, one BUILD ticket), and on a staff proposal rides @atlas/pack apply's path plus a post-hoc BUILD ticket for the record; /show and /status are reads. No tool of the off-loop run touches the world (doc 14 4.1): the run is snapshot in, typed outcome out (treaty ruling 3). No authority, no prepared mechanic."

