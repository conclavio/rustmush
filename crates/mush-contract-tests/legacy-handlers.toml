note = "E7 cut 9 (10b 3.9, Q9A/D-E7-19, doc 10 T8/R2). The persistent order of battle: /create, /attach, /detach and /assign write the exempt whole-document FormationNode at the deterministic key formation:<id>, with a strict TryFrom wire re-running MAX_FORMATION_MEMBERS 64, the no-duplicate-member and no-self-parent rules, and the label caps; MAX_FORMATION_DEPTH 5 and the cycle check are enforced on the attach path by a walk BOUNDED ON NODES VISITED. Each node names EXACTLY ONE owning OrgScopeId -- the field is not an Option, so a node with no scope is unconstructible -- and force.create/attach/detach/assign/command resolve through mush_org::authorize_in_world against that scope, which is why the five ids are added to org_capability_vocabulary() in the same commit (an unlisted id fails LOUDLY at @org/grant). Composition is a CONSTRAINT SET and `exact` is the derived predicate minimum == maximum, never a mode, so a four-unit lance and a five-unit star share an echelon and stay distinct kinds; strictness is scoped to creation, doctrine qualification or an operation's requirement and NEVER to a formation's existence or its ability to deploy -- an understrength formation exists, deploys, and says so. Kinds are pack-authored (PackEntry::Formation) and reach the crate through CampaignModule::with_formation_kinds at the composition root, so mush-campaign gains no ruleset edge; unwired, @force/create refuses every kind. No typed family, no validator, no schedule source, no authoritative submit."

