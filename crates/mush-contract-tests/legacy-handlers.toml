[[handler]]
name = "order"
category = "authoritative"
note = "16b cut Y.1, extended by 16b cut Z.2 (doc 16 section 3.7 Verbs, section 6 Deliberation, section 11 E.1/E.2; 16c N3, N6, Q38 and Q44; 16b section 9 cuts Y and Z). The thirteenth cockpit selector, with seven arms: ORDER <squad|ALL> HOLD | ADVANCE <spot> | ENGAGE [<contact>] | WITHDRAW | SCREEN <bearing> | SUPPORT <callsign> [HOLD FIRE], or ORDER <squad|ALL> RELEASE. The first six command the side's MACHINES with the six objectives the LLM seam also gives (cut Z.2 added Objective::Screen, a bearing of 0 to 359 held as an arc without giving chase, and Objective::Support, a tank of the pilot's OWN side resolved by its callsign against the running match's callsigns and kept station on); the seventh, RELEASE, hands the named squads back to doctrine at once. All parsed by one pure match_::cockpit::parse_order (a squad id such as red-1, a bare ordinal of the pilot's own side, or ALL; a spot is every word up to the HOLD FIRE tail; a contact and a callsign are one word; a bearing is digits only; RELEASE takes no tail). The authority is 16c Q38's default read once per ORDER in one borrow of the MatchBook: the side's lead (Centre::leads_side) orders every squad of the side, anyone else only the one unit of their pod pair (slot 1 with 2, 3 with 4) when a machine flies it, addressed by the word of the squad that holds it and acknowledged by its callsign. It writes NOTHING durable: after authorising the seat ONCE on the issuer's own tank and the helm channel (arena_bridge::authorise_seat, factored out of forward_intent), arena_bridge::forward_order stamps one IntentKind::Order per unit, and arena_bridge::forward_release one IntentKind::ReleaseOrder { squad, issuer } per unit (continuous, helm, sharing Order's pre-pulse buffer key so the pilot's last word applies), each with that unit's own helm epoch, and offers it to the match's bounded inbox -- no document, no world mutation, no prepared mechanic; the only world writes are RAM rows on the tacsim module's existing ArenaRegistry slot: an OrderWatch (ArenaRegistry::note_human_order, the issuer remembered, one more on the match's pilot count for the @arena/status orders: line), which also shields the squad from the LLM seam until the order runs out, removed by a RELEASE only when its issuer is the releasing tank (ArenaRegistry::note_order_released), and the per-issuer rate stamp every arm, RELEASE included, spends. The arena authorises each unit again at apply (a unit a pilot has since boarded refuses NotReflex silently) and journals one `ordered` line per unit an order landed on and one `order_released` line per unit a release dropped to doctrine, both under phase 2's one hash. Three refusals of its own, each one line: \"No such squad.\" -- byte-identical for the other side's squad, a squad that names nothing and one beyond the pilot's authority, and said BEFORE any contact or callsign is looked at -- \"You have no squad to order.\" for an ALL with nothing under it, and \"No tank of your side flies that callsign.\" -- byte-identical for the other side's callsign, a provisional, a slot nobody flies and a word that is no callsign; a target or a spot the panel does not know takes the one byte-identical \"No such contact.\". The acknowledgement is said to the issuer alone (no radio line). Contextual on a focused station of a deployed unit, refused elsewhere in one line by the tacsim module's CockpitGate. The category is `authoritative` with the rest of the cockpit rather than `read-only`, because the fifteen verbs are one subsystem on one lane and BOARD and EXIT, which carry the writes, cannot be anything else."

