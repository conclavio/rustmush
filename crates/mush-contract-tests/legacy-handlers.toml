category = "read-only"
note = "E7 residue pass 1, R2 (10b 15.1 item 7): the corridor as a live domain, read side. @corridor/show|rules|domain <route>[@<version>] are PURE READS of the materialized route projection tacsim already re-derives from its loaded packs and seed latches -- no document, no economy post, no authoritative submission, no state family, and nothing here mutates the ActivationBook. The projection they read gained three PACK-AUTHORED fields in the same commit: hazard (a band, 0..=MAX_HAZARD_BAND) and interdiction (a threshold) on PackLeg/LegDef, and controller (a symbolic CanonicalId, never a world id, so a definition stays pinnable across a re-seed) on RouteEntry/RouteDef -- each behind its existing deny_unknown_fields wire, each serde(default) so a pack authored before this pass loads byte-identically, and each skip_serializing_if so an unauthored field never enters a pack digest: the shipped tacsim.corridor v1 digest is unmoved and every v1-pinned route, unit and open contract is untouched (T1/Q18A). The LIVE half is not here: the journey tick's intermediate leg boundary raises a DomainActivation { trigger: Interception } through mush_sim::domain::raise, the ONE request seam @domain/promote also goes through, and cut 8's authority is still the only applier -- no DomainClock variant was added and the composition-frozen ClockProviderRegistry is not touched. Disclosure: an unobserved corridor and one that was never authored answer the byte-identical \"No such corridor.\", so the verb is not a corridor-existence oracle, and a leg that presents into no domain says so and names no sentinel DomainId."

