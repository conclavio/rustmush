[[handler]]
name = "bearing"
category = "authoritative"
note = "16b cut Q.1 (doc 16 section 3.6 What a pilot sees, section 3.7 Verbs; 16b section 9 cut Q). One of the twelve cockpit selectors, and one of the seven that only read: BEARING [<contact>] answers which way one contact plotted, absolute and off the platform's own nose, and says how old the plot is when it is older than one sensor pass. It reads the last `arena.cockpit` keyframe the arena sent this pilot (the world keeps one row per pilot on the ArenaRegistry, dropped with the match) and re-emits it on the same feed, so the ANSI renderer, the TUI and the web draw one structure. The contact is the one the pilot named, resolved against that frame's own rows by its short designator, else the platform's lock; a name the platform does not hold takes the one byte-identical \"No such contact.\", and no lock with no name takes its own line. Contextual on a focused station of a deployed unit, refused elsewhere in one line by the tacsim module's CockpitGate. No document, no world mutation, no intent: it is a read of a mirror the arena wrote. The category is `authoritative` with the rest of the cockpit rather than `read-only`, because the fourteen verbs are one subsystem on one lane and BOARD and EXIT, which carry the writes, cannot be anything else."

[[handler]]
name = "board"
category = "authoritative"
note = "16b cut K.2 (doc 16 section 3.3 Stations are on the tank, section 3.7 Boarding; 16b section 8 cut K, K2). BOARD is the verb that fills cut K.1's named Boarding -> Running trigger. Contextual in one of the centre's two team rooms for the character that holds that side's slot; the tacsim module's CockpitGate refuses it anywhere else in one line (\"Boarding is through one of the simulator's team rooms.\"). In one authoritative action it declares the `cockpit` station on the pod's TANK through mush_sim::declare_station (a stations:<host> post-image on the sim lane, idempotent -- the same pod always flies the same tank, so a re-board rewrites nothing), places the character inside the pod through mush_sim::place_interior (a placement record on the same lane), activates the seat through mush_sim::request_seat_activation, which is the ONE path in the tree that writes a billet, narrows its channel set to helm/sensors/fire, claims the account's single foreground focus and asks K6 for the control lease, and reports the seat to tacsim::match_::slot_seated. When that was the last seat the match was waiting for, cut T.3's whole check-out runs inside this same command: the deployed markers, the frozen placements and the CustodyOut. Every refusal is taken before the first write, and a seat that refuses after the body is in the pod takes the body back out."

