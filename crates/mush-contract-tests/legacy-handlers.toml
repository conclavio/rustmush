[[handler]]
name = "scan"
category = "authoritative"
note = "16b cut Q.2 (doc 16 section 2 W5, section 3.3 Sections, section 3.6 What a pilot sees, section 3.7 Verbs; 16b section 9 cut Q). One of the twelve cockpit selectors, and one of the seven that only read: SCAN [<contact>] prints what is left of one contact section by section as green, yellow, red or destroyed, with the age of the LOOK that read it, and never an exact number. It reads the last `arena.cockpit` keyframe the arena sent this pilot (the world keeps one row per pilot on the ArenaRegistry, dropped with the match) and re-emits it on the same feed, so the ANSI renderer, the TUI and the web draw one structure. The reading is the arena's: a sensor pass records one only for a contact this platform has CLASSIFIED and only inside [tacsim.sensors].condition_reach_permille of the effective reach the range test just used, so a chassis vocabulary is never published off an unresolved return and a per-section picture is never free at the edge of detection. The contact is the one the pilot named, resolved against that frame's own rows by its short designator, else the platform's lock; a name the platform does not hold takes the one byte-identical \"No such contact.\", a contact it holds but has not identified is told there is nothing to read, one with no reading is told to close the range, and no lock with no name takes its own line. Contextual on a focused station of a deployed unit, refused elsewhere in one line by the tacsim module's CockpitGate. No document, no world mutation, no intent: it is a read of a mirror the arena wrote. The category is `authoritative` with the rest of the cockpit rather than `read-only`, because the fourteen verbs are one subsystem on one lane and BOARD and EXIT, which carry the writes, cannot be anything else."

