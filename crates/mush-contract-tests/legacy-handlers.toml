[[handler]]
name = "@market"
category = "authoritative"
note = "E7 residue pass 2 (P1, 10b 15.1 item 3): the category moves legacy-post-image -> authoritative, the CEILING class of its switches. @market/vendor stock places one lot listing's inventory reservation and @market/vendor withdraw (a NEW SUB-VERB on an existing primary verb, so no stanza and no PINNED_BASELINE movement) releases it, each staging exactly one Ctx::submit_authoritative of the market-owned market_lot action over cut 2's DELEGATED InventoryFamilies. The ReservationId is DERIVED before the submit (mush_market::listing_reservation) and the listing document is written naming it, so a crash between the two leaves a listing whose hold nobody placed -- withdrawn and paged per listing by a new arm on the market's EXISTING market.sweep Coarse tick, which stages no authoritative submission (the tick-cadence rule). NO InventoryVerb; ENGINE_OWNED_RESERVATIONS unchanged; no mint. Authority moved with it: @market/vendor stock and /withdraw are acts of the vendor's OWN organization (mush_economy::acts_for) for a lot-represented good, so doc 10 11's proving loop needs no staff act to sell what a run produced; create, fund, retire, /catalog and /source remain staff, and the title-minting arm of stock is still staff-only. E6c (08f 5.1/5.2): staff catalogue and vendor administration -- @market/catalog load|list|show over a wiring-frozen content-pack source, @market/vendor create|fund|stock|retire, @market/source create|budget|halt. Bounded whole-document catalog records (market:catalog:{pack}:{code}, market:vendor:{id}, market:source:{id}) with strict TryFrom wires and deterministic keys; a bad entry fails the PACK and never the server. It takes no part in authority or prepared mechanics: funding is a create_system_obligation drip from a registered faucet under the [economy] mint cap, stocking a titled asset goes through mush_economy::issue_title under the composition-frozen sr.market issuer, and no @contract/@obligation/@asset/@vault/@org command is ever dispatched from the handler."

