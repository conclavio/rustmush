[[handler]]
name = "@wo"
category = "authoritative"
family = "industry.workorder"
note = "E7 cut 4 (10b 3.4, contradiction (iii)): work orders. AUTHORITATIVE typed state -- its state transition gates capacity legality (a Running order holds a slot a competitor cannot take) and its reservations/holds lists index authoritative records, so WorkOrder and ProductionSchedule are prepared-path families, not exempt documents. @wo/draft|submit|cancel|deliver|restamp ride cut 2's B1 ingress seam (submit reserves each material input as a cut-2 inventory reservation, one facility slot as a B1 capacity reservation, all under the work order's deterministic holder key wo/{order}, in one bundle; deliver consumes every reservation, releases the slot, materializes the output lot via cut 2's mint_origin, and writes the industry.workorder.completed marker the fact is answered from -- no fallible step after the first install); quote|show|list are ReadOnly reads (a conservative over-declaration 08j 7 Accept permits). @wo/quote's price and duration are a PURE FUNCTION of the recorded pinned inputs and reserve nothing, so a quote is never an inventory or capacity oracle. The recipe reaches industry by composition (Arc<dyn RecipeAuthority> at the root reading TacsimStore), not by an edge; money stays an E4 Hold and never grows a resource field. The production schedule runs on ClockRef::WorldIc via a Registrar::schedule_source on handoff.rs's shape (D-E7-16's 'cut 8 gets the first production schedule source' corrected)."

