[[handler]]
name = "@arena"
category = "authoritative"
note = "16b cut T.3 re-classifies this stanza from read-only, in the same commit as the switches that move it (doc 16 section 3.1 Custody, section 3.8 Lifecycle; 16b section 7 T2/T5). @arena is ONE staff verb (SIM_ADMIN or Royalty) with six switches. /status is still the read cut T.2 registered -- every match this server is running, with its lifecycle state, its tempo, its arena time, how often it has lagged, how many ledger chunks have been appended and lost, how many cockpit frames have gone out, and how many ledger writes await the store. /start <arena>=<red ids>/<blue ids> is the one that moves the class: it runs Selection -> Boarding -> Running in ONE authoritative action that mints a match id (persisting the counter tacsim:match:seq), writes a `deployed { match, arena, snapshot }` marker onto every named unit's tactics record through mush_tactics::custody under a declared tacsim -> tactics persist delegation, leaves each world placement frozen, and hands the arena custody. /intent <unit>=startup|heading <deg>|speed <cms> stages one order into the running arena's bounded inbox -- no document at all, but it is a write into an authority. /abort [<match>] sends Stop{Abort}, and the check-in that follows (driven by the arena's own Ended message through the tacsim module's async re-entry, not by the verb) clears every marker, re-places every unit at the arena's final pose, releases its seats and writes one tacsim:match:<id> result document. A fifth switch, /fault <match>, exists ONLY under cfg(any(test, feature = \"fault-injection\")) -- it arms cut T.2's hidden panic hook so the two verify lenses can show that a panicking pulse voids its match and the world keeps serving; no shipped binary compiles it. The match ledger itself is still not written by this verb: the world task appends each arena chunk to log:match.<id> in tacsim's own namespace from the arena-egress re-entry, on the ordinary module-op lane mush-scenes and mush-canon already append their ledgers on. REFRESHED (not joined) by 16b cut K.1: a switch is an ARGUMENT to this existing verb and not a new primary verb, so this stanza is refreshed and PINNED_BASELINE does not move. /reset is doc 16 section 3.8's *idempotent, re-runnable by staff* return of the simulator centre to Idle -- it clears the terminal row an ended or failed match left on the lobby's RAM state (the slots and pod locks the check-in already released), writes NO document, and is REFUSED outright while the centre still holds a checked-out match, because only the check-in gives units back and @arena/abort is what starts one. /status gained the centre's own rows ahead of its per-match rows, so staff and pilots read ONE state; a centre nobody has touched adds nothing and the read answers with the one line it always did. /start now runs through cut K.1's machine: it refuses while the centre is live, and on success it binds the centre to the match it started so SIM STATUS in the lobby and @arena/status at a console cannot disagree.REFRESHED again (not joined) by 16b cut D.3, which adds /release <unit> as a SWITCH and not a new primary verb, so PINNED_BASELINE does not move: it clears ONE unit's stranded `deployed` marker by restoring that unit from the check-out snapshot the marker itself carries (the void form of mush_tactics::custody::check_in, under the same declared tacsim -> tactics persist delegation this stanza already describes -- one unit:<obj> post-image and nothing else) and releases its cockpit seat, lease and focus in the same authoritative action. It is REFUSED while the unit's match is still live, where @arena/abort is the verb, and refused for a unit carrying no marker at all. It exists because until this cut the boot reconciliation was the only thing in the tree that cleared a marker, so a check-in the strict encoder refused left that tank unusable -- unresettable, unrefittable, unfieldable and unboardable -- until the server half was restarted. The same cut gave /reset a third headline (\"The simulator centre is idle, but not clean:\") for a pass that wrote nothing and skipped or failed a tank, and no new writes. REFRESHED again (not joined) by 16b cut U.4, which adds /pose as a SWITCH and not a new primary verb, so PINNED_BASELINE does not move: /pose <callsign>=<x> <y>[ <heading>] records the arena cell (and heading) one centre slot's unit opens the NEXT match on, /pose <callsign>=off gives that slot its authored cell back, and a bare /pose lists what is set. It writes NO document and NO world state: the overrides are one BTreeMap and one Option<MatchId> on the tacsim module's own RAM MatchBook slot, beside the centre and not inside it, so a return to Idle does not wipe them. They ride each slot's Fielded into the existing Boarding -> Running check-out, which offers the cell to match_::opening_pose as the unit's world pose -- validated exactly as a staff placement is, falling back to the entry zone -- and so move no custody and no marker of their own. /pose is refused while the centre is Running or Stopping, and the overrides are cleared by the end of the match that used them, by /reset, and per slot by =off. /status gained, after its existing lines, one line per unit a stranded deployed marker still holds (\"#N carries a stranded deployed marker (match M); @arena/release #N\") -- a read, naming object ids on a staff surface -- because since the same cut @find omits every unit an arena holds and /release takes a dbref and nothing else. REFRESHED again (not joined) by 16b cut V.3, which adds /report as a SWITCH and not a new primary verb, so PINNED_BASELINE does not move: /report [<match>] [<chunk>] reads ONE page of a match's own tape -- mush_core::MAX_STORE_READ_KEYS chunks of the namespace's own log:match.<id> from the chunk named, oldest first, as the precedents page a log -- through Ctx::read_store, one read in flight per actor, re-entered through the tacsim module's one StoreReadCompletion (match_::report::ReportRead), which re-validates that the actor is still staff and renders one line an event (position summaries left out) under a header with the seed. A read: NO document written, NO world mutation. It has NO live, restart or remembered-match gate, because a running or crashed match's tape is exactly what an operator reads. REFRESHED again (not joined) by 16b cut I.3 (16c N10), which adds /tempo and /place as SWITCHES and not new primary verbs, so PINNED_BASELINE does not move. /tempo <match>=<period_ms> | <match>=off | <match> floors a RUNNING match's wake interval (engaged_ms to 10000 ms in steps of engaged_ms), lifts it, or reads it: it offers ONE ArenaMsg::TempoFloor into that match's bounded inbox under the same reserve rule an intent meets, and only after the offer lands writes the tacsim module's own RAM MatchMirror.tempo_floor_ms, which /status prints on a line of its own -- NO document, NO world state beyond that RAM mirror; never a pause, and the tempo floor is folded into no hash. /place <unit>=<x>,<y> stages ONE IntentKind::Place order into the running arena's bounded inbox, stamped as the unit's own seat exactly as /intent is (the two share one body): NO document at all, but a write into an authority, which resolves it in pulse phase 4 against the cell entry test and a round in flight to or from the unit. The world refuses only what it can judge honestly -- a match the lifecycle book no longer holds Running, and a cell off the arena window or with no way out, against the ground the registry holds -- and those refusals reach no tape; a place the task still held when a Stop ended the match is journalled place_refused with the reason stopped. What the arena itself records of either switch is three new ledger kinds on the match's own log:match.<id> (tempo_floor, placed, place_refused), appended by the world task from the arena-egress re-entry on the lane the stanza already describes; nothing of either is ever said to a pilot. REFRESHED again (not joined) by 16b cut I.4 (16c N10), which adds /watch as a SWITCH and not a new primary verb, so PINNED_BASELINE does not move. /watch <match> binds a staffer who holds no centre slot (theirs or their account's) and no seat to a RUNNING match as one of at most eight watchers, drops their RAM replay cursor, and for the match's first watcher offers ONE ArenaMsg::Watch { on: true } into that match's bounded inbox under the same reserve rule an intent meets; /watch off unbinds them, sends their panel one cleared arena.observer keyframe, and offers Watch { on: false } when the last watcher goes; a bare /watch reads. It writes NO document and NO world state beyond the tacsim module's own RAM ArenaRegistry (the watcher rows and the last picture of each watched match): the arena builds its staff picture in pulse phase 5 at most once an arena second while watched, a view folded into no hash, and the world pushes it on the new arena.observer panel feed to the watchers and to nobody else -- never a pilot; the line client prints none of it. A disconnect and the end of the match unwatch too."

