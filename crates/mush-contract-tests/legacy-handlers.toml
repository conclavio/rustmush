[[handler]]
name = "sim"
category = "authoritative"
note = "16b cut K.1 (doc 16 section 3.7 Verbs, section 3.8 Lifecycle; 16b section 8 cut K, K1). SIM is ONE player verb -- the simulator lobby's whole surface -- with THIRTEEN selectors (refreshed by 16b cut V.2, again by 16b cut V.3, again by 16b cut I.1, again by 16b cut O.1 and again by 16b cut O.3), each of which may be spelled as a leading word (doc 16's SIM STATUS) or as a switch (SIM/STATUS); both resolve to the same selector on the way in, so there is one code path and not two spellings. /team red|blue claims one pilot slot, keyed by the immutable AccountId (doc 10 R3: an unmapped character fails CLOSED and is refused) and recording the character beside it, at most one per account and at most as many a side as the centre has pods; /leave releases it, and the last release returns the centre to Idle. /start is the one that mints: a side's first claimant or staff, with at least one pilot a side, allocates a match id through the same persisted tacsim:match:seq counter @arena/start uses, locks pod n of a team room to slot n of that side and arms the boarding deadline. It writes no unit record and takes no custody; the CHECK-OUT is fired later, by the named Boarding -> Running trigger, which runs cut T.3's match_::start unchanged -- the same one authoritative action, the same deployed { match, arena, snapshot } marker per unit through mush_tactics::custody under the already-declared tacsim -> tactics persist delegation, the same frozen placements. The trigger fires when every claimed slot is seated (cut K.2's BOARD reports a seat through match_::slot_seated) or when match.board_timeout_ms elapses on the module's own coarse world tick, with unseated slots dropped and an empty side aborting. /abort, by any pilot holding a slot or by staff, releases slots and pods from Selection and Boarding (there is no custody before Running) and from Running sends Stop{Abort}, whose check-in is cut T.3's and is driven by the arena's own Ended message, not by this verb. /status is a pure read of the centre. 16b cut Q.7 added the SIXTH selector, /ai, and no sixth verb: SIM AI [n] reads or sets how many units a side fields when [tacsim.match].ai_fill tops the unclaimed pods up with machines. It is a side's first claimant or staff, in Selection only, and it writes ONE u8 on the same RAM centre row the other selectors write -- no document, no world mutation, no custody. The same cut reversed this stanza's own rule of at least one pilot a side for a server with the fill on: /start then takes one claimed slot in the CENTRE, and the Boarding -> Running trigger and the boarding deadline abort only when nobody at all is seated. With the fill off both refusals stand byte for byte. 16b cut Q.8 added the SEVENTH selector, /unit, and no seventh verb: SIM UNIT [type] reads or chooses which unit type the CALLER'S OWN slot fields, out of every unit definition the loaded catalog carries as a current unambiguous schema -- which since the same cut is the SHIPPED content PLUS doc 16 section 9's five extension items, because the three production sites now build Catalog::build_fielded and not Catalog::build_game. It is Selection only and it writes ONE Option<SmolStr> on the same RAM centre row the other selectors write: no document, no world mutation, no custody, and choosing the pod's own authored type CLEARS the choice rather than recording it. The unit record is written later and elsewhere -- at SIM START, after every refusal this stanza already describes and BEFORE the pods lock, each claimed slot whose chosen type is not its tank's is refitted through mush_tactics::module::refit_unit under the already-declared tacsim -> tactics persist delegation (module-ns-owners.toml's third crossing on that row): a whole unit:<obj> post-image through the tactics crate's own encoder, refused outright for a deployed unit, and refusing the START without locking anything or minting an id. Nothing survives the match: every release clears centre.slots, and the return to Idle puts each roster tank back to its AUTHORED type through the same seam before the F.1 stock-tank plan runs. The verb is registered GLOBALLY and a CommandGate refuses it in one line -- \"The simulator is through the lobby.\" -- anywhere but the three rooms C.1 authored in the atlas-owned OOC pack, resolved through the content latch by entry id (room.simulator_lobby, room.sim_red, room.sim_blue) and never by name; there is no staff exemption, because the gate is about the room and not about the power. The centre itself is RAM on the tacsim module's own MatchBook slot (D-16-3: an OOC match holds no durable state and never resumes), so a restart leaves an idle centre; the only documents this verb can queue are the match counter and, at the trigger, cut T.3's.16b cut D.3 added the EIGHTH selector, /concede, and no eighth verb: SIM CONCEDE is a side's FIRST PILOT giving the running match up, and it is a RESULT and not an abort -- it sends Stop{Concede{by}} through the same crate::match_::abort stop funnel SIM ABORT uses, the arena journals match_ended{conceded{winner}}, and the check-in, the tacsim:match:<id> result document and the terminal board then follow exactly as they do for an elimination, with MatchOutcome::Red|Blue naming the side that did not concede and every cell committed as evidence. It writes nothing of its own: no document, no world mutation, no custody beyond the check-in this stanza already describes. Running only, the caller's own side only, and staff get NO special case (they have @arena/abort, and an operator ending somebody's match as a loss for one side would be the console choosing who won). The same cut narrowed /abort: in Selection, where there is no match id, no pod lock and nothing checked out, a NON-STAFF SIM ABORT is now refused (\"Nothing is running yet. `SIM LEAVE` gives your slot up.\") rather than wiping every other claimant's slot; Boarding, Running and Stopping are unchanged and stay any participant's. And it added ONE tick-driven end with no verb at all: [tacsim.match].unattended_ms after the last un-left slot goes left during Running, the lobby's existing 1 s coarse tick sends Stop{Unattended} and the match ends timeout/unattended. The stamp is one Option<i64> on the same RAM centre row -- no state slot, no document -- and a staff @arena/start match, which has no slots, is never stamped. 16b cut V.2 (16c N2, the result half) added the NINTH selector, /history, and no ninth verb: SIM HISTORY prints the centre's last twenty finished matches (match_::HISTORY_DEPTH), newest first, in public words -- the match id, the outcome and its reason, the arena time, red's size against blue's, the civil UTC minute the result was written, and `(you flew <callsign>)` on a row the reader piloted. It is a PURE READ of a RAM ring on the tacsim module's own MatchBook slot (a field on the existing slot, no new slot), filled from the tacsim:match:<id> result documents at boot (boot_matches, before its restart-abort loop writes) and at every result write (write_result and write_restart_abort remember the very document they push) -- no document written, no store read, no world mutation, no custody. It is gated by the same OUTSIDE_CENTRE check at the top of the handler as every selector, and it prints no unit object number, no pilot name, no position, no contact and never the match seed. REFRESHED again (not joined) by 16b cut V.3 (16c N2, Q37), which adds the TENTH selector, /report, and no tenth verb, so PINNED_BASELINE does not move: SIM REPORT [<match>] is a DEFERRED READ of ONE tacsim:report:<match>:<unit> document -- the reader's own debrief, folded as the tape passed and written with the result by the check-in this stanza already describes -- through Ctx::read_store in the module's own namespace, ONE read in flight per actor (a RAM PendingRead row on the same MatchBook slot, superseded past mush_core::STORE_READ_STALE_SECS), re-entered through the tacsim module's ONE StoreReadCompletion (match_::report::ReportRead, registered in arena_bridge::register), which re-validates the actor and the centre and renders. It writes NO document and mutates NO world state: the only write is the pending-read row. It refuses in one sentence a match still running, one the ring no longer remembers, one the server restarted during, one the reader did not fly and one recorded before reports existed, and it is gated by the same OUTSIDE_CENTRE check as every selector. What it prints is the pilot's own projection: their own shots and outcomes, the hits on their own tank, their kills and the public outcome -- never a range, a damage figure, a draw, the seed, a contact id or an object number. REFRESHED again (not joined) by 16b cut I.1 (16c N9, Q37), which adds the ELEVENTH selector, /replay, and no eleventh verb, so PINNED_BASELINE does not move: SIM REPLAY <match> [<m:ss> | next | prev] [<callsign>] is a SYNCHRONOUS READ of RAM -- the finished match's replay (one objective picture of both sides: each unit's arena cell and heading every ledger.summary_ms, each shot's firing time and outcome, each wreck, by callsign) and the ground it was fought on, both held on the existing MatchBook slot beside the history ring. The replay is folded as the tape passes the world (arena_bridge::on_chunk, beside the debrief folds) and written by the check-in this stanza already describes as ONE tacsim:replay:<match> document in the result's own action, the result carrying replay: true; the ring's eviction deletes it with the reports. The verb writes NO document and reads NO store: it pushes one grid keyframe on the arena.replay panel feed (the one VIEW-sized 39 by 20 window, schema.retain latest) with a few Sys lines, and mutates only the actor's RAM replay cursor on the same slot (what the arena.replay and arena.map queries read for that actor, since a panel query carries no parameters) and, once per distinct arena digest after a boot, the RAM ground it builds. There is NO pilot gate -- the replay of a finished OOC match is public (Q37) -- only the same OUTSIDE_CENTRE check as every selector; it refuses in one sentence a match still running, one the ring no longer remembers, one the server restarted during, one recorded before replays existed and one whose ground is not the ground loaded, and every refusal but the two end-of-tape ones drops the cursor. It prints no object number, no pilot, no contact id, no draw and never the seed, and it reads nothing any platform's sensors saw. REFRESHED again (not joined) by 16b cut O.1 (16c N11), which adds the TWELFTH selector, /mode, and no twelfth verb, so PINNED_BASELINE does not move: SIM MODE [skirmish|hold] reads or sets which rule the next match is fought under. The bare read answers anybody in the centre in any state (the SIM AI / SIM UNIT precedent) with the current mode, the ground's authored name and the modes its compiled-in ArenaDef declares; a set is Selection only, by a side's lead or staff, refused in one sentence each for a non-lead (NotLeadForMode), an unknown word (NoSuchMode) and a mode the ground does not declare (ModeUnsupported), and announced to every centre room. It writes ONE MatchMode on the same RAM centre row the other selectors write -- no document, no world mutation, no custody -- cleared with the rest of the board at every return to Idle; the mode crosses to the arena on the CustodyOut the Boarding -> Running trigger already builds, lands on the MatchRecord, and is written as a mode key on the result and replay documents the check-in this stanza already describes writes. The board prints the rule (public in selection) and never who holds the key spot. REFRESHED again (not joined) by 16b cut O.3 (16c N13), which adds the THIRTEENTH selector, /range, and no thirteenth verb, so PINNED_BASELINE does not move: SIM RANGE [<n>] sets up a range -- the claimed side against n targets (tacsim.unit.target_mk1, the stock hull with no weapon, no sensor and no speed) on pods 1 to n of the other side. The bare word ALWAYS reads, for anybody in the centre in any state; a number sets, Selection only, by a side's lead or staff, with every claimed slot on one side and n from 1 to the side's pods, refused in one sentence each (NotLeadForRange, RangeTwoSides, RangeCount), and announced to every centre room; SIM MODE range is refused (RangeViaRange). It writes the MatchMode and ONE Option<u8> on the same RAM centre row the other selectors write -- no document, no world mutation, no custody -- cleared with the rest of the board at every return to Idle. The unit records are written later and elsewhere, by the SIM START refit this stanza already describes (the target pods refitted to target_mk1 through mush_tactics::module::refit_unit under the already-declared tacsim -> tactics persist delegation, before the pods lock), and the return to Idle puts them back. Under a range the four one-sided gates read the shooters' side alone, so a range starts with the AI fill off, and the fill takes no pod."

