[[handler]]
name = "@recovery"
category = "legacy-post-image"
family = "recovery.queue"
note = "E7 residue pass 1, R3 (10b 15.1 item 5; doc 10 Q7A/T7/S3A/7A): the recovery provider. @recovery/status|apply|grant|return over THREE bounded whole-document exempt records -- recovery_queue, recovery_app:{obj} and recovery_grant:{obj} -- each behind a strict TryFrom wire that re-runs its constructor caps on load, each on a deterministic key. A queue past MAX_RECOVERY_QUEUE (256) is REFUSED on load and HELD, never truncated, and so is a duplicated applicant; a corrupt document is held and paged, never deleted. The class is legacy-post-image for @op/activate's exact reason: the money is an outfitting stipend posted through mush_economy::post -- the economy's OWN carve-out lane -- FROM THE COMMAND, never Ctx::submit_authoritative, and the lease itself is an ordinary E4b2 contract offered through mush_economy::offer_lease, so activation places Encumbrance::Lease { lessor, contract } through the economy's own contract_encumbrance and end_lease takes it off again: this crate constructs no encumbrance, calls create_obligation never, and has no faucet, no create_system_obligation and no mint path at all (funded, never infinite -- the provider stops granting when its hulls or its budget run out, and an exhausted pool QUEUES and pages level 1 rather than being a staff decision). Eligibility is a deterministic predicate over recorded facts (unencumbered from mush-economy, reachable from mush-sim placement, deployable from the campaign's own formation records -- never a mush-tactics read, and mush-campaign gains no edge), re-evaluated AT GRANT TIME and not at queue time, byte-identical across a restart. The granting arm is a FOURTH arm on cut 9's ONE campaign.operations Coarse tick with its own MAX_RECOVERY_PER_FIRE (8) budget and its own rotation cursor, staging no authoritative submission at all. Disclosure: @recovery/status renders the caller's own application and position plus ONE aggregate that names nobody, and never another applicant's identity or queue position; @recovery/grant and /return on somebody else are staff's and answer the byte-identical \"No such applicant.\" otherwise."

