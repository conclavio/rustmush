note = "E7 cut 3 (10b 3.3 / 4.1's cut-3 row as amended): tenure over an ore body or a place -- @claim/file|show|transfer|pledge|release|contest|suspend|seize. ONE CommandSpec, so it takes the ceiling class of its eight switches. The record half rides B1's ingress adapter seam (Ctx::submit_authoritative -> Deferred::AuthoritativeSubmit -> ActionCoordinator::command_ingress + preflight -> resolve_and_stage_offer -> prepare_and_stage_resolved), staging one AuthoritativeBundle whose typed post-images are industry.claim and industry.claim_index under mush-industry's own OwnerId. 4.1's cut-3 row called ClaimRecord exempt/legacy-post-image; 4.1's OWN closing rule overrides it -- a claim gates extraction legality and the extraction provider re-reads it at prepare time under a checked revision -- so it is authoritative and this stanza says so. The transferable half is E4's, reused verbatim and never re-implemented: the claim's titled world object is minted by mush_economy::issue_title under the registered system principal industry.claims, transfer is AssetOp::TransferTitle (which refuses with Encumbered while ANY encumbrance stands, so a PLEDGED claim cannot be transferred by E4's rule and cut 3 writes no second check), pledge is Encumbrance::Collateral and dispute is Encumbrance::Disputed. Cut 3 defines no encumbrance model, no second title record and no second transfer path. Seizure of a pledged claim REFUSES and pages level 2 with the command filled in, because it would silently destroy a lender's collateral; a contest whose adjudicator contract is itself Disputed suspends the claim rather than resolving it. Every term comparison is ClockStamp::checked_cmp, so a stamp on another clock generation refuses comparison rather than expiring early."

