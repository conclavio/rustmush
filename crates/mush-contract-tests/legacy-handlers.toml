[[handler]]
name = "@seat"
category = "authoritative"
note = "E7 cut 10 (10b 3.10 B6/B8): @seat/revoke bumps the unit's control generation IMMEDIATELY (bump then republish, cut 5's order) so every queued human, NPC, pathfinder and LLM intent under the old grant fails World::channel_grant_is_current, clears the seat's narrowed channel set, and returns the seat to its declared fallback AT A SAFE BOUNDARY through the same control_handoff_request path -- never mid-tick and never a direct lease write, which is why the verb's ceiling class is Authoritative. @seat/audit is a staff read that answers WHETHER a driver token is attributed and prints no account id (R7); the token->account row is server-side (mush_core::SeatAudit, implemented in mush-server) and is never a world document, a journal line, a contract party or a canon entity."

