category = "authoritative"
note = "16b cut Q.1 (doc 16 section 3.6 What a pilot sees, section 3.7 Verbs; 16b section 9 cut Q). One of the twelve cockpit selectors, and one of the seven that only read: RANGE [<contact>] answers how far away one contact plotted, metres rounded to fifty -- or to ten for the contact the platform is locked on, which is a fire-control solution -- and says how old the plot is when it is older than one sensor pass. It reads the last `arena.cockpit` keyframe the arena sent this pilot (the world keeps one row per pilot on the ArenaRegistry, dropped with the match) and re-emits it on the same feed, so the ANSI renderer, the TUI and the web draw one structure. The contact is the one the pilot named, resolved against that frame's own rows by its short designator, else the platform's lock; a name the platform does not hold takes the one byte-identical \"No such contact.\", and no lock with no name takes its own line. Contextual on a focused station of a deployed unit, refused elsewhere in one line by the tacsim module's CockpitGate. No document, no world mutation, no intent: it is a read of a mirror the arena wrote. The category is `authoritative` with the rest of the cockpit rather than `read-only`, because the fourteen verbs are one subsystem on one lane and BOARD and EXIT, which carry the writes, cannot be anything else."

