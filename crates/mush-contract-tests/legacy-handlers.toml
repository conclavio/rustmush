note = "S1 (14-spatial-implementation-plan 3.1): @atlas/pack list|show|plan|apply|retire, staff (SIM_ADMIN or Royalty). Applying a content pack writes bounded whole-document atlas records at deterministic keys (mod:atlas:<kind>:<pack>:<entry>, roomgeo:<obj>, tile:<pack>:<entry>) through strict deny_unknown_fields wires re-validated at boot, and the content latch (mod:content:applied:<pack>) through mush-content's API. None of it takes part in authority or prepared mechanics: a room's geometry decides what a map draws, never what an action may do. The declared family is where S4's windows move the tiles when they come under the K3 bundle limits. S2 adds @atlas/journey list|show|send|hold|release|abort (staff): reads over the journey book, and the same journey document the +travel stanza describes (family atlas.journey) for send, hold, release and abort. S2b adds @atlas/theme <place>=<field>:<value>, /show and /exemplar (staff): the theme rides the place's own record document (region, locality, neighborhood or site) or the world theme document mod:atlas:theme:world, replacing mush-worldgen's retired @theme and the worldgen.theme zone attribute (doc 14 D-14-28). S3 adds @atlas/propose (a brief or a shelf pack handed to the worldgen planner through a function it registers at boot; the proposal record is worldgen's, see +build), @atlas/cap and @atlas/strike (staff: a character's standing document mod:atlas:standing:<char> -- the cap on outstanding site requests and the strikes; a strike retires the site's pack through mush-content and records atlas.site.struck and atlas.site.retired) and @atlas/standing (a read). The BUILD review queue's build.review payload handler and its deny observer rewrite the request record and the site's review state; none of it is authority or a prepared mechanic. S5 adds /los (a read: the line of sight, the direct trace and the hearing between two people on one window, from the engine physics)."

