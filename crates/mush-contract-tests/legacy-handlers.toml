[[handler]]
name = "@salvage"
category = "authoritative"
note = "E7 residue pass 2 (P2, 10b 15.1 item 4; doc 10 T3/10): recovering a lot stranded in a lost or captured carrier, by its OWN custodian rather than by staff. One CommandSpec, ceiling class Authoritative: @salvage/recover stages exactly one Ctx::submit_authoritative of mush-inventory's own inv_salvage action, whose prepare_authoritative calls InventoryFamilies::relocate -- Lot::checked_relocate's FIRST caller in the workspace -- under mush_inventory::salvage_holder(ObjId), which is mush_industry::wo_holder's shape (its third consumer); /status reads. It writes NO document of its own: the lot and the two lot_census counters are cut 2's authoritative typed families, and the inventory.salvage.recovered applied marker is written inside the same bundle (the THIRD AppliedMarker kind, answered by the existing InventoryFactProvider arm -- a kind, never a sixth namespace). A recovered lot is the SAME lot: id, commodity, quantity, grade, lineage and depth are carried unchanged and only endpoint and revision move, so nothing is minted, split or merged and mint_origin is called nowhere on the path. It is NOT an InventoryVerb -- the five stay five, and the absence of a player-reachable relocate verb is what stops a seller walking a listed lot out from under the market. Authority is E3's own and is rebuilt nowhere: the offer projects only over endpoints mush_economy::may_take_from_vault answers true for on a recoverable wreck, so a CAPTOR reads the same 'There is no such wreck.' a stranger reads, byte for byte and identically before and after the capture -- capture changes custody or possession, NEVER title (doc 10 T3's closed list), and the salvage CLAIM contract with its contest window and named adjudicator is explicitly out of scope. Whether a root is a wreck is mush-sim's fact, so the SalvageSource trait is declared in mush-inventory and implemented in mush-server (mush_server::salvage_source), the one crate with edges to both: no mush-inventory -> mush-sim edge appears, and an unwired composition registers no action at all. Non-baseline, so PINNED_BASELINE stays 157."

