# The typed-state lens pin (WS03-S7, completed by WS03-S13). Read by
# crates/mush-contract-tests/tests/typed_state_lens.rs.
#
# `mush_core::TypedStateLens` is how a call says how far it can see into
# engine-owned typed state: `Live(store)`, or `Detached(reason)` naming why
# there is none. Before WS03-S7 that choice was an `Option<&ActionStateStore>`
# threaded behind PAIRS of names -- `can_perceive` passing `None` beside
# `can_perceive_with_action_state` passing the store, and the same shape around
# `is_concealed`, `perceives_via`, `check_move_attempt`, `check_carry_attempt`,
# `look_rendered_lines`, `room_view`, `traverse_exit`, `go_home`, `room_ambient`,
# `emit_world_event`, `apply_async_completion`, `apply_store_read_completion`,
# `fire_conn_hook`, `fire_scene_hook`, `dispatch`, `resolve_behavior_command`
# and `show_room`. The store-less spelling was the shorter name, so "no typed
# state" was the accidental default, and a hook that reads a typed family
# answered the WRONG perception verdict rather than a degraded one.
#
# Every one of those pairs is one name now, and no `_with_action_state` twin is
# left anywhere in the workspace. This file pins what remains: every place under
# `crates/*/src` that still asserts detachment, with a count and a reason.
# `crates/*/tests` is out of scope -- separate crates, same convention as the
# panic budget and the restriction lints.
#
# To add a row you must be able to write the reason. To raise a count you must
# be able to write why that file needs another one.

[[detached]]
