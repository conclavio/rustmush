# The typed-state lens pin (WS03-S7). Read by
# crates/mush-contract-tests/tests/typed_state_lens.rs.
#
# `mush_core::TypedStateLens` is how a call says how far it can see into
# engine-owned typed state: `Live(store)`, or `Detached(reason)` naming why
# there is none. Before WS03-S7 that choice was an `Option<&ActionStateStore>`
# threaded behind PAIRS of public names -- `can_perceive` passing `None` beside
# `can_perceive_with_action_state` passing the store, and the same shape for
# `is_concealed`, `perceives_via`, `check_move_attempt`, `check_carry_attempt`,
# `look_rendered_lines`, `room_view`, `traverse_exit` and `go_home`. The
# store-less spelling was the shorter name, so "no typed state" was the
# accidental default, and a hook that reads a typed family answered the WRONG
# perception verdict rather than a degraded one.
#
# Those pairs are one name each now. This file pins what is left: every place
# under `crates/*/src` that still asserts detachment, with a count and a reason.
# `crates/*/tests` is out of scope -- separate crates, same convention as the
# panic budget and the restriction lints.
#
# To add a row you must be able to write the reason. To raise a count you must
# be able to write why that file needs another one. WS03-S13 lowers most of
# these to zero by collapsing the remaining twins; a row whose count reaches
# zero is deleted with the twin.

[[detached]]
file = "crates/mush-core/src/action_state.rs"
count = 1
reason = """
`ModuleActionState::unavailable()`, the public constructor a hand-built
compatibility `Ctx` uses when it has no engine behind it. It is the declared
store-less reader and it says CompatibilityCtx.
"""

