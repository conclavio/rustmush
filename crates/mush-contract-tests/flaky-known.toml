# The known flaky tests (doc 51 unit FL.2, ruling Q-51-5).
#
# A test is retried once by nextest only while it has a row here. There is no
# blanket retry and no hand-kept filter: the retry override in
# .config/nextest.toml is generated from this file, and
# tests/ci_policy/flaky_known.rs fails when the two differ, when a row is past
# its `expires` date, or when a row names a test the tree no longer holds.
#
# A row:
#
#   binary   nextest's binary id: <package>::<target>, or the bare package for
#            its lib tests
#   test     the one test, by its full name in that binary
#   class    doc 51's class: figure, dice, clock, clock-phase, stream, process,
#            event, or unknown (the cause is not found yet)
#   row      the row of docs/flaky-tests.md that explains it
#   listed   the day the row was written
#   expires  the last day it holds: fourteen days on. Past it the gate is red.
#            The test is fixed and the row deleted, or the date is moved, at
#            most fourteen days ahead, in a diff the owner sees. A row is
#            renewed on evidence only: a soak failure, or a cause written down.
#   note     anything else a reader should know
#
# A row with class "unclassed" was carried over from the hand-kept
# `load-sensitive` retry of cut T.1 with no failure on record (doc 51 §4.3
# point 5). It says so in `carried`, has no `row`, and is the one kind that
# may cover a whole module (`module`) or a whole binary (`whole_binary =
# true`). It must earn a class and a row of the record to be renewed.
#
# After any edit:
#   FLAKY_KNOWN_BLESS=1 cargo test -p mush-contract-tests --test ci_policy flaky_known::
# rewrites the block in .config/nextest.toml, and
#   python3 scripts/flake_report.py --ci-days 14 --write
# refreshes docs/flaky-observed.md (ruling Q-51-8: in the pull request that
# adds or closes a row).

# --- The list is empty (doc 51 unit FL.10, 2026-11-26) -----------------------
#
# FL.10 closed the last eight rows on the soak's record: row 12's
# `a_drains_while_b_serves…` (its burst check run where the kernel migrates a
# closing listener's queue), the carried `arena_story_split` module, and the
# carried mush-worldgen binaries and mush-sim `e7c6_b2` tests. None was
# renewed. Doc 51's cut note for FL.10 has each one's count.
#
# A new row is a test that failed, then passed at one head, with its class and
# the row of docs/flaky-tests.md that says why. It lives fourteen days while
# the fix lands in the shared helper (doc 43 §2.3 rules 16 to 21), never
# behind a longer timeout.
