# 16c `T-45` (16b cut D.5): the command-shaped tokens in `docs/help/*.md` that
# are deliberately not verbs the world registry answers.
#
# `tests/help_commands.rs` takes the first word of every inline-code span and of
# every line inside a fenced block, keeps it when it starts with `@` or `+` or is
# written in capitals with at least three letters, and demands that each one
# resolve against the production registry. A row here says "this one is not a
# world verb", with the reason. A row no help page writes any more fails the
# test, so this file cannot rot into a list of things that used to be wrong.
#
# Two kinds of row live here, and nothing else should:
#
# 1. **Prose in capitals** — a power, a flag, a queue, a panel word. The help
#    writes them in code spans because they are typed somewhere, just not at the
#    command line.
# 2. **Client-side verbs** — lines the SSH front end or the gateway intercepts
#    before the world ever sees them. They are real things a player types, and
#    they are registered in no `Registry`, so the test cannot check them. Each
#    row names where it is handled, so the next reader can find it.

# ---- prose in capitals -------------------------------------------------------

