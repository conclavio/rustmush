[package]
name = "mush-atlas"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "mush-atlas (S1, doc 14 §2–3): the spatial records — regions, neighborhoods, sites, structures, rooms with geometry, portals, connections, tiles and features — the rasterizer that makes coarse geometry from a pack, the +atlas text views, and @atlas/pack; plus the starter area shipped as content"

# 14-spatial-implementation-plan §3.1: `mush-atlas -> {core, content, proto}` plus the serde
# vocabulary. No sim, tactics, npc, housing or worldgen edge: places know nothing about the
# people or the fights in them. `cargo tree -p mush-atlas` is the test.
#
# S3 (§3.4) adds two edges for hydration (doc 14 §4.5): `mush-jobs`, for the BUILD review
# queue and its `build.review` payload handler, and `mush-canon`, for the
# `atlas.site.*` events. Neither runs back: jobs reads core, economy and proto; canon
# reads core and proto.
[dependencies]
mush-core.workspace = true
mush-content.workspace = true
mush-proto.workspace = true
mush-jobs.workspace = true
mush-canon.workspace = true
# S4: windows open on the simulation's domains and place through its transitions;
# `mush-sim` reads core, economy, scenes and proto, never the atlas.
mush-sim.workspace = true
# S4: a timestop opens a window over its room through the scenes module's hooks,
# and `+map/open` reads the facilitator's scene; scenes reads core, canon and proto.
mush-scenes.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Dev-only. `mush-npc` is here so the starter-area acceptance suite can compose the cast's
# applier beside this crate's and assert the lot boots whole; it is not a production edge.
[dev-dependencies]
# S5: propagation over the lot is asserted against the metric and the line of sight.
mush-propagation.workspace = true
# The text renderer, so the golden map frames (P10) are asserted as the lines line mode prints.
mush-ansi.workspace = true
mush-testkit.workspace = true
mush-npc.workspace = true

[lints]
workspace = true
