[package]
name = "mush-weather"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Zone weather state machines, climate data, ambience"

[dependencies]
mush-core.workspace = true
# S2b: weather cells key on atlas places (doc 14 D-14-28); acyclic, the atlas
# depends on {core, content, proto} only.
mush-atlas.workspace = true
mush-proto.workspace = true
# M10 LLM flavor top-up: the off-loop generator calls LlmService (metered,
# audited, gated). mush-llm → mush-core only; no cycle.
mush-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# S2b tests apply a small content pack so rooms have a neighborhood on the map.
mush-content.workspace = true
mush-testkit.workspace = true
mush-store.workspace = true
futures.workspace = true
# The flavor async-defer tests await run_weather_async against a MockProvider.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
