[package]
name = "mush-sshdoorway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Doc 29: sshdoorway, the port-22 SSH front door that routes players to rustmush instances by username"

[[bin]]
name = "sshdoorway"
path = "src/main.rs"

# Deliberately small (doc 29 §9.5): russh both ways, tokio, the preamble, config
# and logging. No game crate and no mush-net-ssh (which carries the rendering
# stack) — the doorway knows SSH and the preamble, nothing about the game.
[dependencies]
mush-sshdoorway-proto.workspace = true
russh.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
socket2.workspace = true
getrandom.workspace = true

[dev-dependencies]
# The end-to-end tests run a real instance-side trusted ingress in process.
mush-net-ssh.workspace = true
mush-proto.workspace = true

[lints]
workspace = true
