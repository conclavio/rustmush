[package]
name = "mush-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "rustmush forked GATEWAY half (M16b): owns the connection listeners (SSH/web), the session manager, accounts/ipguard, and SUPERVISES the mush-server child. Speaks the mush-ipc boundary protocol over a socket. Holds NO world/store-object/module code."

# M16b: the gateway half of the fork. It owns the network ingress + session
# layer + account auth, and spawns/supervises the server child. It depends on
# neither the game modules/rulesets/llm nor `mush-server`.
[[bin]]
name = "mush-gateway"
path = "src/main.rs"

[features]
# Native HTTPS for the web ingress the gateway now serves (M16d). Forwards to
# mush-net-web's own tls feature (axum-server + rustls/ring — no C toolchain).
# Off by default (prod usually terminates TLS at a reverse proxy); enable it for
# a proxyless split deploy that serves [web] over TLS from a cert/key on disk:
#   cargo build --release -p mush-gateway --features tls
tls = ["mush-net-web/tls"]

[dependencies]
mush-config.workspace = true
mush-core.workspace = true
mush-proto.workspace = true
mush-ipc.workspace = true
mush-ansi.workspace = true
mush-session.workspace = true
mush-net-ssh.workspace = true
mush-net-web.workspace = true
# D1: the Discord transport; the bridge here implements its hooks.
mush-net-discord.workspace = true
# Public-key auth (M19): parse offered/stored OpenSSH public keys and compare
# by key material for `verify_pubkey`. russh re-exports the `ssh-key` types.
russh.workspace = true
# The gateway's own Redis KV handle for account:*/token:*/ban:* (auth, tokens,
# sitebans). It does NOT pull the world/object store schema, modules, or llm.
mush-store.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
argon2.workspace = true
rand.workspace = true
dashmap.workspace = true
smol_str.workspace = true
thiserror.workspace = true

[dev-dependencies]
mush-contract-tests.workspace = true
# WS01-S11D: the split-process kill proofs (tests/authoritative_process_kill.rs)
# re-exec this test binary as the server worker and stop it at exact durability
# cuts, so this is the one edge in the tree that turns the crash-injection hooks
# on. It is a `[dev-dependencies]` edge on purpose: the gateway's own binary
# never links `mush-server` at all, and no release build of any crate here
# activates the feature.
mush-server = { workspace = true, features = ["fault-injection"] }
# 16b cut T.3: the gateway twin of the custody lens (tests/arena_custody.rs) is
# the one place a SPLIT server's arena has to be made to panic on demand, and the
# `@arena/fault` switch that does it is behind tacsim's own off-by-default
# feature. A `[dev-dependencies]` edge exactly like the one above: the gateway
# binary never links tacsim at all, and no release build of anything here turns
# the seam on.
tacsim = { workspace = true, features = ["fault-injection"] }
mush-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
reqwest.workspace = true
tokio-tungstenite.workspace = true
axum.workspace = true
fred.workspace = true

[lints]
workspace = true
