[package]
name = "mush-housing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "mush-housing (E5a+E5b): the game-neutral housing library — properties, tenancies, the tenancy state machine that never ends a home on its own, the multi-resident support assessment, the fail-closed access predicate and the Obj.home invariant helpers — plus the HousingModule that attaches them to a world: persistence and boot, the movement/carry hooks, the destroy gate, the cadence-driven assessment tick, the exact-mode bridge to E4 contracts and obligations, the story window, and the @property/@tenancy/+home/+guest surface."

[features]
# WS01-S11D: the write path's recomputation-equivalence assertion
# (`assert_projections`, D-LBK-4a). It used to ride `cfg(debug_assertions)`,
# which stops being a production fence the moment `[profile.release]` sets
# `debug-assertions = true` — and then a projection drift is a `debug_assert!`
# panic inside the single-writer world task, on top of a full projection
# rebuild per housing write. Off by default; `mush-server`'s test build turns it
# on. The public checker `HousingStore::projections_consistent` is unaffected,
# and it is what `tests/e5b.rs` asserts with directly.
debug-checks = []

[dependencies]
mush-core.workspace = true
# S2b: a property may point at the atlas site it stands on (doc 14 D-14-28); acyclic.
mush-atlas.workspace = true
mush-org.workspace = true
mush-economy.workspace = true
# E5b: the story window opens a job in the `wod-story` queue and closes it again
# when a tenancy recovers. E5a deliberately had no jobs edge (a story job was a bare
# `u64`); the module half is where that id has to become a real ticket.
mush-jobs.workspace = true
mush-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
thiserror.workspace = true
tracing.workspace = true


[dev-dependencies]
# S2b tests apply a small content pack so rooms have a neighborhood on the map.
mush-content.workspace = true
mush-testkit.workspace = true

[lints]
workspace = true
