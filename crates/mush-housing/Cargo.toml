[package]
name = "mush-housing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "mush-housing (E5a+E5b): the game-neutral housing library — properties, tenancies, the tenancy state machine that never ends a home on its own, the multi-resident support assessment, the fail-closed access predicate and the Obj.home invariant helpers — plus the HousingModule that attaches them to a world: persistence and boot, the movement/carry hooks, the destroy gate, the cadence-driven assessment tick, the exact-mode bridge to E4 contracts and obligations, the story window, and the @property/@tenancy/+home/+guest surface."

[dependencies]
mush-core.workspace = true
mush-org.workspace = true
mush-economy.workspace = true
# E5b: the story window opens a job in the `wod-story` queue and closes it again
# when a tenancy recovers. E5a deliberately had no jobs edge (a story job was a bare
# `u64`); the module half is where that id has to become a real ticket.
mush-jobs.workspace = true
mush-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
thiserror.workspace = true
tracing.workspace = true


[dev-dependencies]
mush-testkit.workspace = true

[lints]
workspace = true
