[package]
name = "mush-pixel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The graphics engine (doc 21): one Frame drawn from the per-observer feeds by a Picture (heightfield and raycast cockpit, overhead, orbital chart, armour doll, match replay), rendered locally in wasm or encoded as palette PNG (kitty / web socket) or DEC sixel"

[dependencies]
# PNG's IDAT is a zlib stream; the workspace already carries flate2 (pure-Rust
# zlib-rs) for the gateway, so no new dependency and no C toolchain.
flate2 = { workspace = true, optional = true }
# The `cockpit` module reads the `arena.cockpit` keyframe (JSON) into the
# instruments' inputs, for the SSH TUI's view and the fixture example alike.
serde_json.workspace = true
# Doc 21 cut G.3b: every sine, cosine, exponential, logarithm and hypotenuse
# goes through `math` and so through libm, the same on every target.
libm.workspace = true
# Doc 31 cut UD.1 (D-31-2): a model's file is named by its SHA-256, which the
# reducer computes and the catalogue test checks — native builds only.
sha2 = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# The terminal and socket encoders — PNG (and so flate2), kitty, sixel — and
# the terminal probe. On by default; the browser's wasm build (doc 21 cut G.3b,
# `mush-pixel-wasm`) draws into a canvas and leaves them out.
default = ["encode"]
encode = ["dep:flate2", "dep:sha2"]

[[example]]
name = "fixture"
required-features = ["encode"]

# Doc 22 cut U.6: the reducer (`scripts/unit-bake/bake.sh` runs it) reads the
# bake's PNG renders, so it needs the PNG codec.
[[example]]
name = "unit_reduce"
required-features = ["encode"]

[[example]]
name = "unit_lineup"
required-features = ["encode"]

