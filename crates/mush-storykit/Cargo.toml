[package]
name = "mush-storykit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dev-only helpers the story suites share: one wait loop, one step limit, one story budget (doc 51)"
publish = false

# Doc 51 §3.8 (Q-51-1): a DEV-DEPENDENCY ONLY. No crate may name this one under
# `[dependencies]` or `[build-dependencies]`; the panic budget's
# `no_production_crate_links_an_excluded_crate` refuses that edge
# (crates/mush-contract-tests/tests/ci_policy/panic_budget.rs).
#
# It depends on what its helpers need and no more. Doc 51's later units add
# tacsim (the content packs, for `Figures`) and russh (`Term`) with the helper
# that needs each.

[dependencies]
tokio.workspace = true

[dev-dependencies]
# The kit's own tests drive tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
