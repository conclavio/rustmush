[package]
name = "mush-storykit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dev-only helpers the story suites share: one wait loop, one step limit, one story budget, game figures read from the content, and barriers (doc 51)"
publish = false

# Doc 51 §3.8 (Q-51-1): a DEV-DEPENDENCY ONLY. No crate may name this one under
# `[dependencies]` or `[build-dependencies]`; the panic budget's
# `no_production_crate_links_an_excluded_crate` refuses that edge
# (crates/mush-contract-tests/tests/ci_policy/panic_budget.rs).
#
# It depends on what its helpers need and no more. Unit FL.3 added tacsim (the
# content packs and the arena's draws, for `Figures`) and mush-core (the ids
# the catalog is keyed by). Unit FL.7 added russh, for `Term`'s SSH client.

[dependencies]
mush-core.workspace = true
russh.workspace = true
tacsim.workspace = true
tokio.workspace = true

[dev-dependencies]
# The kit's own tests drive tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }
# `Figures`' own test signs a pack of its own, as a rig with a test unit does.
mush-content.workspace = true
serde_json.workspace = true

[lints]
workspace = true
