[package]
name = "mush-worldgen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LLM worldbuilding: themes, @gen draft/review pipeline"

[dependencies]
mush-core.workspace = true
# S2b: themes live on the atlas (doc 14 D-14-28); worldgen reads them there.
mush-atlas.workspace = true
# S3: the building agent proposes content packs and applies them through the content module.
mush-content.workspace = true
mush-llm.workspace = true
mush-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
# S3: the planner tests file BUILD tickets, read canon, and compose the NPC module's
# appliers so a proposed pack may carry people.
mush-jobs.workspace = true
mush-canon.workspace = true
mush-npc.workspace = true
# The in-process engine driver: boot the worldgen module, dispatch commands,
# drive the Effects/Inbound re-entry path directly.
mush-testkit.workspace = true
# The async defer-path tests await run_worldgen_async against a MockProvider.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = { workspace = true }

[lints]
workspace = true
