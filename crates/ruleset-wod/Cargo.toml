# E5c (08d §5) — the WoD economic layer. `ruleset-wod → {housing, economy, org,
# jobs, faction, canon}` (08d §2): housing for the SupportPlan seam, the economy for
# instruments/accounts/faucet obligations/cadences, org for PrincipalId, faction for
# FactionId/FrontId (front attribution only), canon for the ruleset's own evidence
# events. None of those five depends on any ruleset crate, so there is no cycle.
