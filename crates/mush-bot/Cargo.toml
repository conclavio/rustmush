[package]
name = "mush-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone SSH player agent and black-box scenario runner for RustMUSH"

[dependencies]
# Independent external agent: no RustMUSH runtime or build dependencies.
# In particular, do not reuse the NPC planner or mush-llm service/provider layer.
russh.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
# The bot keeps provider costs and trace payloads as exact decimal text (eighteen
# decimals, thirty-digit integers), which needs serde_json's arbitrary precision.
# Cargo unifies features per invocation, so this feature must never be built into
# the engine's test binaries: under it, untagged and flattened number decoding
# fails and the worldgen proposal path reads that as a server restart. That is why
# the workspace test run is `cargo test --workspace --exclude mush-bot` and this
# crate's tests run as `cargo test -p mush-bot` on their own (see .github/workflows/ci.yml).
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2.workspace = true
toml.workspace = true
dotenvy.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = "0.28.1"

[dev-dependencies]
# Independent decoding of bounded retained proving-start evidence in server tests.
flate2.workspace = true
# Server-under-test fixtures only. These do not participate in bot decisions
# and are not linked into the standalone executable.
wiremock.workspace = true
async-trait.workspace = true
mushd.workspace = true
mush-core.workspace = true
mush-store.workspace = true
mush-session.workspace = true
mush-net-ssh.workspace = true
mush-proto.workspace = true
mush-ansi.workspace = true
# Supplies mock SERVER @gen responses; the bot model is a separate HTTP stub.
mush-llm.workspace = true
# Cut AJ.1: server-under-test fixture and the line-format contract; never in the
# runtime graph. `tacsim` is the simulator the arena rig boots and the crate
# whose own cockpit formatters `tests/arena_contract.rs` feeds through the
# bot's parser (and, since the game's 17b cut M5.3, whose board clauses
# `tests/arena_lane.rs`' fake server prints, so the lane serves the game's
# own row); `mush-sim` and `mush-server` wire the account oracle the
# simulator's slots are keyed on, as `crates/mushd/tests/sim_solo.rs` does.
tacsim.workspace = true
mush-sim.workspace = true
mush-server.workspace = true

[lints]
workspace = true
