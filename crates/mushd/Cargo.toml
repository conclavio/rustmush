[package]
name = "mushd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "rustmush server binary: config, accounts, world task, SSH bridge, main loop"

# M1: the real async server. A lib target carries the wiring (config,
# accounts, IP guard, world task, SSH bridge) so integration tests can drive
# it; main.rs is a thin front door that also preserves the M0 stdin REPL
# behind --repl.

[features]
# Native HTTPS for the web ingress (axum-server + rustls/ring, no C toolchain).
# Off by default (prod usually terminates TLS at a reverse proxy); enable for a
# proxyless deploy that serves [web] over TLS from a cert/key on disk:
#   cargo build --release -p mushd --features tls
tls = ["mush-net-web/tls"]

[dependencies]
# M16b: mushd is the ALL-IN-ONE launcher — it depends on BOTH forked halves and
# the shared config, and provides the in-process glue that runs them in one
# process over a shared SessionManager.
mush-gateway.workspace = true
mush-server.workspace = true
mush-config.workspace = true
mush-core.workspace = true
mush-proto.workspace = true
# M16a: the gateway<->server boundary protocol. This stage only borrows
# SendTarget (moved here from world_task); the runtime protocol refactor is M16a
# task 2.
mush-ipc.workspace = true
mush-session.workspace = true
mush-store.workspace = true
# The M3 proving modules, wired at boot (modules.rs).
mush-comsys.workspace = true
mush-mail.workspace = true
mush-jobs.workspace = true
# The M5 scripting + weather modules.
mush-script.workspace = true
mush-weather.workspace = true
# The M6 rulesets: config's [rulesets] selects which load (modules.rs).
ruleset-wod.workspace = true
# The M10b second ruleset (SR5): proves the plugin API scales past oWoD.
ruleset-shadowrun.workspace = true
# The M7 LLM layer + worldgen module: LlmService built from [llm] config,
# WorldgenModule registered at boot, and run_worldgen_async driven off the
# world loop from the Effect::ModuleAsync re-entry seam (world_task.rs).
mush-llm.workspace = true
mush-worldgen.workspace = true
# The M8 NPC agent module: NpcModule registered at boot, run_npc_turn_async
# driven off the world loop from the Effect::ModuleAsync seam (world_task.rs),
# with a WoD grounding/ability adapter when the "wod" ruleset is enabled.
mush-npc.workspace = true
mush-ruleset.workspace = true
mush-testkit.workspace = true
mush-net-ssh.workspace = true
# The M4 web ingress; mushd implements its WebHooks (web_bridge.rs).
mush-net-web.workspace = true
# BoxFuture, to implement mush-net-ssh's dyn-compatible hooks trait.
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Loads C:/.../.env at boot so LLM keys resolve in dev; prod uses real env vars.
dotenvy.workspace = true
argon2.workspace = true
rand.workspace = true
# Web session tokens: stored server-side as SHA-256 hashes (web_bridge).
sha2.workspace = true
dashmap.workspace = true
smol_str.workspace = true
thiserror.workspace = true

[dev-dependencies]
# WS01-S7: `tests/world_fault.rs` runs the real `mushd` binary with ONE world
# turn armed to panic, so it can prove the process exits non-zero and skips the
# shutdown BGSAVE. Arming lives behind `mush-server`'s `fault-injection`
# feature, and this `[dev-dependencies]` edge is the only thing that turns it on
# for `cargo test -p mushd` — the normal dependency above stays featureless, so
# no release build of `mushd` carries the seam.
mush-server = { workspace = true, features = ["fault-injection"] }
# start_paused tests (virtual clock) need tokio's test-util.
tokio = { workspace = true, features = ["test-util"] }
# Real SSH client for the full-stack loopback and e2e tests.
russh.workspace = true
# The wod e2e + gated sheet-reboot twin decode/validate SheetDocs.
mush-ruleset.workspace = true
# Tests inject connection-shaped (transient) store errors and drive raw
# Redis commands (DEBUG RELOAD) in the gated durability e2e.
fred.workspace = true
# The SR5 e2e replays the ruleset's seeded ChaCha8 dice stream to pick a seed
# that forces a deterministic glitch on the first roll (rand itself is already a
# runtime dep).
rand_chacha.workspace = true
# The M4 web e2e (tests/web_e2e.rs) drives the real HTTP/WS surface:
# axum serves mush-net-web's router on an ephemeral port exactly the way
# serve_with_shutdown does, reqwest is the REST client, tokio-tungstenite
# the WebSocket client.
axum.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
# H4 (E2-D30): the inventory pool round trip seeds K state families through the
# module's own handles before booting from the store alone.
mush-inventory.workspace = true
# ...and names its endpoints by the economy's `VaultId`.
mush-economy.workspace = true

[lints]
workspace = true
