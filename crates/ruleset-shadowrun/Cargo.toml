[package]
name = "ruleset-shadowrun"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shadowrun 5th Edition (SR5) ruleset — SheetSchema, data tables, and Ruleset skeleton (M10b)"

[dependencies]
mush-ruleset.workspace = true
mush-dice.workspace = true
mush-core.workspace = true
mush-jobs.workspace = true
mush-proto.workspace = true
# E6a (08f §2): the run-and-pay layer. `economy` for the contract/obligation seams,
# `org` for principals and scopes, `party` for the ephemeral crew (which learns
# nothing about money), `faction` for board membership (M5).
mush-economy.workspace = true
mush-org.workspace = true
mush-party.workspace = true
mush-faction.workspace = true
# E6c (08f §2, §5): the neutral market. The ruleset registers content, dice and
# delivery into its three wiring-frozen tables; `mush-market` gains no ruleset edge
# in return, and nothing Shadowrun-shaped is inside it.
mush-market.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tracing.workspace = true

[dev-dependencies]
mush-testkit.workspace = true
mush-store.workspace = true
# E6b: the acceptance rig drives the real three-crate seal loop (scenes -> canon ->
# economy), so the test target links both. The library itself gains **no** edge to
# either: `ruleset-shadowrun -> {economy, org, party, faction}` is unchanged, and
# nothing in `src/` commits canon (08f §4.6).
mush-canon.workspace = true
mush-scenes.workspace = true
tokio.workspace = true

[lints]
workspace = true
