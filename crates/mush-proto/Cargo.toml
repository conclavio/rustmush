[package]
name = "mush-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Wire types: OutputEvent, ClientCommand, RichText, envelope (serde only)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript binding generation for the web client. Not a default feature:
# `cargo test -p mush-proto --features ts` (alias: `cargo gen-ts`) regenerates
# web/src/lib/proto/, which is committed so web builds never need cargo.
ts = ["dep:ts-rs"]

[dev-dependencies]
# Fuzz-style property tests for Envelope/ClientCommand JSON decode.
proptest = { workspace = true }

[lints]
workspace = true
