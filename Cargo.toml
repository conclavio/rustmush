[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Nicholas York"]

# Version pins verified Aug 2026 at design time; each crate re-verifies when its
# milestone lands (entries here are inert until a member references them).
[workspace.dependencies]
# core plumbing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bitflags = { version = "2", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Daily-rotating, non-blocking file log appender (M9 observability). Pairs with
# tracing-subscriber; pure Rust, no C toolchain.
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
# T-106: bounded reusable workers for scoped, immutable pilot-frame reads.
rayon = "1.12"
# dice / rng
rand = "0.9"
rand_chacha = "0.9"
winnow = "0.7"
# store (M2) — verified Aug 2026: fred 10.1.x current on docs.rs; RESP3 +
# RedisJSON (i-redis-json) + RediSearch (i-redisearch) interfaces; serde-json
# enables Value <-> serde_json::Value conversion. Defaults (i-std,
# transactions) stay on.
fred = { version = "10.1", features = ["i-config", "i-redis-json", "i-redisearch", "i-scripts", "serde-json"] }
# net (M1/M4)
# default features pull aws-lc-sys (CMake/NASM C build); ring keeps the
# workspace's no-C-toolchain-babysitting rule intact on Windows + Linux.
russh = { version = "0.63", default-features = false, features = ["flate2", "ring"] }
# Doc 21 cut G.11: the read-only `sftp` subsystem that serves the asset pack
# over the player's own connection (protocol v3; w11term's client is on 3.0).
russh-sftp = "3.0.1"
# OpenSSH public-key parsing/normalization/fingerprinting for the server-side
# `@sshkey` command (M19). Same crate (and pinned to the same version) russh
# re-exports as `russh::keys::ssh_key`, so feature unification keeps one copy;
# mush-server pulls it directly to validate keys without depending on the net
# stack. Pure Rust, no C toolchain.
ssh-key = "0.7.0-rc.11"
# TUI (M15) — server-side ratatui over SSH. default-features=false drops the
# bundled crossterm backend (no local tty here; mush-net-ssh ships a clean-room
# SshBackend that writes VT100 into a Vec<u8>). Verified Aug 2026: 0.29.0 is the
# current 0.29 line; the Backend trait is read from the registry source to
# implement it exactly.
ratatui = { version = "0.29", default-features = false }
getrandom = "0.4"
# web session tokens are stored as SHA-256 hashes (design 02 §6.2); 0.11.0
# already in-tree transitively.
sha2 = "0.11"
flate2 = "1"
# Doc 21 cut G.3b: the picture's trigonometry in pure Rust, so a frame is the
# same bytes on Windows, Linux and in the browser's wasm (each platform's own
# libm differs in the last place, which moves pixels).
libm = "0.2"
hmac = "0.13"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
# default features pull tonic (grpc) — axum only for us
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"] }
rust-embed = "8"
# native TLS path for mush-net-web's optional `tls` feature (M4) — verified
# Aug 2026: axum-server 0.8.0 current. tls-rustls-no-provider + rustls/ring
# keeps the no-C-toolchain rule (default tls-rustls pulls aws-lc-sys).
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# dev-only X.509 generator for the `tls` feature's serve proof (WS24-S4). A
# committed PEM would turn CI red at the certificate's own notAfter with no code
# change, so the proof mints a throwaway self-signed pair per run. rcgen's
# default features are `crypto, pem, ring` — ring, not aws-lc-sys, so this keeps
# the no-C-toolchain rule the axum-server/rustls lines above are written to.
rcgen = "0.14"
# dev-only WS client for mush-net-web integration tests (verified Aug 2026:
# 0.30.0 current; plain ws://, no TLS features needed)
tokio-tungstenite = "0.30"
argon2 = "0.5"
dashmap = "6"
# scripting (M5). 17b cut M2.1 (doc 17 §7, D-UM-24): pinned EXACTLY, because a unit
# mind's operation count — and with it where its budget trips — is a function of the
# AST and the engine version, and `mush_mind::RHAI_ABI` records the version every seal
# was compiled against; a rhai upgrade is a reviewed ABI bump. This pins `mush-script`
# too, harmlessly. `crates/mush-mind`'s `the_abi_pin_matches_the_lockfile` reads this
# line and `Cargo.lock`.
rhai = { version = "=1.26.0", features = ["sync", "serde"] }
# llm (M7) — versions re-verified on crates.io 2026-08-28. governor bumped
# 0.8→0.10 (only mush-llm uses the bare `governor` crate; mush-net-web uses the
# separate `tower_governor`). reqwest stays 0.12 (mush-net-web/mushd dev-deps
# still on 0.12; 0.12 covers rustls-tls/json/stream). async-trait for the
# object-safe async provider trait; wiremock is a mush-llm dev-dep only.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
backon = "1"
governor = "0.10"
async-trait = "0.1"
wiremock = "0.6"
# property-based ("fuzz-style") testing — dev-dep only, cross-platform, runs
# under `cargo test`. Hostile-input parser suites (M9 hardening) live behind it.
proptest = "1"
# 16b cut U.2 (16c `T-36`): the scale harness's resident-memory reading on every
# platform — dev-dep only (`crates/tacsim`). It wraps the OS call (`/proc` on
# Linux, `GetProcessMemoryInfo` on Windows) behind a safe API, so no `unsafe`
# enters a tree whose lints deny it. MIT OR Apache-2.0; verified 2026-09-23:
# 1.2.0 current.
memory-stats = "1"
static_assertions = "1"
# .env loading for dev (mushd reads secrets from real env vars in prod; in dev
# it loads C:/.../.env at boot). dotenvy is the actively-maintained successor to
# the unmaintained `dotenv` crate; pure Rust, no C deps. Its safe `dotenv()`
# wraps the (edition-2024-unsafe) `set_var` internally, so mushd never writes an
# `unsafe` block for it — mushd calls it once, single-threaded, before the tokio
# runtime starts.
dotenvy = "0.15"
# schema / codegen
schemars = "1"
# verified Aug 2026: ts-rs 12.0.x current on docs.rs (12 adds programmatic
# Config: out dir + large-int-as-number; 11 made skip_serializing_if fields
# optional in TS). smol_str-impl/serde-json-impl cover SmolStr/serde_json::Value.
ts-rs = { version = "12", features = ["serde-compat", "smol_str-impl", "serde-json-impl"] }
# config
toml = "0.8"
# IPC framing (M16a): self-describing MessagePack for the gateway<->server
# boundary protocol. Chosen over bincode because the boundary carries
# serde_json::Value payloads (Inbound::Query, OutputEvent::Panel) that need a
# self-describing format; rmp-serde is compact and version-tolerant.
rmp-serde = "1"
# workspace-internal
mush-config = { path = "crates/mush-config" }
mush-proto = { path = "crates/mush-proto" }
mush-core = { path = "crates/mush-core" }
mush-ipc = { path = "crates/mush-ipc" }
mush-ansi = { path = "crates/mush-ansi" }
mush-store = { path = "crates/mush-store" }
mush-session = { path = "crates/mush-session" }
mush-net-ssh = { path = "crates/mush-net-ssh" }
# 2026-10-21 pixel cockpit spike: the raycaster, the PNG encoder and the kitty
# graphics framing the SSH TUI streams a first-person view with.
mush-pixel = { path = "crates/mush-pixel" }
mush-net-web = { path = "crates/mush-net-web" }
mush-script = { path = "crates/mush-script" }
# 17b cut M2.1 (doc 17 §7, D-UM-1): the game-neutral Rhai sandbox unit minds think in —
# the engine builder, the op-and-fee budget, canonical memory, the AST cache.
# `mush-mind -> {rhai}` only: no `mush-script` edge (its engine reads a wall clock).
mush-mind = { path = "crates/mush-mind" }
# 17d M6.1: character-owned drafts and immutable executable revisions.
mush-roll = { path = "crates/mush-roll" }
mush-llm = { path = "crates/mush-llm" }
mush-worldgen = { path = "crates/mush-worldgen" }
mush-npc = { path = "crates/mush-npc" }
mush-ruleset = { path = "crates/mush-ruleset" }
mush-dice = { path = "crates/mush-dice" }
mush-jobs = { path = "crates/mush-jobs" }
mush-comsys = { path = "crates/mush-comsys" }
mush-faction = { path = "crates/mush-faction" }
mush-scenes = { path = "crates/mush-scenes" }
mush-sim = { path = "crates/mush-sim" }
mush-canon = { path = "crates/mush-canon" }
# D1 (docs/interface/04 §3.1): explicit-only privileges — the `@privilege` grant family and
# the durable audit ledger of grants, revocations and uses. `mush-privileges -> {core}` only.
mush-privileges = { path = "crates/mush-privileges" }
# D1: the Discord transport (03 Q13 spike, D-D-12). Defaults OFF on every twilight crate so
# gateway compression is zlib (`flate2` → pure-Rust `zlib-rs`) and never `zstd-sys`, TLS is
# rustls through this workspace's `ring` provider by feature unification (never aws-lc-sys),
# and the pins are exact because twilight's 0.x line breaks yearly. Re-verify at each cut.
twilight-http = { version = "=0.17.1", default-features = false, features = ["rustls-native-roots", "decompression"] }
twilight-gateway = { version = "=0.17.1", default-features = false, features = ["rustls-native-roots", "twilight-http", "zlib"] }
twilight-model = "=0.17.1"
twilight-util = { version = "=0.17.0", features = ["builder"] }
mush-net-discord = { path = "crates/mush-net-discord" }
mush-mail = { path = "crates/mush-mail" }
mush-weather = { path = "crates/mush-weather" }
mush-tactics = { path = "crates/mush-tactics" }
# E1: organization identity + scoped authorization (the ownership/permission layer).
mush-org = { path = "crates/mush-org" }
# E2: the accountable-value engine — instruments, accounts, the double-entry journal.
mush-economy = { path = "crates/mush-economy" }
# E5: game-neutral housing — properties, tenancies, support assessment, access.
mush-housing = { path = "crates/mush-housing" }
# E6a: the ephemeral party — a game-neutral roster with a Forming/Locked/Disbanded
# state machine. NOT an economic principal (D-E6-5): it depends on mush-core alone
# and must never gain an economy, org or faction edge.
mush-party = { path = "crates/mush-party" }
# E6c: the neutral market — catalogs, listings, quotes, vendors, NPC market makers
# and the safe aggregate public projection. `mush-market -> {core, org, economy}`
# only, and the economy never depends on it (doc 08 D11, doc 10 §14).
mush-market = { path = "crates/mush-market" }
# E7 cut 2 (10b §3.2): the neutral quantity authority — pools and lots bound to E3
# custody endpoints, on K's `ReservationBook`. `mush-inventory -> {core, economy}`
# only; industry, market, contracts and simulation CONSUME it and none keeps a
# private stock number (Q13A/Q2D, D-E7-3).
mush-inventory = { path = "crates/mush-inventory" }
# E7 cut 3 (10b §3.3): the neutral industry authority — ore deposits, surveys,
# claims and extraction, with facilities, recipes, capacity and production to
# follow in cut 4 (doc 10 §14). `mush-industry -> {core, economy, inventory,
# proto}` only: no sim, market, faction, org, tacsim or party edge, and no ore
# family, band table, route or corridor fact — the *ruleset* authors the data
# through cut 1's packs and the crate owns the state machine.
mush-industry = { path = "crates/mush-industry" }
# E7 cut 7 (10b §3.7): one physical propagation context and two resolvers —
# detection (what was seen) and delivery (what arrived) — plus the false-contact
# phantoms, the delivery envelopes and the observation policy `mush-tactics`'
# sensor ingress reads. `mush-propagation -> {core, sim}` only; it registers NO
# contact family and NO contact guard validator, because `mush-tactics` is the
# sole `ContactState` authority (08i answer 1, D-E7-36).
mush-propagation = { path = "crates/mush-propagation" }
# E7 cut 9 (10b §3.9): declared operations, formations, the funded bond and
# idempotent terminal resolution. `mush-campaign -> {core, economy, canon, org}`
# only — deliberately NO faction edge (the front consequence is discharged by the
# ONE root canon record through `mush-faction`'s existing `on_canon_recorded`),
# no sim, tactics, propagation or ruleset edge. It registers exactly one
# `FactProvider` namespace, `campaign.*` (D-E7-30's fifth crate).
mush-campaign = { path = "crates/mush-campaign" }
# E7 cut 1 (10b §3.1): TacSim's packs, seed latch and corridor fixture — and since
# 16b cuts R-a/R-b the one game's crate: the pilot sheet and `[tacsim.economy]`,
# and the layer itself under `[tacsim].enabled`.
tacsim = { path = "crates/tacsim" }
# Full server module composition root (extracted from tacsim::composition).
mush-composition = { path = "crates/mush-composition" }
# S1 (14-spatial-implementation-plan §3.1): content packs — the JSON pack format, its
# digest, dependency pinning by version and digest, the entry-kind registry and the
# once-per-pack apply latch with create/update/retire. `mush-content -> {core}` only: it
# knows no object kind and no game system; owners register the entry kinds they decode.
mush-content = { path = "crates/mush-content" }
# S1: the spatial records (regions, neighborhoods, sites, structures, rooms with geometry,
# portals, connections, tiles, features), the rasterizer, the `+atlas` views and
# `@atlas/pack`, and the starter area as shipped content. `mush-atlas -> {core, content,
# proto}` only — no sim, tactics, npc, housing or worldgen edge.
mush-atlas = { path = "crates/mush-atlas" }
mush-testkit = { path = "crates/mush-testkit" }
mush-contract-tests = { path = "crates/mush-contract-tests" }
# M16b: the all-in-one server library reused by both forked halves, plus the
# two forked binaries.
mushd = { path = "crates/mushd" }
mush-gateway = { path = "crates/mush-gateway" }
mush-server = { path = "crates/mush-server" }

[workspace.lints.rust]
unsafe_code = "deny"

# Cut L: documentation links are part of the workspace's navigation contract.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"

# WS01-S12: the panic-shaped restriction lints (`unwrap_used`, `expect_used`,
# `indexing_slicing`, `panic`, `unreachable`, `panic_in_result_fn`) are NOT here
# and must not be added here. `.github/workflows/ci.yml` runs `cargo clippy
# --workspace --all-targets -- -D warnings`, so a `warn` in this table is a hard
# error in every crate and on every target — and none of the six is at zero
# across the whole tree. They are enabled per crate, at the crate root, exactly
# where the measured production count is zero; the measurement, the enabling
# rule and the counts of what stays off are in
# crates/mush-contract-tests/tests/restriction_lints.rs.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"

# Debug and test builds carry line tables only (file and line in every
# backtrace), not the full type and variable records. Measured 2026-10-18 on
# the owner's box: with full debuginfo one link.exe of a test binary peaked at
# 11.3 GB and wrote a 0.9-1.2 GB PDB, so four concurrent links exhausted 40 GB
# of RAM, the local target dir held 464 GB of PDBs, and GitHub's Windows
# runner hit the PDB format's own ceiling (LNK1318/LNK1140). Line tables alone:
# 3 GB a link, PDBs 69 percent smaller, every test unchanged. rust-lld and
# opt-level 1 for dependencies were measured and add little on top.
[profile.dev]
debug = "line-tables-only"
