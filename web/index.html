<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>rustmush</title>
    <script>
      // Stamp the stored theme choice before first paint. Dark is the default
      // when no choice is stored; "system" removes `data-theme` so the
      // prefers-color-scheme media query in app.css decides.
      (function () {
        try {
          var v = localStorage.getItem("rustmush.theme");
          if (v === "dark" || v === "light") {
            document.documentElement.dataset.theme = v;
          } else if (v === "system") {
            delete document.documentElement.dataset.theme;
          } else {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
