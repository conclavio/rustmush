name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Start Redis 8 (Linux only)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name redis -p 6379:6379 redis:8 redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no
          echo "REDIS_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Live Redis authoritative contract (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mush-store --test redis_suite -- --ignored
          cargo test -p mush-server --lib live_redis_wrong_type_bundle_quarantines_repairs_and_recovers -- --ignored
      - name: TS bindings drift check (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mush-proto --features ts --test ts_export
          git diff --exit-code web/src/lib/proto

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
