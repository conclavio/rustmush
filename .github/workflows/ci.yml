name: CI

on:
  push:
    branches: [main]
    # A design-doc or ops-note commit changes nothing a job compiles or tests;
    # docs/help is NOT excluded, because the help topics are loaded at boot and
    # pinned by tests. Each run of this workflow is about an hour of runner
    # time (owner, 2026-10-18: keep the per-commit cost down).
    paths-ignore:
      - "docs/design/**"
      - "docs/*.md"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/design/**"
      - "docs/*.md"
      - "README.md"
  # H3: the `scale` job below runs only on these two triggers.
  workflow_dispatch:
  schedule:
    # Daily (the repo is public, so hosted-runner minutes are free).
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always
  # No incremental artifacts on CI: nothing is rebuilt twice in one run, and
  # they cost disk and memory the hosted runner does not have.
  CARGO_INCREMENTAL: "0"

jobs:
  mind-commerce-acceptance:
    name: M7 ${{ matrix.name }}
    # Daily with the scale job, or by hand: the server story alone paces about
    # 3 s a Registry lease through real maintenance ticks (roughly three hours).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: author and buyer lifecycle
            package: tacsim
            test: minds::bulk::registry_integration_tests::original_purchase::genuine_registry_original_purchase_grant_refund_and_paired_recovery
          - name: server persistence and uncertain acknowledgement
            package: mush-server
            test: world_task::submission_disposition::tests::paid_purchase::genuine_registry_purchase_writer_unknown_expiry_and_recovery
          - name: Conduct and qualified coverage
            package: tacsim
            test: minds::bulk::registry_integration_tests::original_purchase::ic_tests::conduct::genuine_safe_conduct_service_result_and_complete_cold_inverse
          - name: named launch catalogue
            package: tacsim
            test: hardware::flow::launch::story::named_coprates_real_save_rate_house_sale_and_membership_fences
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Real Registry schedules make these unsuitable for the ordinary fast
      # workspace run. Each exact ignored case owns its actual service, native
      # receipt, cold recovery and failure assertions; no synthetic certificate
      # or timing waiver replaces those correctness checks.
      - name: Execute the exact M7 story
        run: cargo test --locked -p ${{ matrix.package }} --lib ${{ matrix.test }} -j 2 -- --ignored --exact --test-threads=1

  mind-author-acceptance:
    name: M6 author story and fresh external pilot comparison
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The runner records one clean revision/run identity, checks independent
      # bot dependencies, executes both real targets, then compares their frozen
      # contexts and intervals. Exact inventory-owned child commands:
      # cargo test -p mush-bot --test arena_mind_author_story -- --ignored --nocapture
      # cargo test -p mush-bot --test arena_mind_port_rate -- --ignored --nocapture
      - name: Validate acceptance artifact comparison
        run: python -B scripts/test_mind_port_acceptance.py
      - name: Complete author story and fresh thirty-match external comparison
        # The script makes its evidence directory without parents, and a fresh
        # runner has built nothing yet, so `target/` itself may not exist.
        # The win-rate parity comparison is report-only under the owner's
        # c58c3d98 exception (17e); the story, decoders and zero mind faults
        # still fail the job.
        run: |
          mkdir -p target
          python scripts/mind_port_acceptance.py run target/m6-acceptance-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-author-acceptance
          path: target/m6-acceptance-evidence/
  mind-full-replay:
    name: M6 full-duration Class III replay
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Recompute all thinks and substeps for twenty-four Class III hulls over 900 seconds
        run: cargo test -p tacsim --lib m6_real_24_class_iii_900s_complete_tape_replays_every_think_and_substep -- --ignored --nocapture
  test:
    runs-on: ubuntu-latest
    # 2026-10-20: the job had no timeout of its own, so GitHub's 360-minute
    # default was the only bound on a hung test binary, and a hang the runner
    # survives is six hours of metered minutes. The whole run took 81 min at
    # e7f2da90 and 94 min at 96cc7303, and the longest shard below is about
    # an hour of it. A lost runner is declared about 44 minutes after it goes
    # silent (job 118758464237 went quiet at 17:02:57Z and was declared lost
    # at 17:47:28Z), so the real budget for work under this bound is about 75
    # minutes.
    timeout-minutes: 120
    # 2026-10-20: THREE SHARDS of one job definition, so that a runner death
    # names the step and the binaries it was linking or running, and takes
    # only its own shard's log with it: the other two shards' logs and
    # monitor readings survive as the comparison, and `fail-fast: false`
    # keeps a death in one from cancelling the others. With the one
    # whole-workspace run, a single loss took every binary's evidence with
    # it (the leading comment below has the eight losses). The check names
    # become `test (tacsim-lib)`, `test (tacsim-integration)` and
    # `test (rest)`; nothing requires a check called `test` (no branch
    # protection and no rulesets on 2026-10-20). Measured at 96cc7303 (run
    # 39413774313), the one test run was 20.5 min of mush-* binaries, 3.9 min
    # of tacsim's lib, 27.4 min of tacsim's 53 integration binaries and
    # 0.4 min of doc-tests, after a 12-minute cold compile; the price of the
    # split is the ~3 min of setup per shard and whatever of the compile the
    # cache does not cover.
    strategy:
      fail-fast: false
      matrix:
        shard:
          # (a) tacsim's lib unit tests (1,275 tests, ~4 min) on two test
          # threads, where the default is four, then tacsim's doc-tests,
          # which shard (c)'s `--exclude tacsim` drops with the lib.
          - tacsim-lib
          # (b) every integration test binary of tacsim (53 files under
          # crates/tacsim/tests/ on 2026-10-20) and the three #[ignore]d
          # mind-hash steps, which run tacsim targets by name.
          - tacsim-integration
          # (c) the rest of the workspace, the bot on its own feature set, the
          # three small steps, and Format and Clippy once.
          - rest
    steps:
      # 2026-10-18: the workspace builds 392 test binaries (157 MB each at
      # opt-level 0 with line-table debuginfo), more than the ~25 GB a hosted
      # runner had free at the workspace, so every run until then died in the
      # Build step with 0 MB free, and the job got easimon/maximize-build-space:
      # an LVM volume spanned over a loop file on the root OS disk and the temp
      # disk, plus 4 GB of swap, mounted at the workspace before checkout.
      #
      # 2026-10-20: that volume is gone. Eight of the twenty pushes to main
      # since 2026-10-18 (3160cdd0, da9618ce, c44c0bb6, e962b662, 4465bf06,
      # 61324cba, 6f797974, eb99c9be) ended with "The hosted runner lost
      # communication with the server", independent of the code (e7f2da90 and
      # 6f797974 ran identical test code; one passed, the other died). A dead
      # job's log archive is BlobNotFound, but the UI kept the live stream of
      # job 118758464237 (eb99c9be): its Test step started 16:58:27Z and its
      # last line is the monitor sample at 17:02:57Z, 4.5 min in, while cargo
      # was still LINKING test binaries -- 81 GB free on the volume, 1.2 GB of
      # memory used, root 1,644 MB free -- and GitHub declared the loss 44 min
      # later, at 17:47:28Z. With that gap subtracted, every one of the eight
      # losses falls in a heavy link phase: the 55-minute one inside the three
      # mind-hash steps (which linked tacsim test binaries with no -j cap), the
      # 58-to-60-minute ones in the first minutes of the Test step's workspace
      # compile (~110 MB/s of binaries for ~7 min). The common factor was the
      # layout: the 61 GB of binaries, /tmp, the swap and the runner agent's
      # own log and diagnostic writes all went through one throttled Azure OS
      # disk by way of a loop device, with the root itself left ~1.6 GB free
      # (which is also why Swatinem/rust-cache's archive download failed with
      # ENOSPC on every run, e.g. run 39371305030 at 04:52:29Z, so every job
      # compiled cold). So the first step below frees the root disk itself --
      # 145 GB, ~86 GB free at job start, ~25 GB more once the preinstalled
      # toolchains this job never uses are removed, against ~61 GB of test
      # binaries for the whole workspace (shard (c), the biggest, builds about
      # 53 GB of them) -- and the build runs on it directly: no LVM, no loop
      # file, no swap.
      #
      # This job runs on Linux only (owner, 2026-10-18): development happens on
      # the owner's Windows box, so a Windows-only break is seen first-hand
      # before any push, and production is Linux; the Windows leg of the matrix
      # also hit the PDB format's ceiling (LNK1318/LNK1140) on the biggest test
      # binaries under full debuginfo. The cross-platform mind-hash gates below
      # still hold: their pins are blessed on Windows, so the Linux run is the
      # cross-platform comparison.
      - name: Free the root disk
        run: |
          df -h /
          free_mb() { df -m / | awk 'NR==2 {print $4}'; }
          before=$(free_mb)
          drop() {
            if [ -d "$1" ]; then
              local was
              was=$(free_mb)
              sudo rm -rf "$1"
              echo "removed $1: $(( $(free_mb) - was )) MB freed"
            fi
          }
          # What easimon/maximize-build-space removed (dotnet, android,
          # haskell, CodeQL, the docker images), then the other large
          # preinstalls the image may carry.
          drop /usr/share/dotnet
          drop /usr/local/lib/android
          drop /opt/ghc
          drop /usr/local/.ghcup
          drop /opt/hostedtoolcache/CodeQL
          before_prune=$(free_mb)
          docker image prune -af > /dev/null 2>&1 || true
          echo "docker image prune: $(( $(free_mb) - before_prune )) MB freed"
          drop /usr/local/share/boost
          drop /usr/share/swift
          for julia in /usr/local/julia*; do drop "$julia"; done
          df -h /
          echo "freed in total: $(( $(free_mb) - before )) MB"
      - uses: actions/checkout@v4
      # WS01-S11B: rust-toolchain.toml at the repo root is the only place in
      # this repo that names a Rust version. `rustup toolchain install` with no
      # argument installs the toolchain that file pins, with the `clippy` and
      # `rustfmt` components it lists, so no job here can drift from it and a
      # bump is one file's diff. `rustc --version` puts the resolved pin in the
      # log beside the gates it is the subject of.
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          # 2026-10-20: the action's automatic key is the job id, not the
          # matrix cell, so without this the three shards would share one key:
          # the first to finish (tacsim-lib, the smallest dependency set) would
          # save it and the other two would restore its subset every run and,
          # finding the key present, never save their own.
          key: ${{ matrix.shard }}
      # 2026-10-20: Format and Clippy run in shard (c) only. Both are
      # workspace-wide (12 s and 3 min 18 s at 96cc7303), so once is the whole
      # answer, and (c) is the shard that compiles the workspace anyway. A
      # format or clippy failure therefore fails `test (rest)`.
      - name: Format
        if: matrix.shard == 'rest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.shard == 'rest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Keep memory-size enforcement scoped to the M7 owners, including
      # standalone integration-test targets as well as library fixtures.
      - name: M7 memory-size limits
        # Its own clippy config (the root's plus the M7 thresholds and
        # avoid-breaking-exported-api = false), so exported-API naming lints
        # are not switched on for every crate the step above lints.
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/clippy-m7
        run: >-
          cargo clippy -p mush-roll -p mush-economy -p mush-market
          -p mush-industry -p mush-core -p tacsim --all-targets --no-deps --
          -D clippy::large_futures -D clippy::large_stack_frames
          -D clippy::large_enum_variant -D clippy::large_types_passed_by_value
      # There is no separate `cargo build --workspace --all-targets` step: it
      # built every test binary a second time beside the Test step's own build
      # (the only example target in the workspace, mush-bot's, is built by its
      # own test step), and the duplicate was what ran the runners out of disk.
      # 2026-10-20: `-j 2` on the three mind-hash steps below. Each links
      # tacsim test binaries, until now with no cap on parallel links (the Test
      # step's `-j 2` never applied to them), and the 55-minute loss fell
      # inside them. They run in shard (b) only, where their targets are built
      # anyway; their `name:` and `run:` lines are the same in every shard's
      # reading of this file, because the gated-test inventory
      # (crates/mush-contract-tests/tests/ci_gated_test_inventory.rs) covers
      # each #[ignore]d test by finding its name here.
      # 17b cut M2.7 (doc 17 D-UM-28): the unit minds' cross-platform pin.
      # The stock corpus flown by the Rhai Standard Doctrine and a float-probe
      # mind, each match's end, final state hash, substep-hash digest and
      # ledger digest pinned on the Windows blessing host; this step runs it
      # on the Linux host against those pins, so a Linux divergence fails here
      # by name. The
      # test is #[ignore]d so the workspace run below does not run it twice;
      # naming it here is what covers it in the gated-test inventory.
      - name: Cross-platform mind hashes (17b cut M2.7; D-UM-28)
        if: matrix.shard == 'tacsim-integration'
        run: cargo test -p tacsim --test minds_rhai m2_the_twin_corpus_hashes_the_same_on_every_host -j 2 -- --ignored --exact --nocapture
      # 17b cut M2.7 (doc 17 §22's M2 gate, "Gate A on whole-match hashes"):
      # the pooled lane's matches flown by T1 and by the Rhai Standard
      # Doctrine alone, every substep hash equal (fifteen T1-v-T1 matches since
      # 17b cut M4.5 retired the twin's T0 column; thirty before). Thirty debug
      # match plays pass the thirty seconds a lane may spend in the workspace
      # run (17b §1 (iii)), so the test is #[ignore]d and run here by name.
      - name: Whole-match mind hashes (17b cut M2.7; Gate A)
        if: matrix.shard == 'tacsim-integration'
        run: cargo test -p tacsim --test twin m2_whole_match_hashes_are_equal_between_the_runners_over_the_pool -j 2 -- --ignored --exact --nocapture
      # 17b cut M4.1 (doc 17 §6 "Execution policy", D-UM-22; the M4 row's
      # gate): the pooled lane's matches through the real arena task on a
      # private think pool of one, two and four workers, each held to the
      # library driven on the task's own wake rule — the tape, the end, the
      # ledger digest and every snapshot's state hash. Fifteen T1-v-T1 matches
      # since 17b cut M4.5 (the test keeps its name): forty-five debug
      # match-runs pass the thirty seconds a lane may spend in the workspace
      # run, so the test is #[ignore]d and run here, by name.
      - name: Pooled think seam over the twin's thirty (17b cut M4.1)
        if: matrix.shard == 'tacsim-integration'
        run: cargo test -p tacsim --test minds_pool m4_real_tasks_over_the_twin_s_thirty_hash_as_the_library -j 2 -- --ignored --exact --nocapture
      # The bot crate is excluded from the workspace test run and tested on its own:
      # its serde_json `arbitrary_precision` feature would otherwise unify into every
      # engine test binary and break untagged number decoding (the worldgen proposal
      # path). See crates/mush-bot/Cargo.toml.
      # The hosted runner is 4 cores and 16 GB. Links are capped at two at a
      # time (a test binary's link is the memory peak).
      # 2026-10-20: the limits and pressure gauges a death would show against,
      # printed once so the monitor's readings can be read against them: the
      # kernel's I/O and memory pressure (PSI) before anything runs, /tmp's
      # size, and the thread/pid ceilings. The runner's agent runs as this
      # same `runner` user, so `max user processes` (`ulimit -u`, which counts
      # threads) is a ceiling its heartbeat shares with the tests; the
      # kernel's threads-max and pid_max are the next ones up; the pids
      # controller of this job's cgroup and of each ancestor (a systemd
      # TasksMax sits on a slice, not on the leaf) is where a per-scope cap
      # would be.
      - name: Runner resources before the test run
        run: |
          nproc; free -m; df -h / /tmp "$GITHUB_WORKSPACE"
          # 2026-10-20: the first PR run (39487330415) died on this line in
          # every shard: the step shell runs with -e, `du` exits 1 when it
          # cannot read other users' directories under /tmp (the message
          # went to /dev/null), and a missing PSI file would fail `cat` the
          # same way. Both are readings, not gates.
          du -sm /tmp 2>/dev/null || true
          cat /proc/pressure/io /proc/pressure/memory 2>/dev/null || true
          ulimit -a
          echo "threads-max $(cat /proc/sys/kernel/threads-max) pid_max $(cat /proc/sys/kernel/pid_max)"
          echo "cgroup $(cat /proc/self/cgroup)"
          p="$(cut -d: -f3 /proc/self/cgroup | head -n 1)"
          while [ -n "$p" ]; do
            echo "/sys/fs/cgroup$p pids.max $(cat "/sys/fs/cgroup$p/pids.max" 2>/dev/null) pids.current $(cat "/sys/fs/cgroup$p/pids.current" 2>/dev/null)"
            p="${p%/*}"
          done
      # 2026-10-20: the monitor, every 10 s into the live log (the UI keeps
      # the stream of a job whose archive is lost, which is how the dead job
      # above was read). Each tick, one line: memory and swap in use, the
      # system-wide thread and process counts, the `runner` user's thread
      # count against its `ulimit -u` (the agent's heartbeat lives under the
      # same cap), cargo and rustc processes and the processes run from
      # target/debug (test binaries, and the mushd/mush-server/mush-gateway
      # some of them spawn), the load average, the I/O and memory pressure
      # (PSI `some avg10`, the share of the last 10 s some task spent stalled
      # on the disk or on memory), free root and workspace disk and /tmp's
      # size (on the root disk); then a second line with the top three
      # processes by RSS. The 30-second free/df loop this replaces showed
      # nothing but a quiet machine in its last sample before the loss
      # (1.2 GB of memory, 81 GB free), which is why the counts and the
      # pressure gauges are here. The shard's own cargo line follows.
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit_u=$(ulimit -u)
          ( while sleep 10; do
              t=$(date -u +%T)
              echo "[monitor $t] $(free -m | awk '/^Mem:/ {m="mem used " $3 "M avail " $7 "M"} /^Swap:/ {s="swap used " $3 "M"} END {print m " " s}') | thr $(ps -eo nlwp= | awk '{s+=$1} END {print s}') proc $(ps -e --no-headers | wc -l) | runner thr $(ps -eo nlwp=,user= | awk '$2 == "runner" {s+=$1} END {print s+0}')/$ulimit_u | cargo $(pgrep -c -x cargo) rustc $(pgrep -c -x rustc) target/debug $(pgrep -c -f '^[^ ]*/target/debug/') | load $(cut -d' ' -f1-3 /proc/loadavg) | psi io $(awk '/^some/ {print substr($2, 7)}' /proc/pressure/io 2>/dev/null) mem $(awk '/^some/ {print substr($2, 7)}' /proc/pressure/memory 2>/dev/null) | root $(df -m / | awk 'NR==2 {print $4}')M ws $(df -m "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')M tmp $(du -sm /tmp 2>/dev/null | cut -f1)M"
              echo "[monitor $t] top rss: $(ps -eo rss=,comm= --sort=-rss | head -n 3 | awk '{printf "%s %dM; ", $2, $1/1024}')"
            done ) &
          case "$SHARD" in
            tacsim-lib)
              # Two test threads, where the default is four.
              RUST_TEST_THREADS=2 cargo test -p tacsim --lib -j 2
              # tacsim's doc-tests, once: shard (c)'s `--exclude tacsim` drops
              # them with the lib.
              cargo test -p tacsim --doc -j 2
              ;;
            tacsim-integration)
              # `--test '*'` (the glob, quoted so cargo and not the shell
              # expands it) is every integration test target and nothing else.
              # `--tests` is not that: cargo's own text is "the library and
              # binaries built as unittests, and integration tests", which
              # would run the 1,275 lib tests a second time here, four threads
              # wide. The lib is built once, as these binaries' dependency.
              cargo test -p tacsim --test '*' --no-fail-fast -j 2
              ;;
            rest)
              cargo test --workspace --exclude mush-bot --exclude tacsim --no-fail-fast -j 2
              ;;
          esac
      - name: Test the bot on its own feature set
        if: matrix.shard == 'rest'
        run: cargo test -p mush-bot -j 2
      # 16b cut R-b: the testkit's toy ruleset is a test-only feature the host crates'
      # dev-dependencies enable; naming it here is what lets the feature census (the
      # `feature_matrix_inventory` gate) see that a job compiles it.
      - name: The testkit toy ruleset
        if: matrix.shard == 'rest'
        run: cargo test -p mush-testkit --features mush-testkit/toy-ruleset
      - name: Panic hook and per-half log files (WS01-S13; the child half is #[ignore]d and spawned by its sibling)
        if: matrix.shard == 'rest'
        run: cargo test -p mushd --test world_panic_exit
      - name: TS bindings drift check
        if: matrix.shard == 'rest'
        run: |
          cargo test -p mush-proto --features ts --test ts_export
          git diff --exit-code web/src/lib/proto

  # WS24-S4 (fu10-1): the Test step's `cargo test --workspace` above compiles
  # every crate exactly ONCE, with its default features. Everything that is off
  # by default is therefore code no job compiles — and `mush-gateway --features
  # tls` is not an optional extra, it is the PRODUCTION build of the proxyless
  # split deploy. Before this job, `tls` appeared nowhere in this file and the
  # native-HTTPS path was first compiled at redeploy on the VPS.
  #
  # The `--features` spelling is NAMESPACED on purpose. Cargo 1.98 does accept
  # a bare `--features tls` across several `-p` flags, but it applies it to
  # whichever selected packages happen to have a feature of that name and says
  # nothing about the ones that do not — so a rename would silently drop a
  # package out of coverage while the job stayed green. `<pkg>/<feature>` names
  # its package, and cargo errors if that package has no such feature. The
  # tripwire below resolves both forms the way cargo does.
  features:
    name: Toggleable features compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Clippy the native-TLS path
        run: cargo clippy -p mush-net-web -p mush-gateway -p mushd --features mush-net-web/tls,mush-gateway/tls,mushd/tls --all-targets -- -D warnings
      - name: Build the proxyless-deploy binaries
        run: cargo build -p mushd -p mush-gateway --features mushd/tls,mush-gateway/tls
      - name: The TLS listener serves
        run: cargo test -p mush-net-web --features tls
      - name: Every toggleable feature is named by a job
        run: cargo test -p mush-contract-tests --test feature_matrix_inventory

  documentation:
    name: Workspace documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Resolve every documentation link
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --document-private-items

  release:
    name: Deployable release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Doc 21 cut G.3b: the SPA carries the cockpit picture's wasm module.
      - run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the embedded SPA
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Exercise the release embed guard and thin LTO with native TLS
        run: cargo build --locked --release -p mushd -p mush-server -p mush-gateway --features mushd/tls,mush-gateway/tls

  # WS25-S6: a new instance is PROVISIONED by rendering
  # `deploy/instance/mushd.toml.tmpl` against an `instance.env`, and until this
  # job existed nothing ran the rendered thing past a TEXT check.
  # `crates/mush-config/tests/shipped_configs.rs` proves the render is complete
  # — every section present, no placeholder left; this proves the config that
  # text parses into is one all three binaries accept and the world half boots.
  # That matters because everything WS04 added is boot-fatal by design: a value
  # either half refuses is a box that does not come up, and the operator hears
  # it from a supervisor watching a boot loop.
  #
  # Pinned to ubuntu on purpose. The shipped `IPC_SOCKET` is a unix path, and
  # `scripts/reset-instance.sh` is a Linux VPS tool.
  provisioning:
    name: Instance provisioning acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      # Renders the shipped `instance.env` file, preflights it under both
      # check sets AND in the real `mush-server` binary, proves a typo'd
      # `receipt_policy` is refused by name, and boots the shipped instance (with
      # `[store].store` overridden to "memory", the one deviation) to an enabled
      # `[tacsim]` block and a hello manifest advertising the game's sheet.
      - name: Render, preflight and boot the shipped instances
        run: cargo test -p mush-server --test provisioning_smoke
      - name: Build the three binaries a deploy installs
        run: cargo build -p mushd -p mush-server -p mush-gateway
      # The SHELL half of the same claim. The Rust test above mirrors the
      # substitution rule; this runs the recipe itself —
      # `deploy/instance/render.sh`, the very script both dev1 deploy scripts
      # call — over EVERY shipped instance.env, with all three binaries'
      # `--check-config` run over each render by the script itself. So the test,
      # the documented recipe and the script a box actually executes cannot
      # drift apart about what a rendered config is, or about whether the
      # binaries accept it.
      - name: Render every shipped instance with the deploy's own render.sh
        run: |
          set -euo pipefail
          mkdir -p rendered
          render() {
            # dev1 commits `EXTERNAL_IP=auto` — a deploy-time marker, not an
            # address — and its deploy scripts rewrite that line with the box's
            # resolved IPv4 into the INSTALLED copy before rendering. Do exactly
            # that, with a documentation address (RFC 5737 TEST-NET-3). An env
            # that already names an address is copied unchanged.
            sed 's|^EXTERNAL_IP=auto$|EXTERNAL_IP=203.0.113.10|' "$1" > "rendered/$2.env"
            bash deploy/instance/render.sh \
              "rendered/$2.env" deploy/instance/mushd.toml.tmpl "rendered/$2.toml" \
              ./target/debug/mush-gateway ./target/debug/mush-server ./target/debug/mushd
            # The marker must never survive into a config a server reads:
            # `[ssh].listen = "auto:6789"` binds nothing and no preflight
            # refuses it, so the symptom would be a box up and answering on no
            # port. (Comment lines are exempt, the same rule render.sh's own
            # completeness grep applies.)
            if grep -n '^[^#]*\bauto\b' "rendered/$2.toml"; then
              echo "the deploy-time EXTERNAL_IP marker reached rendered/$2.toml"
              exit 1
            fi
          }
          render deploy/instance/instance.env.example reference
          render deploy/dev1/instance.env dev1
      # The marker's own negative control. The step above renders from a COPY
      # with the address already resolved, exactly as a deploy does, so on its
      # own it can only say yes — and the case the rule exists for is a hand
      # re-render straight from the COMMITTED file, with no deploy script in the
      # loop, which is what this runs. render.sh must refuse it and leave
      # nothing behind: `[ssh].listen = "auto:6789"` passes every
      # `--check-config` there is and binds no port.
      - name: ...and an unresolved EXTERNAL_IP marker is refused before install
        run: |
          set -euo pipefail
          if bash deploy/instance/render.sh \
               deploy/dev1/instance.env deploy/instance/mushd.toml.tmpl \
               rendered/unresolved.toml ./target/debug/mush-server; then
            echo 'render.sh accepted EXTERNAL_IP=auto: that box answers on no port'
            exit 1
          fi
          if [ -e rendered/unresolved.toml ] || [ -e rendered/unresolved.toml.new ]; then
            echo 'render.sh refused the render but left a file to be installed'
            exit 1
          fi
      # The negative control, at the level this job spends. Without it every
      # step above is a check that can only ever say yes. `receipt_policy` is
      # the value it is written against because it is the one that used to be
      # accepted in silence (pre-WS04-S0), running the box on weaker receipts.
      - name: ...and a typo'd receipt_policy is refused by all three
        run: |
          set -euo pipefail
          sed 's/receipt_policy = "applied"/receipt_policy = "aplied"/' rendered/reference.toml > rendered/broken.toml
          if diff -q rendered/reference.toml rendered/broken.toml > /dev/null; then
            echo 'the template no longer writes receipt_policy = "applied": this control tampers with nothing'
            exit 1
          fi
          for bin in mush-gateway mush-server mushd; do
            if "./target/debug/$bin" --check-config --config rendered/broken.toml; then
              echo "$bin accepted a typo'd receipt_policy"
              exit 1
            fi
          done
      # The disposable-store remedy this step also ships. It cannot be RUN here
      # (it stops a systemd unit, flushes a Redis and rewrites a data dir as
      # root), so what CI holds is that it stays well-formed and clean. The
      # render and the two dev1 deploy scripts are parsed for the same reason —
      # they run as root on a box nobody wants to debug at 2am — but only
      # `bash -n`: they have never been through `shellcheck`, and a gate is
      # added with its findings fixed, not with a backlog attached.
      - name: The instance reset and deploy scripts are well-formed
        run: |
          bash -n scripts/reset-instance.sh
          shellcheck scripts/reset-instance.sh
          bash scripts/tests/reset-instance.sh
          bash -n deploy/instance/render.sh
          bash -n deploy/dev1/deploy.sh
          bash -n deploy/dev1-split/deploy.sh
          bash scripts/tests/check-web-bundle.sh

  kernel-contracts:
    name: K8 kernel contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Five-gate and lifecycle contracts
        run: |
          cargo test -p mush-contract-tests --lib
          cargo test -p mush-contract-tests --test gate5_fault_matrix
          cargo test -p mush-contract-tests --test schedule_source
          cargo test -p mush-contract-tests --test ci_gated_test_inventory
      # The live provider remains an explicit, owner-funded opt-in. This exact
      # test filter exercises its report path with no external provider or key.
      - name: The LLM cost report with a mock provider
        env:
          TACSIM_LLM_COST_RUN: "1"
          TACSIM_LLM_COST_MOCK: "1"
          TACSIM_LLM_COST_MINUTES: "0.1"
          TACSIM_LLM_COST_UNITS: "4"
        run: cargo test -p tacsim --test harness tacsim_harness_llm_cost_run -- --exact --nocapture
      # WS01-S11: the world task must never panic, so the number of places it
      # could is budgeted per crate under panic_budget/ and only a reviewed
      # diff raises one. The same target refuses `panic = "abort"`, which would
      # make WS01-S4's catch_unwind boundary inert. It also runs under the
      # cross-platform `test` job's `--workspace`; it is named here so the log
      # says which contract failed.
      - name: The production panic surface and the panic=abort firewall
        run: cargo test -p mush-contract-tests --test panic_budget
      # WS01-S12: the other half of the same rule. Where a crate's production
      # count for one of the six panic-shaped restriction lints is already zero,
      # its crate root denies that lint and the compiler holds it there. This
      # target carries the measurement the per-crate sets were cut from, and
      # fails if a root drops a deny, if a deny appears that the record does not
      # back, if an `#[allow]` under src/ takes an enabled lint back, or if a new
      # crate arrives unmeasured.
      - name: The per-crate restriction lints
        run: cargo test -p mush-contract-tests --test restriction_lints
      # 10b §14.3 criterion 4 (E7 cut 11 independent verify fold, G5/F7): every
      # E7k lane's proof must run in a package that can SEE the crate that owns
      # the lane. `mush-contract-tests` declares no `mush-industry` dependency,
      # so L4 (`industry.workorder`) is proven by the industry suite itself —
      # the `industry.workorder.completed` boundary fact and the production
      # source's cursor.
      - name: E7k lane proofs
        run: |
          cargo test -p mush-industry --test e7c4
      - name: Production migrations and compatibility declarations
        run: |
          cargo test -p mush-server --test production_action_migrations
          cargo test -p mush-server --lib k8_5_production_compositions_publish_command_compatibility
          # WS04-S8: the gate above composes `boot::game_modules` — the roster a
          # server boots — instead of a hand-assembled list. This second cell is
          # the ordered golden of that roster, so a module added, dropped or
          # reordered fails a named test here rather than being re-certified in
          # silence.
          cargo test -p mush-server --lib the_ci_gated_composition_is_the_boot_composition

  redis-faults:
    name: K8 Redis and process-fault matrix
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Start disposable Redis 8
        run: docker run -d --rm --name redis -p 127.0.0.1:6379:6379 redis:8 redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no
      - name: Redis store and boot fault contracts
        run: |
          cargo test -p mush-store --test redis_suite -- --ignored --test-threads=1
          cargo test -p mush-server --lib persist::tests::live_redis_wrong_type_bundle_quarantines_repairs_and_recovers -- --ignored --exact
          cargo test -p mush-server --lib redis_round_trip_preserves_exact_generations -- --ignored
          cargo test -p mush-server --test authoritative_boot -- --test-threads=1
      - name: Split-process kill and restart recovery
        run: |
          cargo test -p mush-gateway --test authoritative_process_kill -- --test-threads=1
          cargo test -p mushd --test durability_e2e kill9_mid_play_world_survives_redis_gated -- --exact --test-threads=1
          cargo test -p mushd --test durability_e2e relay_queue_and_frozen_leg_survive_process_death_redis_gated -- --exact --test-threads=1
      # 08j S4: without these the seven `*_redis_gated` proofs in
      # `crates/mushd/tests/persistence.rs` and the two single-test twins take
      # their missing-`REDIS_URL` early return and pass everywhere as a silent
      # skip. `crates/mush-contract-tests/tests/ci_gated_test_inventory.rs`
      # keeps this list honest.
      - name: Reboot-from-Redis-alone round trips
        run: |
          cargo test -p mushd --test persistence -- --test-threads=1
          cargo test -p mushd --test m10c_e2e m10c_persistence_twin_redis_gated -- --exact --test-threads=1

  # H3 (11-h §3.3): the scale harness — cold journal replay, world boot,
  # the authoritative write-through soak and the tick-shaped bundle. Every
  # test is `#[ignore]`; this job is the only thing that runs them, on demand
  # or daily, never on push. It is report-only by design (D-H-8): a shared
  # runner's speed is not a threshold, so read the `scale_*:` lines in the log.
  # Run the harness locally with `SCALE_ASSERT=1` to assert the thresholds.
  # Redis twins use logical dbs 1 and 2.
  scale:
    name: H3 scale harness
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Start disposable Redis 8
        run: docker run -d --rm --name redis -p 127.0.0.1:6379:6379 redis:8 redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no
      - name: Scale harness
        run: cargo test --release -p mush-contract-tests --test scale_harness -- --ignored --test-threads=1 --nocapture

  # 16b cut AJ.4 (16c Q-AJ1): the external bot's win rate against the machine
  # — ten 1 v 1 matches flown by the real mush-bot binary, no model, against a
  # server booted in its own test binary, the tanks re-posed 500 m apart before
  # every match. REPORT-ONLY: it asserts only that ten matches finished; the
  # figure is the `WIN RATE:` line and one `match` line each in the log (the
  # owner's target is seven in ten; below it is input for a later machine cut,
  # 16c Q-AJ5, not a failure). About seventy-five minutes, so it runs on
  # demand only, never on push or on the daily schedule. It is the only job
  # that runs `arena_win_rate`, which is `#[ignore]` for exactly that reason.
  # Its sibling bot-muster-rate (below) flies the same bot from the muster.
  bot-win-rate:
    name: Bot win rate against the machine (report-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      # The live commander lane `arena_live_commander_five_matches`
      # (crates/mush-bot/tests/arena_live_commander.rs) is deliberately run by
      # no job: it spends real money and CI never sets its variables (16c
      # Q-AK4); naming it here is what the gated-test inventory asks of every
      # ignored test. The lead runs it by hand with the key exported:
      # MUSH_BOT_LIVE_COMMANDER=1 cargo test -p mush-bot --test arena_live_commander -- --ignored --nocapture
      # 17b cut M1b.5: the same target's mind lane,
      # `the_bot_against_a_conditioned_t1_over_thirty_pooled_matches` (thirty
      # matches against the native stock mind, two to four hours), is the M1b
      # gate's measure and run by hand, so this job names its own lane:
      # cargo test -p mush-bot --test arena_win_rate the_bot_against_a_conditioned_t1_over_thirty_pooled_matches -- --ignored --nocapture
      - name: Bot win rate
        run: cargo test -p mush-bot --test arena_win_rate arena_win_rate_over_ten_matches -- --ignored --nocapture

  # 16b cut AN.1 (16c Q-AN2): the bot's win rate from the shipped muster: ten
  # 1 v 1 matches flown by the real mush-bot binary, no model, no pose, on a
  # 600 s cap. This is the figure of record from cut AN on; the posed lane
  # above stays as the duel benchmark. REPORT-ONLY: it asserts only that ten
  # matches finished; the figure is the `WIN RATE FROM THE MUSTER:` line, one
  # `match` line each and the reading lines in the log. Up to about two hours,
  # so it runs on demand only, never on push or on the daily schedule. It is
  # the only job that runs `arena_muster_rate`, which is `#[ignore]` for exactly
  # that reason.
  bot-muster-rate:
    name: Bot win rate from the muster (report-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Bot win rate from the muster
        run: cargo test -p mush-bot --test arena_muster_rate -- --ignored --nocapture

  # 16b cut H (§5, H3): the TacSim scale harness — doc 16 §1's A2 acceptance.
  # It composes the production composition root in a memory-store test world,
  # generates a relief from TACSIM_SEED, applies it through the atlas's pack
  # route, and measures the ground pulse, `Arena::step` on the fielded catalog
  # at the CI reach and at the authored reach, a long run, a 24-pilot
  # fan-out, the 12 v 12 lance lane (`tacsim_harness_lance`, 16b cut Z.1) and
  # the minds lane (`tacsim_harness_arena_minds`, 17b cut M4.2: the cohort as
  # unit minds in four variants, fill first, on a real think pool)
  # (`harness_*:` lines in the log, `harness*.json` uploaded). Every
  # test is `#[ignore]`; this job is the only CI job that runs them, on demand
  # or daily, never on push, and no Redis is involved. Since 17b cut M4.5
  # every lane fields unit minds at the ROM (Class 0, the native stock mind)
  # where it fielded the reflex controller — the report's `motor` and
  # `minds.states_at_end` objects where `reflex` was.
  #
  # The absolutes are REPORT-ONLY here (D-H-8, D-16-19): this is
  # `ubuntu-latest`, a shared runner, and a shared runner's speed is not a
  # threshold — so there is no TACSIM_ASSERT on this job. What gates it is the
  # delta (16b cut U.3, 16c T-37 and Q29): the second step compares the fresh
  # CI-cohort report with the committed
  # crates/tacsim/tests/harness_baseline/arena.<os>.json and is THE ONE STEP
  # THAT FAILS THE JOB ON A MEASUREMENT — on any difference in the deterministic
  # block, or on a timing figure more than 20 per cent slower on the host that
  # blessed the file. (The first step fails on a correctness lane alone: the
  # sight differential, 16b cut J.1, asserts on every pair always.) The GitHub
  # runner never is that host, so here the delta gates the
  # deterministic block alone — for real since 17b cut M4.5, whose one bless
  # was made on a Linux host (arena.linux.json, the owner's ruling of
  # 2026-10-08), with the minds lane's four blocks folded in beside it.
  # TACSIM_BASELINE_BLESS=1 re-blesses the file.
  #
  # scripts/harness-weekly.sh runs the same two cargo lines by hand with
  # TACSIM_ASSERT=1, which asserts the absolutes on the owner's own box
  # (D-16-19: assert locally). The two lines below and the script's must stay
  # equal; the environment is where the two differ.
  #
  # Size it with TACSIM_UNITS / TACSIM_ARENA_S / TACSIM_LONG_RUN_S / TACSIM_FIGHTING /
  # TACSIM_SEED / TACSIM_SENSOR_CELLS / TACSIM_SHARE_CELLS /
  # TACSIM_WAKE_JITTER_MS (TACSIM_PULSES sizes the ground-pulse lane only;
  # TACSIM_MINDS_JITTER_MS and TACSIM_MINDS_JITTER_PER_MILLE the minds lane's
  # late wakes, 17b cut M4.2). The delta reads harness-arena.json, and the four
  # harness-minds-<variant>.json once the baseline's `minds` carries their
  # blocks (17b cut M4.5's bless folds them, and refuses a stale one): an
  # arena knob at other than its default is a different run, and its delta says
  # so; TACSIM_LONG_RUN_S and TACSIM_PULSES size lanes the delta does not read.
  tacsim-harness:
    name: 16b cut H TacSim harness
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      TACSIM_JSON: harness.json
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: TacSim harness
        run: cargo test --release -p tacsim --test harness -- --ignored --test-threads=1 --nocapture --skip tacsim_harness_delta_against_the_committed_baseline
      - name: Compare with the committed baseline
        run: cargo test --release -p tacsim --test harness tacsim_harness_delta_against_the_committed_baseline -- --exact --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tacsim-harness-report
          path: harness*.json
          if-no-files-found: error

  definition-wire-fixtures:
