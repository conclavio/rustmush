  truth-serialization-policy:
    name: K8 truth-serialization policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Private truth has no serde contract
        run: cargo test -p mush-contract-tests --test truth_serialization_policy
      - name: Public action surfaces stay redacted
        run: |
          cargo test -p mush-core offer::tests::projected_offer_hides_internal_binding_and_builds_server_parameters -- --exact
          cargo test -p mush-contract-tests tests::brace_offer_projects_no_hidden_clock_and_routes_to_the_same_provider -- --exact
          cargo test -p mush-contract-tests tactical_gate::tests::tactical_keyframe_line_receipt_and_llm_surfaces_share_one_redacted_dto -- --exact
          cargo test -p mush-server --test split_boundary ipc_authoritative_action::authenticated_action_transfers_ownership_only_after_exact_intent -- --exact
          cargo test -p mush-gateway --lib bridge_common::projection_tests::line_action_list_renders_only_projected_presentation -- --exact
          cargo test -p mush-net-ssh --lib tui::render::tests::view_rows_reproduce_actions_and_never_leak_undeclared_fields -- --exact

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Doc 21 cut G.3b: `npm test` and `npm run build` build the cockpit
      # picture's WebAssembly module first (web/scripts/build-wasm.mjs), so
      # this job needs the pinned toolchain and its wasm32 target.
      - name: Rust toolchain (pinned by rust-toolchain.toml) and the wasm target
        working-directory: .
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Source commit stamp
        run: node --test scripts/stamp-commit.test.mjs
      - name: Build
        run: npm run build
