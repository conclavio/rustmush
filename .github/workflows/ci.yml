name: CI

on:
  push:
    branches: [main]
  pull_request:
  # H3: the `scale` job below runs only on these two triggers.
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: TS bindings drift check (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mush-proto --features ts --test ts_export
          git diff --exit-code web/src/lib/proto

  kernel-contracts:
    name: K8 kernel contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Five-gate and lifecycle contracts
        run: |
          cargo test -p mush-contract-tests --lib
          cargo test -p mush-contract-tests --test gate5_fault_matrix
          cargo test -p mush-contract-tests --test schedule_source
      - name: Production migrations and compatibility declarations
        run: |
          cargo test -p mush-server --test production_action_migrations
          cargo test -p mush-server --lib k8_5_production_compositions_publish_command_compatibility

  redis-faults:
    name: K8 Redis and process-fault matrix
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start disposable Redis 8
        run: docker run -d --rm --name redis -p 127.0.0.1:6379:6379 redis:8 redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no
      - name: Redis store and boot fault contracts
        run: |
          cargo test -p mush-store --test redis_suite -- --ignored --test-threads=1
          cargo test -p mush-server --lib persist::tests::live_redis_wrong_type_bundle_quarantines_repairs_and_recovers -- --ignored --exact
          cargo test -p mush-server --lib redis_round_trip_preserves_exact_generations -- --ignored
          cargo test -p mush-server --test authoritative_boot -- --test-threads=1
      - name: Split-process kill and restart recovery
        run: |
          cargo test -p mush-gateway --test authoritative_process_kill -- --test-threads=1
          cargo test -p mushd --test durability_e2e kill9_mid_play_world_survives_redis_gated -- --exact --test-threads=1
      # 08j S4: without these the seven `*_redis_gated` proofs in
      # `crates/mushd/tests/persistence.rs` and the two single-test twins take
      # their missing-`REDIS_URL` early return and pass everywhere as a silent
      # skip. `crates/mush-contract-tests/tests/ci_gated_test_inventory.rs`
      # keeps this list honest.
      - name: Reboot-from-Redis-alone round trips
        run: |
          cargo test -p mushd --test persistence -- --test-threads=1
          cargo test -p mushd --test m10c_e2e m10c_persistence_twin_redis_gated -- --exact --test-threads=1
          cargo test -p mushd --test shadowrun_e2e sr5_sheet_survives_redis_reboot_gated -- --exact --test-threads=1

  # H3 (11-h §3.3): the scale harness — cold journal replay, world boot,
  # the authoritative write-through soak and the tick-shaped bundle. Every
  # test is `#[ignore]`; this job is the only thing that runs them, on demand
  # or weekly, never on push. It is report-only by design (D-H-8): a shared
  # runner's speed is not a threshold, so read the `scale_*:` lines in the log.
  # Run the harness locally with `SCALE_ASSERT=1` to assert the thresholds.
  # Redis twins use logical dbs 1 and 2.
  scale:
    name: H3 scale harness
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start disposable Redis 8
        run: docker run -d --rm --name redis -p 127.0.0.1:6379:6379 redis:8 redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no
      - name: Scale harness
        run: cargo test --release -p mush-contract-tests --test scale_harness -- --ignored --test-threads=1 --nocapture

  definition-wire-fixtures:
    name: K8 definition and wire fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Canonical definition and action wire goldens
        run: |
          cargo test -p mush-core mechanics::tests::canonical_encoding_and_digest_have_a_golden_wire_contract -- --exact
          cargo test -p mush-core mechanics::tests::definition_identity_and_registry_fingerprint_have_golden_contracts -- --exact
          cargo test -p mush-core action::tests::request_uid_wire_form_is_fixed_and_strict -- --exact
          cargo test -p mush-core authoritative::tests::key_and_bundle_wire_are_strict -- --exact
          cargo test -p mush-core clock::tests::clock_stamp_wire_shape_is_strict_and_cross_clock_math_fails -- --exact
          cargo test -p mush-contract-tests tests::definitions_are_stable_and_installed_exactly -- --exact
      - name: Generated protocol bindings are current
        run: |
          cargo test -p mush-proto --features ts --test ts_export
          git diff --exit-code web/src/lib/proto

  direct-rand-policy:
    name: K8 direct-rand policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mush-contract-tests --test provider_rng_policy

  truth-serialization-policy:
    name: K8 truth-serialization policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Private truth has no serde contract
        run: cargo test -p mush-contract-tests --test truth_serialization_policy
      - name: Public action surfaces stay redacted
        run: |
          cargo test -p mush-core offer::tests::projected_offer_hides_internal_binding_and_builds_server_parameters -- --exact
          cargo test -p mush-contract-tests tests::brace_offer_projects_no_hidden_clock_and_routes_to_the_same_provider -- --exact
          cargo test -p mush-contract-tests tactical_gate::tests::tactical_keyframe_line_receipt_and_llm_surfaces_share_one_redacted_dto -- --exact
          cargo test -p mush-server --test ipc_authoritative_action authenticated_action_transfers_ownership_only_after_exact_intent -- --exact
          cargo test -p mush-gateway --lib bridge_common::projection_tests::line_action_list_renders_only_projected_presentation -- --exact
          cargo test -p mush-net-ssh --lib tui::render::tests::view_rows_reproduce_actions_and_never_leak_undeclared_fields -- --exact

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
